  owner: admin-control-plane
  route_scope: admin
  delivery_kind: sdk_backed_business_runtime
  api_surface: backend
  operation_routes:
  - /admin/prompts
  required_tables:
  - ai_prompt
  - ai_prompt_version
  - ai_prompt_binding
