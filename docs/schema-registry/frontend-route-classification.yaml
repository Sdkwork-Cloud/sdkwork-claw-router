schema: sdkwork-clawrouter-frontend-route-classification
version: 0.1.0
source: apps/sdkwork-clawrouter-pc/src/App.tsx
rule: every actual portal route declares whether it is SDK-backed runtime, schema-provenanced content, or a gated local developer
  tool surface.
routes:
- route: /
  package: "@sdkwork/clawrouter-pc-home"
  owner: public-portal
  route_scope: public
  delivery_kind: schema_provenanced_content
  provenance_tables:
  - ai_model
  - ai_model_vendor
  static_delivery:
    mode: curated_seed_content
    refresh_policy: manual_content_release
    max_staleness: release_bound
    upgrade_triggers:
    - user_personalization
    - tenant_specific_data
    - authoring_workflow
    source_manifest_ref: static-route:/
  evidence:
  - generated/schema/manifest/schema-manifest.json
  - docs/schema-registry/frontend-field-contracts.yaml
  - apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-home/src/pages/Home.tsx
- route: /admin/prompts
