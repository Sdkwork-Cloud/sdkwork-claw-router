schema: sdkwork-claw-router-frontend-route-classification
version: 0.1.0
source: apps/sdkwork-claw-router-portal/src/App.tsx
rule: every actual portal route declares whether it is SDK-backed runtime, schema-provenanced content, or a gated local developer tool surface.

routes:
  - route: /
    package: sdkwork-claw-router-home
    owner: public-portal
    route_scope: public
    delivery_kind: schema_provenanced_content
    provenance_tables: [content_doc_page, plus_app]
    static_delivery:
      mode: curated_seed_content
      refresh_policy: manual_content_release
      max_staleness: release_bound
      upgrade_triggers: [user_personalization, tenant_specific_data, authoring_workflow]
      source_manifest_ref: "static-route:/"
    evidence:
      - generated/schema/manifest/schema-manifest.json
      - docs/schema-registry/frontend-field-contracts.yaml
      - apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-home/src/pages/Home.tsx

  - route: /admin/announcement
    package: sdkwork-claw-router-admin-announcement
