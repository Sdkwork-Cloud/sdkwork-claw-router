tables:
- table: integration_provider_invoice_import
  domain: integration
  profile: upstream_provider_invoice_import
  compliance_level: L3
  system_of_record: true
  write_owner: reconciliation-worker
  common_columns: event_log
  source_tables:
  - integration_service_provider
  - ai_channel
  frontend_routes:
  - /admin/service-providers/reconciliation
  api_surfaces:
  - backend
  - worker
  columns:
    import_no: string(128)
    provider_code: string(64)
    provider_account_id: int64
    period_start: instant
    period_end: instant
    currency: string(10)
    total_amount: decimal
    source_file_ref: string(512)
    source_hash: string(128)
    import_status: enum_int32
  indexes:
  - name: uk_integration_provider_invoice_import_no
    unique: true
    columns:
    - tenant_id
    - organization_id
    - import_no
  - name: idx_integration_provider_invoice_import_provider_period
    columns:
    - tenant_id
    - organization_id
    - provider_code
    - period_start
    - period_end
    - id
  security:
    financial: true
    audit_required: true
- table: integration_provider_invoice_item
  domain: integration
  profile: upstream_provider_invoice_item
  compliance_level: L3
  system_of_record: true
  write_owner: reconciliation-worker
  common_columns: event_log
  source_tables:
  - integration_provider_invoice_import
  - ai_usage_fact
  frontend_routes:
  - /admin/service-providers/reconciliation
  api_surfaces:
  - backend
  - worker
  columns:
    import_id: int64
    provider_request_id: string(256)
    provider_usage_id: string(256)
    model: string(128)
    billing_meter_code: string(64)
    quantity: decimal
    amount: decimal
    currency: string(10)
    raw_payload_hash: string(128)
    match_status: enum_int32
  indexes:
  - name: idx_integration_provider_invoice_item_import
    columns:
    - tenant_id
    - organization_id
    - import_id
    - match_status
    - id
  - name: idx_integration_provider_invoice_item_request
    columns:
    - tenant_id
    - organization_id
    - provider_request_id
    - id
  security:
    financial: true
    audit_required: true
