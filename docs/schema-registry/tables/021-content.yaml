- table: content_forum_post
  domain: content
  profile: retired_projection
  compliance_level: L2
  system_of_record: false
  write_owner: legacy-static-fixture
  common_columns: user_entity
  generated_by_this_project: false
  frontend_routes: []
  api_surfaces: []
  superseded_by: plus_feeds
  retirement_reason: Forum writes and app APIs align to Java PlusFeeds. Keep this historical contract documented only; do not generate a physical table for the new Rust application.
  columns:
    title: string(200)
    body: text
    content_snippet: string(512)
    category: string(64)
    tags: json
    author_id: int64
    author_snapshot: json
    like_count: int64
    comment_count: int64
    view_count: int64
    pinned: bool
    last_replied_at: instant
  indexes:
  - name: idx_content_forum_post_category_status
    columns:
    - category
    - status
    - pinned
    - updated_at
    - id
  - name: idx_content_forum_post_author
    columns:
    - author_id
    - created_at
    - id
- table: content_forum_comment
  domain: content
  profile: retired_projection
  compliance_level: L2
  system_of_record: false
  write_owner: legacy-static-fixture
  common_columns: user_entity
