tables:
- table: content_announcement
  domain: content
  profile: content_entity
  compliance_level: L2
  system_of_record: true
  write_owner: content-service
  common_columns: tenant_entity
  frontend_routes:
  - /console/dashboard
  - /admin/announcement
  api_surfaces:
  - app
  - backend
  columns:
    title: string(200)
    content: text
    target_scope: enum_int32
    audience_filter: json
    announcement_type: enum_int32
    pinned: bool
    published_at: instant
    effective_from: instant
    effective_to: instant
  indexes:
