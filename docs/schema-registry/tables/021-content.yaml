  superseded_by: plus_comments
  retirement_reason: Forum and course comments align to Java PlusComments. Keep this historical contract documented only; do not generate a physical table for the new Rust application.
  columns:
    target_type: enum_int32
    target_id: int64
    post_id: int64
    course_id: int64
    parent_id: int64
    root_id: int64
    body: text
    author_id: int64
    author_snapshot: json
    like_count: int64
  indexes:
  - name: idx_content_forum_comment_post
    columns:
    - post_id
    - parent_id
    - created_at
    - id
  - name: idx_content_forum_comment_target
    columns:
    - target_type
    - target_id
    - parent_id
    - created_at
    - id
