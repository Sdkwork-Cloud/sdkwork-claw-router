tables:
- table: content_announcement
  domain: content
  profile: content_entity
  compliance_level: L2
  system_of_record: true
  write_owner: content-service
  common_columns: tenant_entity
  frontend_routes:
  - /console/dashboard
  - /admin/announcement
  api_surfaces:
  - app
  - backend
  columns:
    title: string(200)
    content: text
    target_scope: enum_int32
    audience_filter: json
    announcement_type: enum_int32
    pinned: bool
    published_at: instant
    effective_from: instant
    effective_to: instant
  indexes:
  - name: idx_content_announcement_target_status
    columns:
    - tenant_id
    - organization_id
    - target_scope
    - status
    - published_at
    - id
- table: content_doc_page
  domain: content
  profile: content_entity
  compliance_level: L2
  system_of_record: true
  write_owner: docs-service
  common_columns: tenant_entity
  frontend_routes:
  - /
  - /product-docs
  - /docs
  - /api-reference
  - /sdk-reference
  api_surfaces:
  - app
  - backend
  columns:
    doc_code: string(64)
    doc_type: enum_int32
    title: string(200)
    slug: string(256)
    path: string(512)
    summary: string(512)
    content_source: enum_int32
    source_ref: string(512)
    content_hash: string(128)
    sort_order: int32
    published_at: instant
  indexes:
  - name: uk_content_doc_page_type_slug
    unique: true
    columns:
    - doc_type
    - slug
- table: content_openapi_snapshot
  domain: content
  profile: projection
  compliance_level: L2
  system_of_record: false
  write_owner: api-docs-pipeline
  common_columns: projection
  source_refs:
  - spring-ai-plus-open-api
  - legacy-java-plus-app-api
  - legacy-java-plus-backend-api
  - generated-openapi-json
  frontend_routes:
  - /product-docs
  - /docs
  - /api-reference
  - /sdk-reference
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    api_system: enum_int32
    api_surface: enum_int32
    version: string(64)
    title: string(200)
    source_ref: string(512)
    openapi_hash: string(128)
    endpoint_count: int32
    category_tree: json
    example_manifest: json
    published_at: instant
  indexes:
  - name: uk_content_openapi_snapshot_system_version
    unique: true
    columns:
    - api_system
    - version
  - name: idx_content_openapi_snapshot_system_published
    columns:
    - api_system
    - published_at
    - id
- table: content_sdk_release
  domain: content
  profile: content_entity
  compliance_level: L2
  system_of_record: false
  write_owner: sdk-release-pipeline
  common_columns: tenant_entity
  frontend_routes:
  - /docs
  - /sdk-reference
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    api_system: enum_int32
    language: string(64)
    language_icon: string(128)
    language_description: string(512)
    package_name: string(128)
    package_manager: string(64)
    version: string(64)
    install_command: string(512)
    import_code: text
    init_code: text
    example_code: text
    github_url: string(1024)
    source_repo: string(512)
    docs_url: string(1024)
    openapi_snapshot_id: int64
    default_base_url: string(512)
    artifact_manifest: json
    example_manifest: json
    published_at: instant
  indexes:
  - name: uk_content_sdk_release_system_lang_version
    unique: true
    columns:
    - api_system
    - language
    - version
  - name: idx_content_sdk_release_system_lang_published
    columns:
    - api_system
    - language
    - published_at
    - id
- table: content_reaction
  domain: content
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: content-engagement-service
  common_columns: event_log
  frontend_routes:
  - /courses
  - /courses/:id
  - /admin/courses
  - /admin/courses/dashboard
  - /admin/courses/engagement
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    target_type: enum_int32
    target_id: int64
    reaction_type: enum_int32
    reaction_value: string(64)
    client_ip_hash: string(128)
    user_agent_hash: string(128)
    cancelled_at: instant
  indexes:
  - name: uk_content_reaction_user_target_type
    unique: true
    columns:
    - tenant_id
    - organization_id
    - user_id
    - target_type
    - target_id
    - reaction_type
  - name: idx_content_reaction_target_type
    columns:
    - target_type
    - target_id
    - reaction_type
    - created_at
    - id
