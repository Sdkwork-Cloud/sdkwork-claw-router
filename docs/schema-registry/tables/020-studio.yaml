tables:
- table: studio_catalog_action
  domain: studio
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: portal-content-service
  common_columns: event_log
  frontend_routes:
  - /apps
  - /apps/:id
  - /skills-hub
  - /skills-hub/:id
  - /admin/app
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    target_type: enum_int32
    target_id: int64
    release_id: int64
    action_type: enum_int32
    rating_score: decimal
    review_title: string(200)
    review_body: text
    client_ip_hash: string(128)
    user_agent_hash: string(128)
  indexes:
  - name: idx_studio_catalog_action_target_type
    columns:
    - target_type
    - target_id
    - action_type
    - created_at
    - id
  - name: idx_studio_catalog_action_user
    columns:
    - tenant_id
    - organization_id
    - user_id
    - action_type
    - created_at
    - id
- table: studio_catalog_asset
  domain: studio
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: portal-content-service
  common_columns: tenant_entity
  frontend_routes:
  - /apps
  - /apps/:id
  - /skills-hub
  - /skills-hub/:id
  - /admin/app
  - /admin/skill
  api_surfaces:
  - app
  - backend
  columns:
    target_type: enum_int32
    target_id: int64
    artifact_id: int64
    asset_type: enum_int32
    asset_url: string(1024)
    thumbnail_url: string(1024)
    title: string(200)
    alt_text: string(500)
    mime_type: string(128)
    width: int32
    height: int32
    duration_seconds: decimal
    file_size: int64
    sort_order: int32
    published_at: instant
  indexes:
  - name: idx_studio_catalog_asset_target
    columns:
    - tenant_id
    - organization_id
    - target_type
    - target_id
    - asset_type
    - sort_order
    - id
  - name: idx_studio_catalog_asset_artifact
    columns:
    - tenant_id
    - organization_id
    - artifact_id
    - sort_order
    - id
  - name: idx_studio_catalog_asset_seed_source
    columns:
    - tenant_id
    - organization_id
    - status
    expressions:
    - metadata ->> 'itemType'
    - metadata ->> 'sourceHash'
    where: deleted_at IS NULL
  - name: idx_studio_catalog_asset_seed_kind
    columns:
    - tenant_id
    - organization_id
    - target_type
    expressions:
    - metadata ->> 'seedKind'
    - metadata ->> 'itemType'
    where: deleted_at IS NULL
- table: studio_catalog_artifact
  domain: studio
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: portal-content-service
  common_columns: tenant_entity
  frontend_routes:
  - /apps
  - /apps/:id
  - /skills-hub
  - /skills-hub/:id
  - /admin/app
  - /admin/skill
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    target_type: enum_int32
    target_id: int64
    artifact_type: enum_int32
    version: string(64)
    platform_type: string(64)
    os_name: string(64)
    artifact_ref: string(512)
    artifact_url: string(1024)
    artifact_size_bytes: int64
    runtime: string(128)
    frameworks: json
    license_name: string(128)
    checksum_hash: string(128)
    release_notes: text
    published_at: instant
    deprecated_at: instant
  indexes:
  - name: idx_studio_catalog_artifact_target
    columns:
    - tenant_id
    - organization_id
    - target_type
    - target_id
    - status
    - published_at
    - id
  - name: uk_studio_catalog_artifact_version
    unique: true
    columns:
    - tenant_id
    - organization_id
    - target_type
    - target_id
    - artifact_type
    - version
    - platform_type
    - os_name
  - name: idx_studio_catalog_artifact_seed_source
    columns:
    - tenant_id
    - organization_id
    - status
    expressions:
    - metadata ->> 'itemType'
    - metadata ->> 'sourceHash'
    where: deleted_at IS NULL
  - name: idx_studio_catalog_artifact_seed_kind
    columns:
    - tenant_id
    - organization_id
    - target_type
    expressions:
    - metadata ->> 'seedKind'
    - metadata ->> 'itemType'
    where: deleted_at IS NULL
- table: studio_app_template
  domain: studio
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: app-center-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/app
  api_surfaces:
  - backend
  - worker
  columns:
    template_no: string(64)
    template_code: string(128)
    template_name: string(255)
    description: text
    category_id: int64
    category_code: string(128)
    template_type: string(64)
    runtime: string(128)
    framework: string(128)
    language: string(64)
    icon_url: string(1024)
    cover_url: string(1024)
    visibility: enum_int32
    publish_status: enum_int32
    featured: bool
    sort_weight: int32
    owner_user_id: int64
    source_app_id: int64
    git_repo_url: string(1024)
    git_ref: string(128)
    git_sub_path: string(1024)
    current_version_id: int64
    app_config_schema: json
    default_app_config: json
    variable_schema: json
    dependency_manifest: json
    capability_manifest: json
    metadata: json
    published_at: instant
    deprecated_at: instant
  indexes:
  - name: uk_studio_app_template_no
    unique: true
    columns:
    - tenant_id
    - template_no
  - name: uk_studio_app_template_code
    unique: true
    columns:
    - tenant_id
    - organization_id
    - template_code
  - name: idx_studio_app_template_scope_status
    columns:
    - tenant_id
    - organization_id
    - visibility
    - publish_status
    - status
    - updated_at
    - id
  - name: idx_studio_app_template_category
    columns:
    - tenant_id
    - organization_id
    - category_id
    - publish_status
    - sort_weight
    - id
  - name: idx_studio_app_template_type_runtime
    columns:
    - tenant_id
    - organization_id
    - template_type
    - runtime
    - framework
    - status
    - id
  - name: idx_studio_app_template_git_source
    columns:
    - tenant_id
    - organization_id
    - git_repo_url
    - git_sub_path
    - status
    - id
  - name: idx_studio_app_template_featured
    columns:
    - tenant_id
    - organization_id
    - featured
    - sort_weight
    - id
