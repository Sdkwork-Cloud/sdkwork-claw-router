tables:
- table: course_catalog
  domain: course
  profile: content_entity
  compliance_level: L2
  system_of_record: true
  write_owner: sdkwork-course
  generated_by_this_project: false
  common_columns: tenant_entity
  frontend_routes:
  - /courses
  - /courses/:id
  - /admin/courses
  - /admin/courses/dashboard
  - /admin/courses/catalog
  - /admin/courses/sections
  - /admin/courses/lessons
  - /admin/courses/relations
  - /admin/courses/applications
  - /admin/courses/comments
  - /admin/courses/engagement
  api_surfaces:
  - app
  - backend
  columns:
    course_code: string(64)
    title: string(200)
    description: text
    thumbnail_media_resource_id: string(128)
    thumbnail_object_blob_id: int64
    thumbnail_resource_snapshot: json
    instructor_snapshot: json
    duration_text: string(64)
    lessons_count: int32
    rating_score: decimal
    students_count: int64
    level: enum_int32
    category: string(64)
    tags: json
    external_bvid: string(64)
    content: text
    price_amount: decimal
    currency: string(10)
    is_collection: bool
    published_at: instant
  indexes:
  - name: uk_course_catalog_code
    unique: true
    columns:
    - course_code
  - name: idx_course_catalog_category_status
    columns:
    - category
    - status
    - published_at
    - id
