tables:
- table: content_reaction
  domain: content
  profile: forum_runtime_projection
  compliance_level: L2
  system_of_record: true
  generated_by_this_project: true
  write_owner: forum-runtime-projection
  common_columns: event_log
  frontend_routes:
  - /forum
  - /forum/:id
  api_surfaces:
  - app
  columns:
    target_type: int32
    target_id: int64
    reaction_type: int32
    reaction_value: string(64)
    client_ip_hash: string(128)
    user_agent_hash: string(128)
    cancelled_at: instant
  indexes:
  - name: uk_content_reaction_user_target_type
    unique: true
    columns:
    - tenant_id
    - organization_id
    - user_id
    - target_type
    - target_id
    - reaction_type
  - name: idx_content_reaction_target_type
    columns:
    - target_type
    - target_id
    - reaction_type
    - created_at
    - id
- table: content_forum_post
  domain: content
  profile: forum_runtime_projection
  compliance_level: L2
  system_of_record: true
  generated_by_this_project: true
  write_owner: forum-runtime-projection
  common_columns: tenant_entity
  frontend_routes:
  - /forum
  - /forum/:id
  api_surfaces:
  - app
  columns:
    uuid:
      type: string(255)
      constraints: NOT NULL UNIQUE
    v:
      type: int64
      constraints: NOT NULL DEFAULT 0
    user_id: int64
    title: string(255)
    summary: text
    category_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    content_type: int32
    content_id: int64
    cover_resources: json
    resource_list: json
    author: json
    source: string(100)
    source_url: string(500)
    publish_time: instant
    tags: json
    status:
      type: int32
      constraints: NOT NULL DEFAULT 2
    view_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    like_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    comment_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    share_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    favorite_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    is_top:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    is_hot:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    is_recommended:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    sort_order:
      type: int32
      constraints: NOT NULL DEFAULT 0
  indexes:
  - name: idx_content_forum_post_status
    columns:
    - status
  - name: idx_content_forum_post_user_id
    columns:
    - user_id
  - name: idx_content_forum_post_category_id
    columns:
    - category_id
  - name: idx_content_forum_post_content_type
    columns:
    - content_type
  - name: idx_content_forum_post_publish_time
    columns:
    - publish_time
  - name: idx_content_forum_post_status_publish_time
    columns:
    - status
    - publish_time
