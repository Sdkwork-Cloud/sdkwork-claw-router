- table: plus_app
  domain: legacy
  profile: java_compatible_owned
  compliance_level: L0
  system_of_record: true
  write_owner: spring-ai-plus-business-entity
  generated_by_this_project: true
  frontend_routes:
  - /
  - /apps
  - /apps/:id
  - /admin/app
  api_surfaces:
  - app
  - backend
  compatibility_rule: keep_physical_structure_identical
  java_contract:
    entity: com.sdkwork.spring.ai.plus.entity.app.PlusApp
    app_api:
      store_base_path: /app/v3/api/app/store
      manage_base_path: /app/v3/api/app/manage
      list_store_apps: GET /app/v3/api/app/store
      list_store_categories: GET /app/v3/api/app/store/categories
      retrieve_store_app: GET /app/v3/api/app/store/{appId}
    backend_api:
      base_path: /backend/v3/api/app
      aggregate_admin_base_path: /backend/v3/api/app/admin
    vo:
      app_list: com.sdkwork.ai.gateway.api.app.v3.app.vo.AppVO
      app_detail: com.sdkwork.ai.gateway.api.app.v3.app.vo.AppDetailVO
      backend: com.sdkwork.spring.ai.plus.vo.app.PlusAppVO
  frontend_contract:
    list_component: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-app-center/src/pages/AppCenter.tsx
    detail_component: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-app-center/src/pages/AppDetails.tsx
    source_of_truth: plus_app
    adapter_rule: map AppVO/AppDetailVO to existing portal App/AppRelease view model without changing UI
    field_mapping:
      id: id/appId
      name: name
      developer: AppVO.developer resolved from iam_user display_name/username or installSkill.name
      category: plus_category.name from type 999999 / group_name app-store; plus_app.app_type is not a category source of truth
      image: iconUrl or icon.url or resourceList cover asset
      rating: studio_catalog_action aggregate projection
      downloads: studio_catalog_action download aggregate projection
      screenshots: resourceList assets filtered by media type screenshot/cover
      features: config.features or installConfig.metadata.features
      releases: releaseNotes + installConfig.packages resolved by AppDetailVO.releases/currentRelease
  physical_columns:
    inherited: PlusUserBaseEntity columns
    own:
    - name
    - icon
    - resource_list
    - project_id
    - description
    - version
    - icon_url
    - access_url
    - config
    - status
    - app_type
    - platforms
    - install_platforms
    - install_skill
    - install_config
    - release_notes
    - package_name
    - bundle_id
    - store_url
    - download_url
  columns:
    id:
      type: int64
      constraints: PRIMARY KEY
    uuid:
      type: string(255)
      constraints: NOT NULL UNIQUE
    created_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    updated_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    v:
      type: int64
      constraints: NOT NULL DEFAULT 0
    tenant_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    organization_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    data_scope:
      type: int32
      constraints: NOT NULL DEFAULT 0
    user_id: int64
    name:
      type: string(255)
      constraints: NOT NULL
    icon: json
    resource_list: json
    project_id: int64
    description: text
    version: string(64)
    icon_url: string(512)
    access_url: string(512)
    config:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    status:
      type: int32
      constraints: NOT NULL DEFAULT 1
    app_type: string(64)
    platforms: json
    install_platforms: json
    install_skill: json
    install_config: json
    release_notes: json
    package_name: string(255)
    bundle_id: string(255)
    store_url: string(512)
    download_url: string(512)
  indexes:
  - name: idx_app_user_id
    columns:
    - user_id
  - name: idx_app_project_id
    columns:
    - project_id
  - name: idx_app_status
    columns:
    - status
