tables:
- table: ops_referral_stat_snapshot
  domain: ops
  profile: projection
  compliance_level: L2
  system_of_record: false
  write_owner: marketing-analytics-worker
  common_columns: projection
  source_tables:
  - promotion_code
  - promotion_code_redemption
  - iam_user
  - commerce_order
  - commerce_payment_attempt
  projection_policy:
    does_not_replace:
    - promotion_code
    - promotion_code_redemption
    - iam_user
    purpose: admin_marketing_referral_analytics_only
  frontend_routes:
  - /admin/marketing
  - /admin/marketing/referrals
  api_surfaces:
  - backend
  - worker
  columns:
    inviter_user_id: int64
    inviter_name_snapshot: string(128)
    inviter_email_snapshot: string(255)
    invitation_code_id: int64
    invitation_code: string(64)
    invite_link: string(512)
    snapshot_period: string(32)
    period_start: instant
    period_end: instant
    total_invited_count: int64
    direct_invited_count: int64
    secondary_invited_count: int64
    paid_invitee_count: int64
    total_revenue_amount: decimal
    reward_awarded_amount: decimal
    reward_pending_amount: decimal
    currency: string(10)
    snapshot_at: instant
  indexes:
  - name: uk_ops_referral_stat_snapshot
    unique: true
    columns:
    - tenant_id
    - organization_id
    - inviter_user_id
    - snapshot_period
    - period_start
  - name: idx_ops_referral_stat_snapshot_period
    columns:
    - tenant_id
    - organization_id
    - snapshot_period
    - period_start
    - total_revenue_amount
  - name: idx_ops_referral_stat_snapshot_code
    columns:
    - tenant_id
    - organization_id
    - invitation_code
