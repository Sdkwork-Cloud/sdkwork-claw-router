    - organization_id
    - channel_id
    - catalog_key
    - provider_model
    - capability
    - effective_from
  - name: idx_ai_channel_model_model_status
    columns:
    - tenant_id
    - organization_id
    - catalog_key
    - status
    - effective_from
    - id
  - name: idx_ai_channel_model_model_id_status
    columns:
    - tenant_id
    - organization_id
    - model
    - status
    - effective_from
    - id
  - name: idx_ai_channel_model_vendor_status
    columns:
    - tenant_id
    - organization_id
    - vendor_code
    - status
    - effective_from
    - id
  foreign_keys:
  - name: fk_ai_channel_model_channel
    columns:
    - channel_id
    references_table: ai_channel
    references_columns:
    - id
  - name: fk_ai_channel_model_model
    columns:
    - model_id
    references_table: ai_model
    references_columns:
    - id
