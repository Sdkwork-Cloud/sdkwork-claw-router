  - tenant_id
  - organization_id
  - status
  - account_key
  - name
  - provider
  - account_type
  columns:
    account_key: string(128)
    name: string(128)
    provider: string(64)
    account_type: string(64)
    app_id: string(128)
    secret_ref: string(256)
