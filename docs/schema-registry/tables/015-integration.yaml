tables:
- table: open_platform_provider
  domain: integration
  profile: dictionary_entity
  compliance_level: L2
  system_of_record: true
  write_owner: open-platform-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/open-platform
  - /admin/open-platform/official-accounts
  - /admin/open-platform/official-accounts/accounts
  - /admin/open-platform/official-accounts/menus
  - /admin/open-platform/official-accounts/messages
  - /admin/open-platform/mini-programs
  - /admin/open-platform/mini-programs/accounts
  - /admin/open-platform/mini-programs/urls
  - /admin/service-providers
  - /admin/service-providers/accounts
  api_surfaces:
  - backend
  required_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - provider
  - name
  columns:
    provider: string(64)
    name: string(128)
    icon_media_resource_id: string(128)
    icon_object_blob_id: int64
    icon_resource_snapshot: json
    docs_url: string(512)
    website_url: string(512)
    capabilities: json
    sort_order: int32
  indexes:
  - name: uk_open_platform_provider_tenant_provider
    unique: true
    columns:
    - tenant_id
    - organization_id
    - provider
  - name: idx_open_platform_provider_status_sort
    columns:
    - tenant_id
    - organization_id
    - status
    - sort_order
    - id
