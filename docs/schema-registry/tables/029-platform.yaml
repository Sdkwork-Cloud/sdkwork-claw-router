tables:
- table: platform_app
  domain: platform
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: app-center-service
  generated_by_this_project: true
  frontend_routes:
  - /
  - /apps
  - /apps/:id
  - /admin/app
  api_surfaces:
  - app
  - backend
  columns:
    id:
      type: int64
      constraints: PRIMARY KEY
    uuid:
      type: string(255)
      constraints: NOT NULL UNIQUE
    created_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    updated_at:
      type: instant
      constraints: NOT NULL DEFAULT CURRENT_TIMESTAMP
    v:
      type: int64
      constraints: NOT NULL DEFAULT 0
    tenant_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    organization_id:
      type: int64
      constraints: NOT NULL DEFAULT 0
    data_scope:
      type: int32
      constraints: NOT NULL DEFAULT 0
    user_id: int64
    category_id: int64
    name:
      type: string(255)
      constraints: NOT NULL
    icon: json
    resource_list: json
    project_id: int64
    description: text
    version: string(64)
    icon_media_resource_id: string(128)
    icon_object_blob_id: int64
    icon_resource_snapshot: json
    access_url: string(512)
    config:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
    status:
      type: int32
      constraints: NOT NULL DEFAULT 1
    app_type: string(64)
    platforms: json
    install_platforms: json
    install_skill: json
    install_config: json
    release_notes: json
    package_name: string(255)
    bundle_id: string(255)
    store_url: string(512)
    artifact_media_resource_id: string(128)
    artifact_object_blob_id: int64
    artifact_resource_snapshot: json
    download_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
    rating_avg:
      type: decimal
      constraints: NOT NULL DEFAULT 0
    rating_count:
      type: int64
      constraints: NOT NULL DEFAULT 0
  indexes:
  - name: idx_platform_app_user_id
    columns:
    - user_id
  - name: idx_platform_app_project_id
    columns:
    - project_id
  - name: idx_platform_app_status
    columns:
    - status
  - name: idx_platform_app_category_id
    columns:
    - category_id
- table: platform_app_template
  domain: platform
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: app-center-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/app
  api_surfaces:
  - backend
  - worker
  columns:
    template_no: string(64)
    template_code: string(128)
    template_name: string(255)
    description: text
    category_id: int64
    category_code: string(128)
    template_type: string(64)
    runtime: string(128)
    framework: string(128)
    language: string(64)
    icon_media_resource_id: string(128)
    icon_object_blob_id: int64
    icon_resource_snapshot: json
    cover_media_resource_id: string(128)
    cover_object_blob_id: int64
    cover_resource_snapshot: json
    visibility: enum_int32
    publish_status: enum_int32
    featured: bool
    sort_weight: int32
    owner_user_id: int64
    source_app_id: int64
    git_repo_url: string(1024)
    git_ref: string(128)
    git_sub_path: string(1024)
    current_version_id: int64
    app_config_schema: json
    default_app_config: json
    variable_schema: json
    dependency_manifest: json
    capability_manifest: json
    published_at: instant
    deprecated_at: instant
  indexes:
  - name: uk_platform_app_template_no
    unique: true
    columns:
    - tenant_id
    - template_no
  - name: uk_platform_app_template_code
    unique: true
    columns:
    - tenant_id
    - organization_id
    - template_code
  - name: idx_platform_app_template_scope_status
    columns:
    - tenant_id
    - organization_id
    - visibility
    - publish_status
    - status
    - updated_at
    - id
  - name: idx_platform_app_template_category
    columns:
    - tenant_id
    - organization_id
    - category_id
    - publish_status
    - sort_weight
    - id
- table: platform_app_template_version
  domain: platform
  profile: tenant_entity
  compliance_level: L2
  system_of_record: true
  write_owner: app-center-service
