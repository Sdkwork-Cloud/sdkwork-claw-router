  indexes:
  - name: uk_platform_app_template_version_no
    unique: true
    columns:
    - tenant_id
    - organization_id
    - template_id
    - version_no
  - name: idx_platform_app_template_version_template
    columns:
    - tenant_id
    - organization_id
    - template_id
    - publish_status
    - created_at
    - id
- table: platform_app_template_usage
  domain: platform
  profile: event_log
  compliance_level: L2
  system_of_record: true
  write_owner: app-center-service
  common_columns: event_log
  frontend_routes:
  - /admin/app
  api_surfaces:
  - backend
  - worker
  columns:
    template_id: int64
    template_version_id: int64
    target_app_id: int64
    usage_type: enum_int32
    input_snapshot: json
    output_snapshot: json
  indexes:
  - name: idx_platform_app_template_usage_template
    columns:
    - tenant_id
    - organization_id
    - template_id
    - template_version_id
    - created_at
    - id
  - name: idx_platform_app_template_usage_target
    columns:
    - tenant_id
    - organization_id
    - target_app_id
    - created_at
    - id
  - name: idx_platform_app_template_usage_user
    columns:
    - tenant_id
    - organization_id
    - user_id
    - created_at
    - id
