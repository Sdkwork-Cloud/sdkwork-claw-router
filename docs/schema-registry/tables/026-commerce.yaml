tables:
- table: commerce_usage_service_provider_settlement
  domain: commerce
  profile: commercial_provider_usage_settlement
  compliance_level: L3
  system_of_record: false
  write_owner: settlement-worker
  common_columns: event_log
  source_tables:
  - ai_usage_service_provider_edge
  - commerce_account
  - commerce_account_ledger_entry
  frontend_routes:
  - /admin/service-providers/statements
  - /admin/service-providers/wallet
  api_surfaces:
  - backend
  - worker
  columns:
    settlement_no: string(128)
    usage_edge_id: int64
    seller_provider_id: int64
    buyer_provider_id: int64
    buyer_account_id: string(128)
    seller_account_id: string(128)
    buyer_ledger_entry_id: string(128)
    seller_ledger_entry_id: string(128)
    settlement_mode: string(32)
    direction: string(16)
    amount: decimal
    currency: string(10)
    settlement_status: enum_int32
    settled_at: instant
    failure_code: string(128)
    failure_message: string(512)
  indexes:
  - name: uk_commerce_usage_service_provider_settlement_edge
    unique: true
    columns:
    - tenant_id
    - organization_id
    - usage_edge_id
    - direction
  - name: idx_commerce_usage_service_provider_settlement_status
    columns:
    - tenant_id
    - organization_id
    - settlement_status
    - created_at
    - id
  security:
    financial: true
- table: commerce_usage_service_provider_statement
  domain: commerce
  profile: commercial_provider_statement
  compliance_level: L3
  system_of_record: false
  write_owner: billing-worker
  common_columns: projection
  source_tables:
  - ai_usage_service_provider_edge
  - commerce_usage_service_provider_settlement
  frontend_routes:
  - /admin/service-providers/statements
  api_surfaces:
  - backend
  - worker
  columns:
    statement_no: string(128)
    seller_provider_id: int64
    buyer_provider_id: int64
    period: string(32)
    period_start: instant
    period_end: instant
    total_requests: int64
    total_tokens: int64
    receivable_amount: decimal
    payable_amount: decimal
    currency: string(10)
    statement_status: enum_int32
    payment_status: enum_int32
    invoice_id: int64
    generated_at: instant
    due_at: instant
    paid_at: instant
  indexes:
  - name: uk_commerce_usage_service_provider_statement_edge_period
    unique: true
    columns:
    - tenant_id
    - organization_id
    - seller_provider_id
    - buyer_provider_id
    - period
  - name: idx_commerce_usage_service_provider_statement_status
    columns:
    - tenant_id
    - organization_id
    - statement_status
    - period_end
    - id
  security:
    financial: true
- table: commerce_usage_service_provider_statement_item
  domain: commerce
  profile: commercial_provider_statement_item
  compliance_level: L3
  system_of_record: false
  write_owner: billing-worker
  common_columns: projection
  source_tables:
  - commerce_usage_service_provider_statement
  - ai_usage_service_provider_edge
  frontend_routes:
  - /admin/service-providers/statements
  api_surfaces:
  - backend
  - worker
  columns:
    statement_id: int64
    usage_edge_id: int64
    billing_meter_code: string(64)
    token_kind: string(64)
    model: string(128)
    request_count: int64
    token_count: int64
    quantity: decimal
    amount: decimal
    currency: string(10)
    source_usage_fact_ids: json
  indexes:
  - name: idx_commerce_usage_service_provider_statement_item_statement
    columns:
    - tenant_id
    - organization_id
    - statement_id
    - billing_meter_code
    - token_kind
  security:
    financial: true
- table: commerce_usage_service_provider_adjustment
  domain: commerce
  profile: commercial_provider_adjustment
  compliance_level: L3
  system_of_record: true
  write_owner: billing-worker
  common_columns: event_log
  source_tables:
  - ai_usage_service_provider_edge
  - commerce_usage_service_provider_statement
  frontend_routes:
  - /admin/service-providers/adjustments
  api_surfaces:
  - backend
  - worker
  columns:
    adjustment_no: string(128)
    usage_edge_id: int64
    statement_id: int64
    seller_provider_id: int64
    buyer_provider_id: int64
    adjustment_type: string(64)
    amount: decimal
    currency: string(10)
    reason_code: string(128)
    reason_message: string(512)
    approval_status: string(32)
    approved_by: int64
    settled_ledger_entry_id: string(128)
  indexes:
  - name: uk_commerce_usage_service_provider_adjustment_no
    unique: true
    columns:
    - tenant_id
    - organization_id
    - adjustment_no
  - name: idx_commerce_usage_service_provider_adjustment_edge
    columns:
    - tenant_id
    - organization_id
    - usage_edge_id
    - status
    - id
  security:
    financial: true
    audit_required: true
