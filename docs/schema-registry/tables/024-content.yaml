tables:
- table: object_provider
  domain: content
  profile: object_storage_provider
  compliance_level: L3
  system_of_record: true
  write_owner: storage-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/storage
  - /admin/storage/providers
  api_surfaces:
  - backend
  - worker
  required_columns:
  - uuid
  - provider_code
  - provider_type
  - credential_ref
  columns:
    status:
      type: string(32)
      constraints: NOT NULL DEFAULT 'active'
    provider_code: string(96)
    provider_type: string(64)
    endpoint_url: string(512)
    region: string(64)
    credential_ref: string(256)
    path_style_enabled:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    supports_multipart:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    supports_lifecycle:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    supports_object_lock:
      type: bool
      constraints: NOT NULL DEFAULT FALSE
    health_status:
      type: string(64)
      constraints: NOT NULL DEFAULT 'unknown'
    last_health_check_at: instant
    idempotency_key: string(128)
    request_id: string(128)
  indexes:
  - name: uk_object_provider_tenant_code
    unique: true
    columns:
    - tenant_id
    - organization_id
    - provider_code
  - name: uk_object_provider_idempotency
    unique: true
    columns:
    - tenant_id
    - organization_id
    - idempotency_key
  - name: idx_object_provider_tenant_status
    columns:
    - tenant_id
    - organization_id
    - status
    - id
  security:
    stores_secret_plaintext: false
    audit_required: true
