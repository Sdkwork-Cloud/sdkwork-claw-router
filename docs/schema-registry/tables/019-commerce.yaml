tables:
- table: commerce_usage_settlement
  domain: commerce
  profile: ledger_projection
  compliance_level: L3
  system_of_record: false
  write_owner: settlement-worker
  common_columns: event_log
  frontend_routes:
  - /console/settlements
  - /admin/finance
  - /admin/finance/invoice-titles
  - /admin/finance/invoices
  - /admin/marketing/offers
  - /admin/marketing/promotion-coupon-stocks
  - /admin/marketing/promotion-codes
  - /admin/marketing/discount-applications
  - /admin/marketing/offers
  - /admin/marketing/promotion-coupon-stocks
  - /admin/marketing/promotion-codes
  - /admin/marketing/discount-applications
  - /admin/finance/payment-reconciliation
  - /admin/finance/order-revenue
  - /admin/finance/refunds-report
  - /admin/finance/audit-events
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    settlement_no: string(128)
    usage_fact_id: int64
    account_id: string(64)
    account_ledger_entry_id: string(64)
    order_id: int64
    payment_id: int64
    asset_type: string(32)
    direction: string(16)
    amount: decimal
    points: int64
    tokens: int64
    currency: string(10)
    price_snapshot: json
    settlement_status: enum_int32
    settled_at: instant
    failure_code: string(128)
    failure_message: string(512)
  indexes:
  - name: uk_commerce_usage_settlement_usage
    unique: true
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
  - name: idx_commerce_usage_settlement_tenant_status
    columns:
    - tenant_id
    - organization_id
    - settlement_status
    - created_at
    - id
  security:
    financial: true
- table: commerce_usage_pricing_plan
  domain: commerce
  profile: dictionary_entity
  compliance_level: L2
  system_of_record: true
  write_owner: pricing-service
  common_columns: tenant_entity
  frontend_routes:
  - /admin/group
  - /admin/model
  api_surfaces:
  - backend
  columns:
    plan_code: string(64)
    plan_name: string(128)
    product_id: int64
    sku_id: int64
    vip_level_id: int64
    pricing_mode: enum_int32
    included_quota: decimal
    overage_pricing_id: int64
    rate_multiplier: decimal
    effective_from: instant
    effective_to: instant
  indexes:
  - name: uk_commerce_usage_pricing_plan_tenant_code
    unique: true
    columns:
    - tenant_id
    - organization_id
    - plan_code
- table: commerce_usage_statement
  domain: commerce
  profile: projection
  compliance_level: L3
  system_of_record: false
  write_owner: billing-worker
  common_columns: projection
  source_tables:
  - ai_usage_fact
  - commerce_usage_settlement
  - commerce_account_ledger_entry
  - commerce_invoice
  projection_policy:
    does_not_replace: []
    purpose: usage_billing_statement_read_model_only
  frontend_routes:
  - /console/settlements
  - /admin/finance
  - /admin/finance/invoice-titles
  - /admin/finance/invoices
  - /admin/marketing/offers
  - /admin/marketing/promotion-coupon-stocks
  - /admin/marketing/promotion-codes
  - /admin/marketing/discount-applications
  - /admin/marketing/offers
  - /admin/marketing/promotion-coupon-stocks
  - /admin/marketing/promotion-codes
  - /admin/marketing/discount-applications
  - /admin/finance/payment-reconciliation
  - /admin/finance/order-revenue
  - /admin/finance/refunds-report
  - /admin/finance/audit-events
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    statement_no: string(128)
    period: string(32)
    period_start: instant
    period_end: instant
    owner_type: enum_int32
    owner_id: int64
    total_tokens: int64
    total_requests: int64
    total_cost: decimal
    currency: string(10)
    statement_status: enum_int32
    generated_at: instant
    due_at: instant
    paid_at: instant
    payment_status: enum_int32
    invoice_id: int64
    export_id: int64
  indexes:
  - name: uk_commerce_usage_statement_owner_period
    unique: true
    columns:
    - tenant_id
    - organization_id
    - owner_type
    - owner_id
    - period
  - name: idx_commerce_usage_statement_tenant_status
    columns:
    - tenant_id
    - organization_id
    - statement_status
    - period_end
    - id
  security:
    financial: true
- table: commerce_usage_statement_item
  domain: commerce
  profile: projection
  compliance_level: L3
  system_of_record: false
  write_owner: billing-worker
  common_columns: projection
  source_tables:
  - commerce_usage_statement
  - ai_usage_fact
  - commerce_usage_settlement
  frontend_routes:
  - /console/settlements
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    statement_id: int64
    item_type: enum_int32
    modality: enum_int32
    model: string(128)
    model_list: json
    provider_code: string(64)
    usage_text: string(256)
    breakdown_payload: json
    request_count: int64
    token_count: int64
    asset_count: int64
    duration_seconds: decimal
    cost_amount: decimal
    currency: string(10)
    source_usage_fact_ids: json
  indexes:
  - name: idx_commerce_usage_statement_item_statement
    columns:
    - statement_id
    - item_type
    - model
  security:
    financial: true
- table: commerce_settlement_export
  domain: commerce
  profile: export_audit
  compliance_level: L3
  system_of_record: true
  write_owner: billing-export-service
  common_columns: event_log
  frontend_routes:
  - /console/settlements
  api_surfaces:
  - app
  - backend
  - worker
  columns:
    export_no: string(128)
    export_type: enum_int32
    period_start: instant
    period_end: instant
    statement_id: int64
    file_manifest: json
    file_hash: string(128)
    expire_at: instant
    download_count: int64
    created_by: int64
    approved_by: int64
    audit_log_id: int64
  indexes:
  - name: uk_commerce_settlement_export_no
    unique: true
    columns:
    - export_no
  - name: idx_commerce_settlement_export_tenant_period
    columns:
    - tenant_id
    - organization_id
    - period_start
    - period_end
    - created_at
    - id
  security:
    audit_required: true
    export_contains_sensitive_data: true
