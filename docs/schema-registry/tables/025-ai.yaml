tables:
- table: ai_model_mapping_rule
  domain: ai
  profile: rule_entity
  compliance_level: L2
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_model_vendor
  - ai_model
  - ai_channel
  frontend_routes:
  - /admin/model/mappings
  api_surfaces:
  - backend
  - worker
  not_null_columns:
  - uuid
  - tenant_id
  - organization_id
  - status
  - scope_type
  - source_model
  - target_model
  - mapping_mode
  - match_type
  - priority
  - enabled
  unique_constraints:
  - columns:
    - uuid
    source: column_unique
  columns:
    scope_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'global'
    vendor_id: int64
    vendor_code: string(64)
    channel_id: int64
    channel_code: string(64)
    source_model:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    source_catalog_key: string(256)
    source_vendor_code: string(64)
    target_model:
      type: string(256)
      constraints: NOT NULL DEFAULT ''
    target_catalog_key: string(256)
    target_vendor_code: string(64)
    target_provider_model: string(256)
    target_provider_native_model: string(256)
    mapping_mode:
      type: string(32)
      constraints: NOT NULL DEFAULT 'alias'
    match_type:
      type: string(32)
      constraints: NOT NULL DEFAULT 'exact'
    priority:
      type: int32
      constraints: NOT NULL DEFAULT 100
    enabled:
      type: bool
      constraints: NOT NULL DEFAULT TRUE
    effective_from: instant
    effective_to: instant
    description: string(512)
    metadata:
      type: json
      constraints: NOT NULL DEFAULT '{}'::jsonb
  indexes:
  - name: idx_ai_model_mapping_rule_channel_lookup
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - channel_id
    - source_model
    - priority
    - id
  - name: idx_ai_model_mapping_rule_vendor_lookup
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - vendor_code
    - source_model
    - priority
    - id
  - name: idx_ai_model_mapping_rule_global_lookup
    columns:
    - tenant_id
    - organization_id
    - status
    - enabled
    - scope_type
    - source_model
    - priority
    - id
  - name: idx_ai_model_mapping_rule_target_model
    columns:
    - tenant_id
    - organization_id
    - target_catalog_key
    - target_vendor_code
    - status
    - id
- table: ai_usage_service_provider_chain
  domain: ai
  profile: commercial_usage_chain_fact
  compliance_level: L3
  system_of_record: true
  write_owner: gateway-runtime
  common_columns: event_log
  source_tables:
  - ai_usage_fact
  - integration_service_provider
  frontend_routes:
  - /admin/service-providers/usage
  api_surfaces:
  - backend
  - worker
  required_columns:
  - uuid
  - usage_fact_id
  columns:
    usage_fact_id: int64
    leaf_provider_id: int64
    root_provider_id: int64
    chain_depth: int32
    chain_path_snapshot: json
    chain_hash: string(128)
    resolved_subject_type: string(64)
    resolved_subject_id: int64
    occurred_at: instant
  indexes:
  - name: uk_ai_usage_service_provider_chain_usage
    unique: true
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
  - name: idx_ai_usage_service_provider_chain_leaf_time
    columns:
    - tenant_id
    - organization_id
    - leaf_provider_id
    - occurred_at
    - id
  security:
    financial: true
    audit_required: true
- table: ai_usage_service_provider_edge
  domain: ai
  profile: commercial_usage_edge_fact
  compliance_level: L3
  system_of_record: true
  write_owner: gateway-runtime
  common_columns: event_log
  source_tables:
  - ai_usage_fact
  - ai_usage_service_provider_chain
  - integration_service_provider_edge
  frontend_routes:
  - /admin/service-providers/dashboard
  - /admin/service-providers/usage
  - /admin/service-providers/statements
  api_surfaces:
  - backend
  - worker
  required_columns:
  - uuid
  - usage_fact_id
  - edge_id
  columns:
    usage_fact_id: int64
    chain_id: int64
    edge_id: int64
    edge_depth: int32
    seller_provider_id: int64
    buyer_provider_id: int64
    amount_role: string(64)
    pricing_plan_id: int64
    pricing_rule_id: int64
    billing_meter_code: string(64)
    token_kind: string(64)
    billable_quantity: decimal
    unit_price: decimal
    unit_size: decimal
    charge_amount: decimal
    currency: string(10)
    fx_rate_snapshot: decimal
    settlement_currency: string(10)
    converted_charge_amount: decimal
    seller_snapshot: json
    buyer_snapshot: json
    price_snapshot: json
    occurred_at: instant
    settlement_status: enum_int32
  indexes:
  - name: uk_ai_usage_service_provider_edge_usage_depth
    unique: true
    columns:
    - tenant_id
    - organization_id
    - usage_fact_id
    - edge_depth
    - amount_role
  - name: idx_ai_usage_service_provider_edge_seller_time
    columns:
    - tenant_id
    - organization_id
    - seller_provider_id
    - occurred_at
    - id
  - name: idx_ai_usage_service_provider_edge_buyer_time
    columns:
    - tenant_id
    - organization_id
    - buyer_provider_id
    - occurred_at
    - id
  security:
    financial: true
    audit_required: true
