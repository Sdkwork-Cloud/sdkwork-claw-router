- table: ai_usage_fact
  domain: ai
  profile: ledger_source_fact
  compliance_level: L3
  system_of_record: true
  write_owner: gateway-runtime
  common_columns: event_log
  frontend_routes:
  - /playground
  - /console/dashboard
  - /console/usage
  - /console/routing
  - /admin/dashboard
  - /admin/analytics
  - /admin/model
  - /admin/record
  - /console/account
  - /console/settlements
  - /admin/service-providers/usage
  api_surfaces:
  - app
  - backend
  - openai_v1
  - worker
  required_columns:
  - catalog_key
  not_null_columns:
  - uuid
  - catalog_key
  columns:
    decision_log_id: int64
    api_key_id: int64
    legacy_api_key_id: int64
    api_key_name_snapshot: string(128)
    channel_group_id: int64
    channel_group_snapshot: string(128)
    owner_type: enum_int32
    owner_id: int64
    owner_name_snapshot: string(128)
    catalog_key: string(256)
    requested_model_catalog_key: string(256)
    model: string(256)
    provider_native_model: string(256)
    region_code: string(64)
    provider_id: int64
    channel_id: int64
    modality: enum_int32
    usage_type: enum_int32
    billing_type: enum_int32
    billing_mode: enum_int32
    billing_meter_id: int64
    billing_meter_code: string(64)
    billing_tier: string(64)
    billable_quantity: decimal
    billable_unit: enum_int32
    prompt_tokens: int64
    completion_tokens: int64
    cached_tokens: int64
    total_tokens: int64
    request_count: int64
    result_count: int64
    item_count: int64
    character_count: int64
    image_count: int64
    audio_seconds: decimal
    video_seconds: decimal
    storage_byte_hours: decimal
    bandwidth_bytes: int64
    unit_price_snapshot: decimal
    base_input_unit_price: decimal
    base_output_unit_price: decimal
    cache_read_unit_price: decimal
    rate_multiplier: decimal
    reference_multiplier: decimal
    official_reference_amount: decimal
    upstream_cost_amount: decimal
    customer_charge_amount: decimal
    cost_amount: decimal
    currency: string(10)
    pricing_id: int64
    pricing_plan_id: int64
    pricing_plan_code: string(64)
    pricing_rule_id: int64
    pricing_tier_id: int64
    pricing_snapshot: json
    reasoning_effort: string(64)
    occurred_at: instant
    settlement_status: enum_int32
    settlement_id: int64
  column_descriptions:
    official_reference_amount: Vendor official reference amount captured for audit
      and comparison.
    upstream_cost_amount: Sensitive upstream access cost captured for admin cost accounting
      only.
    customer_charge_amount: Customer-facing sales/charge amount used by app usage
      display, settlement, and ranking refresh.
    cost_amount: Legacy compatibility field for customer-facing charge amount; new
      gateway writes mirror customer_charge_amount, never upstream_cost_amount.
  semantic_contracts:
    ranking_refresh_source_fact:
      time_field: occurred_at
      window_predicate: half_open_utc
      aggregation_grain:
      - tenant_id
      - organization_id
      - catalog_key
      metric_fields:
      - request_count
      - total_tokens
      - customer_charge_amount
      - currency
      pricing_snapshot_field: pricing_snapshot
  indexes:
  - name: uk_ai_usage_fact_request
    unique: true
    columns:
    - tenant_id
    - organization_id
    - request_id
    - usage_type
  - name: idx_ai_usage_fact_tenant_owner_occurred
    columns:
    - tenant_id
    - organization_id
    - owner_type
    - owner_id
    - occurred_at
    - id
  - name: idx_ai_usage_fact_api_key_occurred
    columns:
    - tenant_id
    - organization_id
    - api_key_id
    - occurred_at
    - id
  - name: idx_ai_usage_fact_model_occurred
    columns:
    - tenant_id
    - organization_id
    - catalog_key
    - occurred_at
    - id
  - name: idx_ai_usage_fact_pricing_plan_occurred
    columns:
    - tenant_id
    - organization_id
    - pricing_plan_id
    - occurred_at
    - id
  - name: idx_ai_usage_fact_meter_occurred
    columns:
    - tenant_id
    - organization_id
    - billing_meter_code
    - occurred_at
    - id
  - name: idx_ai_usage_fact_settlement_status
    columns:
    - tenant_id
    - organization_id
    - settlement_status
    - occurred_at
    - id
  lifecycle:
    partition_by: occurred_at_month
    online_retention: 24mo
    archive_retention: 5y
  security:
    financial: true
    decimal_only: true
