- table: ai_config_version
  domain: ai
  profile: runtime_coordination
  compliance_level: L3
  system_of_record: true
  write_owner: ai-routing-service
  common_columns: tenant_entity
  source_tables:
  - ai_resource
  - ai_channel
  - ai_channel_group
  - ai_routing_policy
  frontend_routes:
  - /admin/system/cache
  - /admin/channel/routing
  api_surfaces:
  - backend
  - worker
