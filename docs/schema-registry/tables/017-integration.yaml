    - parent_object_id
    - status
    - id
  - name: idx_ai_provider_object_route_channel
    columns:
    - tenant_id
    - organization_id
    - channel_group_id
    - channel_id
    - status
    - id
  - name: idx_ai_provider_object_route_expiry
    columns:
    - tenant_id
    - organization_id
    - expires_at
    - status
    - id
  security:
    sensitivity: PROVIDER_OBJECT_ROUTE
    stores_secret_plaintext: false
    audit_required: true
