fragment: operations/app-commerce-recharges
frontend_operations:
- route: /console/recharge
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-recharge/src/rechargeService.ts
  operation: appRechargesPackagesList
  operation_id: recharges.packages.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/recharges/packages
  sdk_domain: commerce
  summary: Recharges Packages List
  description: Standard appbase commerce API for recharges.packages.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  query_parameters: &id001
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id002
    name: CommerceRechargePackageListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items: &id003
          name: CommerceRechargePackageItem
          type: object
          additionalProperties: false
          required:
          - id
          - priceAmount
          - currencyCode
          - bonusPoints
          - grantAmount
          - points
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            packageNo:
              type: string
              maxLength: 128
            skuId:
              type: string
              maxLength: 128
            name:
              type: string
              maxLength: 256
            priceAmount:
              type: string
              pattern: ^\d+(?:\.\d{1,2})?$
            currencyCode:
              type: string
              minLength: 3
              maxLength: 16
              pattern: ^[A-Z0-9_-]+$
            bonusPoints:
              type: integer
              format: int64
              minimum: 0
            grantAmount:
              type: integer
              format: int64
              minimum: 0
            points:
              type: integer
              format: int64
              minimum: 0
            status:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
- route: /console/recharge
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-recharge/src/rechargeService.ts
  operation: appRechargesSettingsRetrieve
  operation_id: recharges.settings.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/recharges/settings
  sdk_domain: commerce
  summary: Recharges Settings Retrieve
  description: Returns the standard cash-to-points recharge settings, including base CNY points ratio, currency-to-CNY rates, and preview examples.
  query_parameters: []
  read_sources:
  - commerce_exchange_rule
  - commerce_recharge_package
  response_schema: &id004
    name: CommerceRechargeSettingsResponse
    type: object
    additionalProperties: false
    required:
    - baseCurrencyCode
    - basePointsPerCny
    - currencyToCnyRates
    properties:
      baseCurrencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      basePointsPerCny:
        type: string
        pattern: ^\d+(?:\.\d{1,6})?$
      currencyToCnyRates:
        type: object
        additionalProperties:
          type: string
          pattern: ^\d+(?:\.\d{1,6})?$
      previewExamples:
        type: object
        additionalProperties:
          type: object
          additionalProperties:
            type: object
            additionalProperties: false
            required:
            - grantAmount
            properties:
              grantAmount:
                type: integer
                format: int64
                minimum: 0
- route: /console/recharge
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-recharge/src/rechargeService.ts
  operation: appRechargesOrdersCreate
  operation_id: recharges.orders.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/recharges/orders
  sdk_domain: commerce
  summary: Recharges Orders Create
  description: Standard appbase commerce API for recharges.orders.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  idempotency_required: true
  write_tables:
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_account_ledger_entry
  - ops_audit_log
  request_schema:
    name: CommerceRechargeOrderCreateRequest
    type: object
    additionalProperties: false
    required:
    - amount
    - currencyCode
    - source
    properties:
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      packageId:
        type: string
        minLength: 1
        maxLength: 128
      source:
        type: string
        minLength: 1
        maxLength: 64
  response_schema:
    name: CommerceRechargeOrderCreateResponse
    type: object
    additionalProperties: false
    required:
    - success
    - orderNo
    - amount
    - currencyCode
    - points
    - providerCode
    - paymentMethod
    - paymentProduct
    - status
    - nextAction
    - cashierUrl
    - qrCodePayload
    properties:
      success:
        type: boolean
      orderNo:
        type: string
        minLength: 1
        maxLength: 128
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      points:
        type: integer
        format: int64
        minimum: 0
      providerCode:
        type: string
        minLength: 1
        maxLength: 64
      paymentMethod:
        type: string
        minLength: 1
        maxLength: 50
        description: Standardized payment method code for portal consumption. Prefer business-facing values such as wechat, alipay, or card.
      paymentProduct:
        type: string
        minLength: 1
        maxLength: 64
      nextAction:
        type: string
        minLength: 1
        maxLength: 64
      cashierUrl:
        type: string
        minLength: 1
        maxLength: 2048
      qrCodePayload:
        type: string
        minLength: 1
        maxLength: 2048
      requestPaymentPayload:
        type: object
        nullable: true
        additionalProperties: true
      status:
        type: string
        minLength: 1
        maxLength: 64
- route: /console/recharge
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-recharge/src/rechargeService.ts
  operation: appRechargesOrdersCancel
