    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appRechargesOrdersRetrieve
  operation_id: recharges.orders.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/recharges/orders/{orderId}
  sdk_domain: commerce
  summary: Recharges Orders Retrieve
  description: Standard appbase commerce API for recharges.orders.retrieve; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  query_parameters: []
  response_schema:
    name: CommerceRechargeCheckoutStatusResponse
    type: object
    additionalProperties: false
    required:
    - orderNo
    - outTradeNo
    - amount
    - currencyCode
    - points
    - providerCode
    - paymentMethod
    - paymentProduct
    - orderStatus
    - paymentStatus
    - rechargeStatus
    - status
    - createdAt
    - expiresAt
    - paidAt
    - nextAction
    - cashierUrl
    - qrCodePayload
    properties:
      orderNo:
        type: string
        minLength: 1
        maxLength: 128
      outTradeNo:
        type: string
        maxLength: 128
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
        pattern: ^[A-Z0-9_-]+$
      points:
        type: integer
        format: int64
        minimum: 0
      providerCode:
        type: string
        minLength: 1
        maxLength: 64
      paymentMethod:
        type: string
        minLength: 1
        maxLength: 50
      paymentProduct:
        type: string
        minLength: 1
        maxLength: 64
      orderStatus:
        type: string
        minLength: 1
        maxLength: 64
      paymentStatus:
        type: string
        minLength: 1
        maxLength: 64
      rechargeStatus:
        type: string
        minLength: 1
        maxLength: 64
      status:
        type: string
        minLength: 1
        maxLength: 64
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      expiresAt:
        type: string
        minLength: 1
        maxLength: 64
      paidAt:
        type: string
        maxLength: 64
      nextAction:
        type: string
        minLength: 1
        maxLength: 64
        description: For PC qr checkout, scan_qr means the client should render a QR image from qrCodePayload and ask the user to scan it with the target payment app. request_payment means the H5 cashier should invoke a bridge payment request. open_url means the client should open cashierUrl in a browser context.
      cashierUrl:
        type: string
        minLength: 1
        maxLength: 2048
        description: Standard cashier page URL for scan_qr and open_url payment flows.
      qrCodePayload:
        type: string
        minLength: 1
        maxLength: 2048
        description: Standard QR payload field for recharge checkout. When nextAction is scan_qr, this value must be an http or https payment page URL rather than a native app scheme.
      requestPaymentPayload:
        type: object
        nullable: true
        additionalProperties: true
