fragment: operations/app-commerce-recharges
frontend_operations:
- route: /console/recharge
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-recharge/src/rechargeService.ts
  operation: appRechargesPackagesList
  operation_id: recharges.packages.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/recharges/packages
  sdk_domain: commerce
  summary: Recharges Packages List
  description: Standard appbase commerce API for recharges.packages.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /console/recharge
