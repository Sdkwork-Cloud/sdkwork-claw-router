    additionalProperties: false
    properties:
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        maxLength: 512
      metadata:
        type: object
        additionalProperties: true
  response_schema:
    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
