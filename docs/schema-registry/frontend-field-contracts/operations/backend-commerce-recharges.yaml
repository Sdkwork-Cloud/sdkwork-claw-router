fragment: operations/backend-commerce-recharges
frontend_operations:
- route: /admin/memberships/recharge-packages
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-memberships/src/membershipsService.ts
  operation: backendMembershipsRechargePackagesList
  operation_id: recharges.packages.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/recharges/packages
  sdk_domain: commerce
  summary: Recharges Packages List
  description: Standard appbase commerce API for recharges.packages.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  query_parameters: &id001
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id002
    name: AdminRechargePackageListResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items: &id003
          name: AdminRechargePackageItem
          type: object
          additionalProperties: false
          required:
          - id
          - packageNo
          - skuId
          - priceAmount
          - currencyCode
          - bonusPoints
          - grantAmount
          - points
          - status
          - updatedAt
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            packageNo:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              maxLength: 256
            skuId:
              type: string
              minLength: 1
              maxLength: 128
            priceAmount:
              type: string
              pattern: ^\d+(?:\.\d{1,2})?$
            currencyCode:
              type: string
              minLength: 3
              maxLength: 16
              pattern: ^[A-Z0-9_-]+$
            bonusPoints:
              type: integer
              format: int64
              minimum: 0
            grantAmount:
              type: integer
              format: int64
              minimum: 0
            points:
              type: integer
              format: int64
              minimum: 0
            status:
              type: string
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
