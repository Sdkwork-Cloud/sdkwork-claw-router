fragment: operations/backend-commerce-recharges
frontend_operations:
- route: /admin/memberships/recharge-packages
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-memberships/src/membershipsService.ts
  operation: backendMembershipsRechargePackagesList
  operation_id: recharges.packages.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/recharges/packages
  sdk_domain: commerce
  summary: Recharges Packages List
  description: Standard appbase commerce API for recharges.packages.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_account
  - commerce_account_ledger_entry
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id001
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /admin/memberships/recharge-packages
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-memberships/src/membershipsService.ts
  operation: backendMembershipsRechargePackagesCreate
  operation_id: recharges.packages.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/recharges/packages
  sdk_domain: commerce
  summary: Recharges Packages Create
  description: Standard appbase commerce API for recharges.packages.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  idempotency_required: true
  write_tables:
  - commerce_recharge_package
  - commerce_product_spu
  - commerce_product_sku
  - ops_audit_log
  request_schema: &id002
    name: CommerceRechargePackageMutationRequest
    type: object
    additionalProperties: false
    required:
    - rmb
    - bonus
    properties:
      rmb:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
      bonus:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - active
        - inactive
  response_schema: &id003
    name: AdminRechargePackageMutationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          rmb:
            type: string
            maxLength: 64
          bonus:
            type: integer
            format: int64
            minimum: 0
          points:
            type: integer
            format: int64
            minimum: 0
          status:
            type: string
            nullable: true
            maxLength: 64
