        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 96
        pattern: ^[A-Za-z0-9._:-]+$
      description:
        type: string
        maxLength: 1024
      model:
        type: string
        maxLength: 128
      systemPrompt:
        type: string
        maxLength: 32768
      toolPolicy: *id001
      memoryPolicy: *id001
      mcpPolicy: *id001
      skillPolicy: *id001
      runtimePolicy: *id001
  response_schema:
    name: AgentItemResponse
