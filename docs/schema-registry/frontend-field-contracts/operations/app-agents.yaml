fragment: operations/app-agents
frontend_operations:
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
  operation: listAgentDefinitions
  operation_id: agentDefinitions.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/agents
  sdk_domain: agents
  summary: List Playground agent definitions
  description: Lists app user agent definitions used by the Playground generation runtime adapter.
  read_sources:
  - ai_agent
  - ai_agent_version
  - ai_agent_tool_binding
  - ai_agent_mcp_server
  - ai_agent_memory
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 100
  - name: q
    schema:
      type: string
      maxLength: 128
  response_schema:
    name: AgentListResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: &id002
          name: AgentItem
          type: object
          additionalProperties: false
          required:
          - id
          - ownerUserId
          - code
          - name
          - description
          - visibility
          - status
          - createdAt
          - updatedAt
          - defaultVersion
          - capabilities
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            ownerUserId:
              type: integer
              format: int64
              minimum: 1
            code:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[a-z0-9][a-z0-9-]{0,95}$
            name:
              type: string
              minLength: 1
              maxLength: 128
            description:
              type: string
              maxLength: 1024
            visibility:
              type: string
              enum:
              - private
              - organization
              - public
            status:
              type: string
              enum:
              - active
              - disabled
            avatar:
              $ref: '#/components/schemas/MediaResource'
              nullable: true
            templateSource:
              type: string
              nullable: true
              maxLength: 128
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
            defaultVersion:
              name: AgentVersionItem
              type: object
              additionalProperties: false
              required:
              - id
              - versionNo
              - releaseStatus
              - systemPrompt
              - toolPolicy
              - memoryPolicy
              - mcpPolicy
              - skillPolicy
              - runtimePolicy
              - createdAt
              - updatedAt
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                versionNo:
                  type: integer
                  format: int64
                  minimum: 1
                releaseStatus:
                  type: string
                  enum:
                  - draft
                  - published
                  - archived
                model:
                  type: string
                  nullable: true
                  maxLength: 128
                systemPrompt:
                  type: string
                  maxLength: 32768
                toolPolicy: &id001
                  name: AgentPolicy
                  type: object
                  additionalProperties: true
                  description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
                memoryPolicy: *id001
                mcpPolicy: *id001
                skillPolicy: *id001
                runtimePolicy: *id001
                createdAt:
                  type: string
                  minLength: 1
                  maxLength: 64
                updatedAt:
                  type: string
                  minLength: 1
                  maxLength: 64
            capabilities:
              name: AgentCapabilities
              type: object
              additionalProperties: false
              required:
              - memoryEnabled
              - mcpServerCount
              - skillBindingCount
              properties:
                memoryEnabled:
                  type: boolean
                mcpServerCount:
                  type: integer
                  format: int64
                  minimum: 0
                skillBindingCount:
                  type: integer
                  format: int64
                  minimum: 0
- route: /playground
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-playground/src/appRuntimeApiOperations.ts
