  operation: appWalletOverviewRetrieve
  operation_id: wallet.overview.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/wallet/overview
  sdk_domain: commerce
  summary: Wallet Overview Retrieve
  description: Standard appbase commerce API for wallet.overview.retrieve; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_account
  - commerce_account_ledger_entry
  - commerce_account_hold
  - commerce_exchange_rule
  - commerce_order
  - commerce_payment_attempt
  query_parameters: []
  response_schema: &id002
    name: CommerceStandardResourceResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            nullable: true
            maxLength: 64
          createdAt:
            type: string
            nullable: true
            maxLength: 64
          updatedAt:
            type: string
            nullable: true
            maxLength: 64
- route: /console/wallet
