fragment: operations/app-platform
frontend_operations:
- route: /apps
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-app-center/src/services/appService.ts
  operation: getApps
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/platform/apps/store
  description: Returns public App Store entries where PlusApp runtime status is ACTIVE and config.portal.marketStatus is PUBLISHED. Authenticated positive-organization app sessions may read same-tenant public organization_id = 0 app projections; tenant isolation is always enforced.
  read_sources:
  - plus_app
  - plus_category
  - studio_catalog_action
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int32
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int32
      minimum: 1
      maximum: 100
  - name: q
    schema:
      type: string
      maxLength: 128
  - name: category
    schema:
      type: string
      maxLength: 128
  - name: platform_type
    schema:
      type: string
      enum:
      - Desktop
      - Mobile
      - Web
      - Mini Program
    deprecated: true
  - name: platform_types
    schema:
      type: array
      maxItems: 4
      uniqueItems: true
      items:
        type: string
        enum:
        - Desktop
        - Mobile
        - Web
        - Mini Program
    style: form
    explode: false
  - name: sort
    schema:
      type: string
      enum:
      - popular_desc
      - rating_desc
      - newest_desc
  - name: status
    schema:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
  - name: start_time
    schema:
      type: string
      format: date-time
      maxLength: 64
      description: UTC ISO-8601 date-time ending in Z or a local date/date-time without timezone offset.
  - name: end_time
    schema:
      type: string
      format: date-time
      maxLength: 64
      description: UTC ISO-8601 date-time ending in Z or a local date/date-time without timezone offset.
  response_schema:
    name: AppCatalogResponse
    required:
    - items
    - total
    - page
    - pageSize
    - hasNextPage
    properties:
      items:
        type: array
        maxItems: 100
        items:
          name: AppCatalogItem
          type: object
          additionalProperties: false
          required: &id001
          - id
          - name
          - developer
          - category
          - image
          - rating
          - description
          - downloads
          - screenshots
          - features
          - releases
          properties: &id002
            id:
              type: string
              minLength: 1
              maxLength: 128
              description: Stable application identity from plus_app.config.standard.appKey when present; falls back to plus_app.id only when appKey is absent.
            name:
              type: string
              minLength: 1
              maxLength: 128
            developer:
              type: string
              minLength: 1
              maxLength: 128
            category:
              type: string
              minLength: 1
              maxLength: 128
            image:
              $ref: '#/components/schemas/MediaResource'
            rating:
              type: number
              minimum: 0
              maximum: 5
            description:
              type: string
              maxLength: 4096
            downloads:
              type: string
              maxLength: 64
            screenshots:
              type: array
              maxItems: 20
              items:
                $ref: '#/components/schemas/MediaResource'
            features:
              type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 128
            releases:
              type: array
              maxItems: 64
              items:
                name: AppReleaseItem
                type: object
                additionalProperties: false
                required:
                - id
                - platformType
                - os
                - version
                - size
                - releaseDate
                - artifact
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  platformType:
                    type: string
                    enum:
                    - Desktop
                    - Mobile
                    - Web
                    - Mini Program
                  os:
                    type: string
                    enum:
                    - Windows
                    - macOS
                    - Linux
                    - iOS
                    - Android
                    - HarmonyOS
                    - PC Web
                    - Mobile Web
                    - WeChat
                    - Alipay
                    - ByteDance
                    - Baidu
                    - QuickApp
                  version:
                    type: string
                    minLength: 1
                    maxLength: 64
                  size:
                    type: string
                    maxLength: 64
                  releaseDate:
                    type: string
                    maxLength: 64
                  artifact:
                    $ref: '#/components/schemas/MediaResource'
                  whatsNew:
                    type: string
                    maxLength: 4096
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int32
        minimum: 1
      pageSize:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
      hasNextPage:
        type: boolean
- route: /apps
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-app-center/src/services/appService.ts
  operation: getAppById
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/platform/apps/store/{appId}
  description: Path parameter appId accepts either the stable appKey or numeric plus_app.id and applies the same ACTIVE/PUBLISHED and public organization_id = 0 visibility rules as getApps.
  read_sources:
  - plus_app
  - plus_category
  - studio_catalog_action
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters: []
  response_schema:
    name: AppDetailResponse
    type: object
    additionalProperties: false
    required: *id001
    properties: *id002
- route: /apps
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-app-center/src/services/appService.ts
  operation: getCategories
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/platform/apps/store/categories
  read_sources:
  - plus_category
  query_parameters: []
  response_schema:
    name: AppCategoriesResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items:
          type: string
          minLength: 1
          maxLength: 128
