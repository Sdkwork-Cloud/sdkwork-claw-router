fragment: operations/backend-commerce-payments
frontend_operations:
- route: /admin/payments
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-payments/src/paymentsService.ts
  operation: backendPaymentsProvidersList
  operation_id: payments.providers.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/payments/providers
  sdk_domain: commerce
  summary: Payments Providers List
  description: Standard appbase commerce API for payments.providers.list; no legacy billing compatibility route is exposed.
  read_sources: &paymentReadSources
  - commerce_payment_provider
  - commerce_payment_provider_account
  - commerce_payment_method
  - commerce_payment_channel
  - commerce_payment_route_rule
  - commerce_payment_intent
  - commerce_payment_attempt
  - commerce_payment_webhook_event
  - commerce_payment_reconciliation_run
  query_parameters: &paymentListQueryParameters
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommercePaymentProviderListResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items: &commercePaymentProviderItem
          name: CommercePaymentProviderItem
          type: object
          additionalProperties: false
          required:
          - id
          - providerCode
          - displayName
          - providerType
          - supportedCountries
          - supportedCurrencies
          - capabilities
          - status
          - createdAt
          - updatedAt
          properties:
            id: &idSchema
              type: string
              minLength: 1
              maxLength: 128
            providerCode: &paymentProviderCodeSchema
              type: string
              enum:
              - wechat_pay
              - alipay
              - paypal
              - stripe
              - apple_pay
              - google_pay
            displayName:
              type: string
              minLength: 1
              maxLength: 128
            providerType:
              type: string
              enum:
              - domestic_wallet
              - international_wallet
              - card_processor
              - platform_wallet
              - account_balance
            settlementType:
              type: string
              nullable: true
              enum:
              - direct
              - aggregator
              - platform
            supportedCountries:
              type: array
              items: &countryCodeSchema
                type: string
                minLength: 2
                maxLength: 2
                pattern: ^[A-Z]{2}$
            supportedCurrencies:
              type: array
              items: &currencyCodeSchema
                type: string
                minLength: 3
                maxLength: 3
                pattern: ^[A-Z]{3}$
            capabilities:
              type: array
              items:
                type: string
                enum:
                - payment_intent
                - payment_query
                - payment_close
                - refund
                - webhook
                - reconciliation
                - tokenization
            status: &paymentConfigStatusSchema
              type: string
              enum:
              - active
              - inactive
              - disabled
            createdAt: &timestampSchema
              type: string
              minLength: 1
              maxLength: 64
            updatedAt: *timestampSchema
      total: &totalSchema
        type: integer
        format: int64
        minimum: 0
      page: &pageSchema
        type: integer
        format: int64
        minimum: 1
      pageSize: &pageSizeSchema
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /admin/payments
