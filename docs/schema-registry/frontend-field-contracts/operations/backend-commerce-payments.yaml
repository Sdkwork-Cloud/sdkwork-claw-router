    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items: &commercePaymentProviderAccountItem
          name: CommercePaymentProviderAccountItem
          type: object
          additionalProperties: false
          required:
          - id
          - accountNo
          - providerCode
          - merchantId
          - environment
          - countryCode
          - settlementCurrency
          - secretRef
          - status
          - createdAt
          - updatedAt
          properties:
            id: *idSchema
            accountNo: &accountNoSchema
              type: string
              minLength: 1
              maxLength: 128
              pattern: ^[A-Za-z0-9_-]+$
            providerCode: *paymentProviderCodeSchema
            accountRole: &paymentProviderAccountRoleSchema
              type: string
              nullable: true
              enum:
              - merchant
              - service_provider
            merchantId: &merchantIdSchema
              type: string
              minLength: 1
              maxLength: 128
            environment: &paymentEnvironmentSchema
              type: string
              enum:
              - sandbox
              - production
            countryCode: *countryCodeSchema
            settlementCurrency: *currencyCodeSchema
            secretRef: &secretRefSchema
              type: string
              minLength: 1
              maxLength: 256
            webhookSecretRef:
              type: string
              nullable: true
              maxLength: 256
            certificateRef:
              type: string
              nullable: true
              maxLength: 256
            rotatedAt:
              type: string
              nullable: true
              maxLength: 64
            status: *paymentConfigStatusSchema
            note:
              type: string
              nullable: true
              maxLength: 512
            createdAt: *timestampSchema
            updatedAt: *timestampSchema
      total: *totalSchema
      page: *pageSchema
      pageSize: *pageSizeSchema
