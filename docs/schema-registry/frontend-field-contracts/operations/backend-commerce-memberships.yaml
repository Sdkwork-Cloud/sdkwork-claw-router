- route: /admin/memberships
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-memberships/src/membershipsService.ts
  operation: backendMembershipsPlansCreate
  operation_id: memberships.plans.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/memberships/plans
  sdk_domain: commerce
  summary: Memberships Plans Create
  description: Standard appbase commerce API for memberships.plans.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_membership_plan
  - commerce_membership_entitlement
  request_id_header: true
  idempotency_required: true
  write_tables:
  - commerce_membership_plan
  - commerce_membership_entitlement
  - ops_audit_log
  request_schema: &id001
    name: CommerceMembershipPlanMutationRequest
    type: object
    additionalProperties: false
    required:
    - code
    - name
    properties:
      code:
        type: string
        minLength: 1
        maxLength: 128
        pattern: ^[A-Za-z0-9_-]+$
      name:
        type: string
        minLength: 1
        maxLength: 256
      rank:
        type: integer
        format: int64
        minimum: 0
      benefits:
        type: array
        items:
          name: CommerceMembershipBenefitMutationRequest
          type: object
          additionalProperties: false
          required:
          - name
          properties:
            id:
              type: integer
              format: int64
              minimum: 0
            name:
              type: string
              minLength: 1
              maxLength: 256
            benefitKey:
              type: string
              nullable: true
              maxLength: 128
            type:
              type: string
              nullable: true
              maxLength: 64
            description:
              type: string
              nullable: true
              maxLength: 512
            icon:
              type: string
              nullable: true
              maxLength: 512
            claimed:
              type: boolean
            usageLimit:
              type: integer
              format: int64
              nullable: true
              minimum: 0
            usedCount:
              type: integer
              format: int64
              nullable: true
              minimum: 0
      status:
        type: string
        enum:
        - active
        - inactive
        - disabled
  response_schema: &id002
    name: CommerceStandardResourceResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            nullable: true
            maxLength: 64
          createdAt:
            type: string
            nullable: true
            maxLength: 64
          updatedAt:
            type: string
            nullable: true
            maxLength: 64
