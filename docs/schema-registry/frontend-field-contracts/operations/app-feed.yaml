fragment: operations/app-feed
frontend_operations:
- route: /forum
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-forum/src/forumService.ts
  operation: fetchForumOverview
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/content/feeds/overview
  sdk_domain: feed
  read_sources:
  - content_forum_post
  - content_comment
  - content_reaction
  - content_favorite
  query_parameters: []
  response_schema:
    name: ForumOverviewResponse
    type: object
    additionalProperties: false
    required:
    - stats
    - communityLinks
    - source
    properties:
      stats:
        name: ForumOverviewStats
        type: object
        additionalProperties: false
        required:
        - totalPosts
        - totalComments
        - memberCount
        - onlineMembers
        properties:
          totalPosts:
            type: integer
            format: int64
            minimum: 0
          totalComments:
            type: integer
            format: int64
            minimum: 0
          memberCount:
            type: integer
            format: int64
            minimum: 0
          onlineMembers:
            type: integer
            format: int64
            minimum: 0
      communityLinks:
        type: array
        maxItems: 16
        items:
          name: ForumCommunityLink
          type: object
          additionalProperties: false
          required:
          - id
          - label
          - url
          - tone
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 64
            label:
              type: string
              minLength: 1
              maxLength: 128
            url:
              type: string
              minLength: 1
              maxLength: 2048
            qrCode:
              $ref: '#/components/schemas/MediaResource'
            tone:
              type: string
              enum:
              - green
              - blue
              - teal
              - red
              - pink
      source:
        name: ForumOverviewSource
        type: object
        additionalProperties: false
        required:
        - sourceLabel
        - sourceDescription
        - sourceTables
        - observedAt
        properties:
          sourceLabel:
            type: string
            minLength: 1
            maxLength: 128
          sourceDescription:
            type: string
            minLength: 1
            maxLength: 512
          sourceTables:
            type: array
            maxItems: 8
            items:
              type: string
              minLength: 1
              maxLength: 128
          observedAt:
            type: string
            minLength: 1
            maxLength: 64
- route: /forum
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-forum/src/forumService.ts
  operation: fetchForumFeeds
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/content/feeds
  sdk_domain: feed
  read_sources:
  - content_forum_post
  - content_reaction
  - content_favorite
  query_parameters:
  - name: type
    schema:
      type: string
      enum:
      - recommend
      - hot
      - top
  - name: content_type
    schema:
      type: string
      enum:
      - all
      - feeds
      - FEEDS
  - name: q
    schema:
      type: string
      maxLength: 128
  - name: author_id
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 100
  response_schema: &id002
    name: ForumFeedItemList
    type: array
    maxItems: 100
    items: &id001
      name: ForumFeedItem
      type: object
      additionalProperties: false
      required:
      - id
      - title
      - content
      - summary
      - cover
      - contentType
      - categoryId
      - tags
      - author
      - viewCount
      - likeCount
      - commentCount
      - shareCount
      - isLiked
      - isCollected
      - isTop
      - isHot
      - isRecommended
      - createdAt
      - updatedAt
      properties:
        id:
          type: integer
          format: int64
          minimum: 1
        title:
          type: string
          minLength: 1
          maxLength: 255
        content:
          type: string
          maxLength: 20000
        summary:
          type: string
          maxLength: 1024
        cover:
          $ref: '#/components/schemas/MediaResource'
        contentType:
          type: string
          enum:
          - feeds
        categoryId:
          type: integer
          format: int64
          minimum: 0
        tags:
          type: array
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 64
        author:
          name: ForumAuthor
          type: object
          additionalProperties: false
          required:
          - id
          - name
          - isFollowing
          properties:
            id:
              type: integer
              format: int64
              minimum: 0
            name:
              type: string
              minLength: 1
              maxLength: 128
            avatar:
              $ref: '#/components/schemas/MediaResource'
            bio:
              type: string
              maxLength: 512
            isFollowing:
              type: boolean
        viewCount:
          type: integer
          format: int64
          minimum: 0
        likeCount:
          type: integer
          format: int64
          minimum: 0
        commentCount:
          type: integer
          format: int64
          minimum: 0
        shareCount:
          type: integer
          format: int64
          minimum: 0
        isLiked:
          type: boolean
        isCollected:
          type: boolean
        isTop:
          type: boolean
        isHot:
          type: boolean
        isRecommended:
          type: boolean
        createdAt:
          type: string
          maxLength: 64
        updatedAt:
          type: string
          maxLength: 64
