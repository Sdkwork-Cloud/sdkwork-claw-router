- route: /forum
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-forum/src/forumService.ts
  operation: createForumFeed
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/content/feeds
  sdk_domain: feed
  read_sources:
  - content_forum_post
  write_tables:
  - content_forum_post
  request_schema:
    name: ForumCreateFeedRequest
    type: object
    additionalProperties: false
    required:
    - content
    properties:
      title:
        type: string
        maxLength: 255
      content:
        type: string
        minLength: 1
        maxLength: 2000
      categoryId:
        type: integer
        format: int64
        minimum: 0
      images:
        type: array
        maxItems: 20
        items:
          $ref: '#/components/schemas/MediaResource'
      tags:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
      source:
        type: string
        maxLength: 100
      sourceUrl:
        type: string
        maxLength: 500
  response_schema: *id001
