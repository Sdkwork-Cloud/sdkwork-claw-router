fragment: operations/app-commerce-fulfillments
frontend_operations:
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appFulfillmentsList
  operation_id: fulfillments.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/fulfillments
  sdk_domain: commerce
  summary: Fulfillments List
  description: Standard appbase commerce API for fulfillments.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_fulfillment_order
  - commerce_fulfillment_item
  - commerce_order
  - commerce_order_item
  - commerce_shipment
  - commerce_digital_delivery
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
