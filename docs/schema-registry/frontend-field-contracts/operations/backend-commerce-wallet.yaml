fragment: operations/backend-commerce-wallet
frontend_operations:
- route: /admin/wallet
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-wallet/src/walletService.ts
  operation: backendWalletAccountsList
  operation_id: wallet.accounts.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/wallet/accounts
  sdk_domain: commerce
  summary: Wallet Accounts List
  description: Standard appbase commerce API for wallet.accounts.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_account
  - commerce_account_ledger_entry
  - commerce_account_hold
  - commerce_exchange_rule
  - commerce_order
  - commerce_payment_attempt
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id001
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
