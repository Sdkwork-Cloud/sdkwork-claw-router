- route: /admin/wallet
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-wallet/src/walletService.ts
  operation: backendWalletAdjustmentsCreate
  operation_id: wallet.adjustments.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/wallet/adjustments
  sdk_domain: commerce
  summary: Wallet Adjustments Create
  description: Standard appbase commerce API for wallet.adjustments.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_account
  - commerce_account_ledger_entry
  - commerce_account_hold
  - commerce_exchange_rule
  - commerce_order
  - commerce_payment_attempt
  idempotency_required: true
  write_tables:
  - commerce_account
  - commerce_account_ledger_entry
  - ops_audit_log
  request_schema:
    name: CommerceStandardCommandRequest
    type: object
    additionalProperties: false
    properties:
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        maxLength: 512
      metadata:
        type: object
        additionalProperties: true
  response_schema:
    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
