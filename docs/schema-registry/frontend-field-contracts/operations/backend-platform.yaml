- route: /admin/app
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-app-center/src/services/adminAppService.ts
  operation: fetchApps
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/platform/apps
  read_sources:
  - plus_app
  - plus_category
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters:
  - name: q
    schema:
      type: string
      maxLength: 128
  - name: status
    schema:
      type: string
      enum:
      - ACTIVE
      - INACTIVE
  - name: market_status
    schema:
      type: string
      enum:
      - DRAFT
      - PUBLISHED
      - OFFLINE
  - name: app_type
    schema:
      type: string
      maxLength: 64
      pattern: ^[A-Za-z0-9._:-]+$
  - name: category_id
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  response_schema:
    name: AdminAppListResponse
    required:
    - items
    - total
    - page
    - pageSize
    - hasNextPage
    properties:
      items:
        type: array
        maxItems: 200
        items:
          name: AdminAppItemResponse
          type: object
          additionalProperties: false
          required: &id020
          - id
          - uuid
          - name
          - icon
          - resourceList
          - config
          - status
          - marketStatus
          - platforms
          - installPlatforms
          - installSkill
          - installConfig
          - releaseNotes
          - createdAt
          - updatedAt
          properties: &id021
            id:
              type: string
              minLength: 1
              maxLength: 128
            uuid:
              type: string
              minLength: 1
              maxLength: 128
            userId:
              type: string
              nullable: true
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 255
            description:
              type: string
              nullable: true
              maxLength: 4000
            version:
              type: string
              nullable: true
              maxLength: 64
            icon:
              $ref: '#/components/schemas/MediaResource'
            resourceList:
              type: object
              additionalProperties: true
            projectId:
              type: string
              nullable: true
              maxLength: 128
            accessUrl:
              type: string
              nullable: true
              maxLength: 512
            config:
              name: AdminAppConfig
              type: object
              additionalProperties: true
              required: &id018
              - standard
              properties: &id019
                standard:
                  name: AdminAppConfigStandard
                  type: object
                  additionalProperties: true
                  required:
                  - appKey
                  properties:
                    appKey:
                      type: string
                      minLength: 1
                      maxLength: 128
                      pattern: ^[a-z0-9](?:[a-z0-9-]*[a-z0-9])?$
                      description: Stable PlusApp identity key. Must use lowercase kebab-case.
                portal:
                  name: AdminAppPortalConfig
                  type: object
                  additionalProperties: true
                  properties:
                    marketStatus:
                      type: string
                      enum:
                      - DRAFT
                      - PUBLISHED
                      - OFFLINE
            appKey:
              type: string
              nullable: true
              maxLength: 128
              pattern: ^[A-Za-z0-9._:-]+$
            status:
              type: string
              enum:
              - ACTIVE
              - INACTIVE
            marketStatus:
              type: string
              enum:
              - DRAFT
              - PUBLISHED
              - OFFLINE
            appType:
              type: string
              nullable: true
              maxLength: 64
              pattern: ^[A-Za-z0-9._:-]+$
            platforms:
              type: object
              additionalProperties: true
            installPlatforms:
              type: object
              additionalProperties: true
            installSkill:
              type: object
              additionalProperties: true
            installConfig:
              type: object
              additionalProperties: true
            releaseNotes:
              type: array
              maxItems: 128
              items:
                type: object
                additionalProperties: true
            packageName:
              type: string
              nullable: true
              maxLength: 255
            bundleId:
              type: string
              nullable: true
              maxLength: 255
            storeUrl:
              type: string
              nullable: true
              maxLength: 512
            artifact:
              $ref: '#/components/schemas/MediaResource'
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
        description: PlusApp snapshots returned by the backend management API.
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
      hasNextPage:
        type: boolean
