fragment: operations/app-commerce-payments
frontend_operations:
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appPaymentsMethodsList
  operation_id: payments.methods.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/payments/methods
  sdk_domain: commerce
  summary: Payments Methods List
  description: Standard appbase commerce API for payments.methods.list; no legacy billing compatibility route is exposed.
  read_sources: &appPaymentReadSources
  - commerce_payment_provider
  - commerce_payment_method
  - commerce_payment_intent
  - commerce_payment_attempt
  query_parameters: &appPaymentListQueryParameters
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommercePaymentMethodListResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items: &commercePaymentMethodItem
          name: CommercePaymentMethodItem
          type: object
          additionalProperties: false
          required:
          - id
          - methodCode
          - displayName
          - methodType
          - checkoutScenes
          - status
          - sortOrder
          - createdAt
          - updatedAt
          properties:
            id: &idSchema
              type: string
              minLength: 1
              maxLength: 128
            methodCode: &paymentMethodCodeSchema
              type: string
              enum:
              - wechat_pay
              - alipay
              - paypal
              - card
              - apple_pay
              - google_pay
              - wallet_balance
            displayName:
              type: string
              minLength: 1
              maxLength: 128
            providerCode:
              type: string
              nullable: true
              enum:
              - wechat_pay
              - alipay
              - paypal
              - stripe
              - apple_pay
              - google_pay
            methodType:
              type: string
              enum:
              - domestic_wallet
              - international_wallet
              - card
              - platform_wallet
              - account_balance
            checkoutScenes:
              type: array
              items: &paymentSceneSchema
                type: string
                enum:
                - checkout
                - membership_purchase
                - points_recharge
                - wallet_recharge
                - subscription
                - invoice
            status: &paymentConfigStatusSchema
              type: string
              enum:
              - active
              - inactive
              - disabled
            sortOrder:
              type: integer
              format: int64
              minimum: 0
            createdAt: &timestampSchema
              type: string
              minLength: 1
              maxLength: 64
            updatedAt: *timestampSchema
      total: &totalSchema
        type: integer
        format: int64
        minimum: 0
      page: &pageSchema
        type: integer
        format: int64
        minimum: 1
      pageSize: &pageSizeSchema
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appPaymentsIntentsCreate
  operation_id: payments.intents.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/payments/intents
  sdk_domain: commerce
  summary: Payments Intents Create
  description: Standard appbase commerce API for payments.intents.create; no legacy billing compatibility route is exposed.
  read_sources: *appPaymentReadSources
  request_id_header: true
  idempotency_required: true
  write_tables:
  - commerce_payment_intent
  - ops_audit_log
  request_schema: &commercePaymentIntentCreateRequest
    name: CommercePaymentIntentCreateRequest
    type: object
    additionalProperties: false
    required:
    - orderId
    - subjectType
    - amount
    - currencyCode
    - methodCode
    properties:
      orderId:
        type: string
        minLength: 1
        maxLength: 128
      checkoutSessionId:
        type: string
        nullable: true
        maxLength: 128
      subjectType: &paymentSubjectTypeSchema
        type: string
        enum:
        - order
        - membership_purchase
        - points_recharge
        - wallet_recharge
        - subscription
        - invoice
      amount: &moneyAmountSchema
        type: string
        pattern: ^\d+(?:\.\d{1,6})?$
      currencyCode: &currencyCodeSchema
        type: string
        minLength: 3
        maxLength: 3
        pattern: ^[A-Z]{3}$
      methodCode: *paymentMethodCodeSchema
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        nullable: true
        maxLength: 512
  response_schema: &commercePaymentIntentResponse
    name: CommercePaymentIntentResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: &commercePaymentIntentItem
        name: CommercePaymentIntentItem
        type: object
        additionalProperties: false
        required:
        - id
        - intentNo
        - orderId
        - subjectType
        - amount
        - currencyCode
        - status
        - createdAt
        - updatedAt
        properties:
          id: *idSchema
          intentNo:
            type: string
            minLength: 1
            maxLength: 128
          orderId:
            type: string
            minLength: 1
            maxLength: 128
          checkoutSessionId:
            type: string
            nullable: true
            maxLength: 128
          subjectType: *paymentSubjectTypeSchema
          methodCode:
            type: string
            nullable: true
            enum:
            - wechat_pay
            - alipay
            - paypal
            - card
            - apple_pay
            - google_pay
            - wallet_balance
          providerCode:
            type: string
            nullable: true
            enum:
            - wechat_pay
            - alipay
            - paypal
            - stripe
            - apple_pay
            - google_pay
          amount: *moneyAmountSchema
          currencyCode: *currencyCodeSchema
          status: &paymentRuntimeStatusSchema
            type: string
            enum:
            - pending
            - processing
            - succeeded
            - failed
            - canceled
            - expired
            - refunding
            - refunded
          createdAt: *timestampSchema
          updatedAt: *timestampSchema
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appPaymentsIntentsRetrieve
  operation_id: payments.intents.retrieve
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/payments/intents/{paymentIntentId}
  sdk_domain: commerce
  summary: Payments Intents Retrieve
