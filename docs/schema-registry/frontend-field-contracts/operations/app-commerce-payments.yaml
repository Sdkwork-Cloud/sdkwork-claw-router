- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
  operation: appPaymentsIntentsAttemptsCreate
  operation_id: payments.intents.attempts.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/payments/intents/{paymentIntentId}/attempts
  sdk_domain: commerce
  summary: Payments Intents Attempts Create
  description: Standard appbase commerce API for payments.intents.attempts.create; no legacy billing compatibility route is exposed.
  read_sources: *appPaymentReadSources
  request_id_header: true
  idempotency_required: true
  write_tables:
  - commerce_payment_attempt
  - commerce_payment_intent
  - ops_audit_log
  request_schema:
    name: CommercePaymentAttemptCreateRequest
    type: object
    additionalProperties: false
    required:
    - methodCode
    properties:
      methodCode: *paymentMethodCodeSchema
      providerCode:
        type: string
        nullable: true
        enum:
        - wechat_pay
        - alipay
        - paypal
        - stripe
        - apple_pay
        - google_pay
      returnUrl:
        type: string
        nullable: true
        maxLength: 2048
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        nullable: true
        maxLength: 512
  response_schema: &commercePaymentAttemptResponse
    name: CommercePaymentAttemptResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: &commercePaymentAttemptItem
        name: CommercePaymentAttemptItem
        type: object
        additionalProperties: false
        required:
        - id
        - attemptNo
        - intentId
        - providerCode
        - amount
        - currencyCode
        - status
        - createdAt
        properties:
          id: *idSchema
          attemptNo:
            type: string
            minLength: 1
            maxLength: 128
          intentId:
            type: string
            minLength: 1
            maxLength: 128
          providerCode:
            type: string
            enum:
            - wechat_pay
            - alipay
            - paypal
            - stripe
            - apple_pay
            - google_pay
          methodCode: *paymentMethodCodeSchema
          externalTradeNo:
            type: string
            nullable: true
            maxLength: 128
          amount: *moneyAmountSchema
          currencyCode: *currencyCodeSchema
          status: *paymentRuntimeStatusSchema
          paidAt:
            type: string
            nullable: true
            maxLength: 64
          createdAt: *timestampSchema
          updatedAt:
            type: string
            nullable: true
            maxLength: 64
- route: /console/checkout
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-checkout/src/checkoutService.ts
