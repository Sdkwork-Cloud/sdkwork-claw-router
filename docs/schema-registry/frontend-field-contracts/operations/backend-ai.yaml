  operation: addGroup
  operation_id: channelGroups.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/ai/channel_groups
  read_sources:
  - ai_channel_group
  - ai_pricing_plan
  write_tables:
  - ai_channel_group
  - ai_channel_group_resource
