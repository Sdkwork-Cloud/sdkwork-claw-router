- route: /admin/model
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-model/src/modelService.ts
  operation: triggerModelRankingRefresh
  kind: action
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/ai/model_rankings/refresh
  read_sources:
  - ai_model
  - ai_usage_fact
  - ai_model_rank_snapshot
  write_tables:
  - ai_model_rank_snapshot
  - ops_job_execution
  request_id_header: true
  request_schema:
    name: ModelRankingRefreshTriggerRequest
    additionalProperties: false
    properties:
      rankScope:
        type: string
        minLength: 1
        maxLength: 80
        pattern: ^[A-Za-z0-9._:-]+$
        description: Ranking scope to regenerate. Defaults to commercial-default.
      snapshotPeriod:
        type: string
        enum:
        - hourly
        - daily
        - weekly
        - monthly
        description: Snapshot granularity used by the ranking worker.
      limit:
        type: integer
        format: int64
        minimum: 1
        maximum: 1000
        description: Maximum ranking rows to generate.
      lookbackDays:
        type: integer
        format: int64
        minimum: 1
        maximum: 366
        description: Source usage lookback window in days.
      refreshIntervalSeconds:
        type: integer
        format: int64
        minimum: 60
        maximum: 86400
        description: Planned interval used for audit metadata and next refresh time.
      cacheMaxAgeSeconds:
        type: integer
        format: int64
        minimum: 1
        maximum: 86400
        description: Cache freshness contract for ranking readers after this refresh.
  response_schema:
    name: ModelRankingRefreshTriggerResponse
    required:
    - triggered
    - status
    - tenantId
    - organizationId
    - rankScope
    - snapshotDate
    - snapshotPeriod
    - windowStart
    - windowEnd
    - generatedCount
    - sourceCount
    - refreshIntervalSeconds
    - cacheMaxAgeSeconds
    - nextRefreshAt
    properties:
      triggered:
        type: boolean
        description: Whether a manual refresh worker run was started.
      status:
        type: string
        enum:
        - succeeded
        - empty
        description: Result of the manual ranking worker run.
      tenantId:
        type: integer
        format: int64
        minimum: 0
      organizationId:
        type: integer
        format: int64
        minimum: 0
      rankScope:
        type: string
        minLength: 1
        maxLength: 80
      snapshotDate:
        type: string
        minLength: 1
        maxLength: 64
      snapshotPeriod:
        type: string
        enum:
        - hourly
        - daily
        - weekly
        - monthly
      windowStart:
        type: string
        minLength: 1
        maxLength: 64
      windowEnd:
        type: string
        minLength: 1
        maxLength: 64
      generatedCount:
        type: integer
        format: int64
        minimum: 0
      sourceCount:
        type: integer
        format: int64
        minimum: 0
      refreshIntervalSeconds:
        type: integer
        format: int64
        minimum: 60
      cacheMaxAgeSeconds:
        type: integer
        format: int64
        minimum: 1
      nextRefreshAt:
        type: string
        minLength: 1
        maxLength: 64
