  - ops_audit_log
  request_schema:
    name: AdminChannelGroupCreateRequest
    required:
    - groupName
    - groupCode
    - priceReferenceMode
    - groupType
    - status
    properties:
      groupName:
        type: string
        minLength: 1
        maxLength: 128
        description: AI channel group display name.
      groupCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
        description: Stable AI channel group code.
      priceReferenceMode:
        type: string
        enum:
        - multiplier
        - official_price
        description: Pricing reference mode for this AI channel group.
      rateMultiplier:
        type: number
        minimum: 0.01
        maximum: 100
        description: Customer rate multiplier rounded to six decimals.
      officialPriceMultiplier:
        type: number
        minimum: 0.01
        maximum: 100
        description: Official price multiplier rounded to six decimals.
      groupType:
        type: string
        enum:
        - public
        - dedicated
        description: AI channel group allocation mode.
      capacity:
        type: object
        additionalProperties: false
        properties:
          total:
            type: number
            minimum: 0
            maximum: 1000000000
      resourceGroupCodes:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9._-]+$
        maxItems: 200
        description: AI resource group codes directly granted to this channel group.
      resourceCodes:
        type: array
        items:
          type: string
          minLength: 1
          maxLength: 128
          pattern: ^[a-z0-9._-]+$
        maxItems: 200
        description: Individual AI resource codes directly granted to this channel group.
      status:
        type: string
        enum:
        - active
        - disabled
  response_schema:
    name: AdminChannelGroupMutationResponse
    required:
    - item
    properties:
      item:
        name: AdminChannelGroupItem
        type: object
        additionalProperties: false
        required: *adminChannelGroupItemRequired
        properties: *adminChannelGroupItemProperties
        description: Persisted channel group snapshot returned by the backend.
