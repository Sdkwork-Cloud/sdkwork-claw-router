fragment: operations/backend-marketing
frontend_operations:
- route: /admin/marketing/referrals
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-marketing/src/marketingService.ts
  operation: fetchReferralStats
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/marketing/referral_stats
  operation_id: marketing.referralStats.list
  read_sources:
  - ops_referral_stat_snapshot
  query_parameters: []
  response_schema:
    name: AdminReferralStatsResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminReferralStatItem
          type: object
          additionalProperties: false
          required:
          - id
          - inviter
          - total_invited
          - total_revenue
          - bonus_awarded
          - link
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            inviter:
              type: string
              minLength: 1
              maxLength: 128
            total_invited:
              type: integer
              format: int64
              minimum: 0
            total_revenue:
              type: string
              pattern: ^\$?\d+(?:\.\d{1,2})?$
            bonus_awarded:
              type: string
              pattern: ^\$?\d+(?:\.\d{1,2})?$
            link:
              type: string
              minLength: 1
              maxLength: 2048
