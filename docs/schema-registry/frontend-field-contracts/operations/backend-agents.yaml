fragment: operations/backend-agents
frontend_operations:
- route: /admin/agents
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-agents/src/agentService.ts
  operation: listAgents
  operation_id: agentDefinitions.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/agents
  sdk_domain: agents
  tag: agents
  summary: List managed agents
  description: Returns organization-scoped agent definitions for admin governance, including active default version and derived capability summary.
  read_sources:
  - ai_agent
  - ai_agent_version
  - ai_agent_tool_binding
  - ai_agent_mcp_server
  - ai_agent_memory
  query_parameters:
  - name: q
    schema:
      type: string
      maxLength: 128
  - name: owner_user_id
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: status
    schema:
      type: string
      enum:
      - active
      - disabled
  - name: visibility
    schema:
      type: string
      enum:
      - private
      - organization
      - public
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 100
  response_schema:
    name: AdminAgentListResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: &id002
          name: AdminAgentItem
          type: object
          additionalProperties: false
          required:
          - id
          - ownerUserId
          - code
          - name
          - description
          - visibility
          - status
          - createdAt
          - updatedAt
          - defaultVersion
          - capabilities
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            ownerUserId:
              type: integer
              format: int64
              minimum: 1
            code:
              type: string
              minLength: 1
              maxLength: 96
              pattern: ^[a-z0-9][a-z0-9-]{0,95}$
            name:
              type: string
              minLength: 1
              maxLength: 128
            description:
              type: string
              maxLength: 1024
            visibility:
              type: string
              enum:
              - private
              - organization
              - public
            status:
              type: string
              enum:
              - active
              - disabled
            avatar:
              $ref: '#/components/schemas/MediaResource'
              nullable: true
            templateSource:
              type: string
              nullable: true
              maxLength: 128
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
            defaultVersion:
              name: AdminAgentVersionItem
              type: object
              additionalProperties: false
              required:
              - id
              - versionNo
              - releaseStatus
              - systemPrompt
              - toolPolicy
              - memoryPolicy
              - mcpPolicy
              - skillPolicy
              - runtimePolicy
              - createdAt
              - updatedAt
              properties:
                id:
                  type: string
                  minLength: 1
                  maxLength: 128
                versionNo:
                  type: integer
                  format: int64
                  minimum: 1
                releaseStatus:
                  type: string
                  enum:
                  - draft
                  - published
                  - archived
                model:
                  type: string
                  nullable: true
                  maxLength: 128
                systemPrompt:
                  type: string
                  maxLength: 32768
                toolPolicy: &id001
                  name: AgentPolicy
                  type: object
                  additionalProperties: true
                  description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
                memoryPolicy: *id001
                mcpPolicy: *id001
                skillPolicy: *id001
                runtimePolicy: *id001
                createdAt:
                  type: string
                  minLength: 1
                  maxLength: 64
                updatedAt:
                  type: string
                  minLength: 1
                  maxLength: 64
            capabilities:
              name: AdminAgentCapabilities
              type: object
              additionalProperties: false
              required:
              - memoryEnabled
              - mcpServerCount
              - skillBindingCount
              properties:
                memoryEnabled:
                  type: boolean
                mcpServerCount:
                  type: integer
                  format: int64
                  minimum: 0
                skillBindingCount:
                  type: integer
                  format: int64
                  minimum: 0
- route: /admin/agents
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-agents/src/agentService.ts
  operation: retrieveAgent
  operation_id: agentDefinitions.retrieve
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/agents/{agentId}
  sdk_domain: agents
  tag: agents
  summary: Retrieve managed agent
  description: Returns one organization-scoped agent by numeric id, uuid, or normalized code for admin governance.
  read_sources:
  - ai_agent
  - ai_agent_version
  - ai_agent_tool_binding
  - ai_agent_mcp_server
  - ai_agent_memory
  path_params:
  - agentId
  query_parameters: []
  response_schema: *id002
