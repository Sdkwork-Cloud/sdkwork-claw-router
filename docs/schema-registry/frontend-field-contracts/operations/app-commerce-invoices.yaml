fragment: operations/app-commerce-invoices
frontend_operations:
- route: /console/settlements
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-settlements/src/settlementsService.ts
  operation: appInvoicesList
  operation_id: invoices.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/invoices
  sdk_domain: commerce
  summary: Invoices List
  description: Standard appbase commerce API for invoices.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_invoice_title
  - commerce_invoice
  - commerce_invoice_item
  - commerce_invoice_event
  - commerce_order
  - commerce_payment_attempt
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /console/settlements
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-settlements/src/settlementsService.ts
