  - commerce_invoice_item
  - commerce_invoice_event
  - commerce_order
  - commerce_payment_attempt
  query_parameters: []
  response_schema:
    name: CommerceStandardResourceResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            nullable: true
            maxLength: 64
          createdAt:
            type: string
            nullable: true
            maxLength: 64
          updatedAt:
            type: string
            nullable: true
            maxLength: 64
- route: /console/settlements
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-settlements/src/settlementsService.ts
  operation: appInvoicesCreate
  operation_id: invoices.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/invoices
  sdk_domain: commerce
  summary: Invoices Create
  description: Standard appbase commerce API for invoices.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_invoice_title
  - commerce_invoice
  - commerce_invoice_item
  - commerce_invoice_event
  - commerce_order
  - commerce_payment_attempt
  request_id_header: true
  idempotency_required: true
  write_tables:
  - commerce_invoice
  - commerce_invoice_item
  - commerce_invoice_event
  - ops_audit_log
  request_schema:
    name: CommerceStandardCommandRequest
    type: object
    additionalProperties: false
    properties:
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        maxLength: 512
      metadata:
        type: object
        additionalProperties: true
  response_schema:
    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
