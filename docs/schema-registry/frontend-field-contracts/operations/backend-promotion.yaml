- route: /admin/marketing
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-marketing/src/marketingService.ts
  operation: backendPromotionOffersList
  operation_id: promotions.offers.management.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/promotions/offers
  sdk_domain: promotion
  summary: Promotion Offers List
  description: Standard appbase promotion API for promotions.offers.management.list.
  read_sources:
  - promotion_offer
  - promotion_coupon_stock
  - promotion_user_coupon
  - promotion_discount_application
  - commerce_order
  - commerce_order_item
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id001
    name: PromotionCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
