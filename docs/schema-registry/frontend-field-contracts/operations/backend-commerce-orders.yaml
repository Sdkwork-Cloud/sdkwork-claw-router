- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendOrdersManagementCancel
  operation_id: orders.management.cancel
  kind: action
  api_surface: backend
  openapi_exposed: false
  api_method: POST
  api_path: /backend/v3/api/orders/management/{orderId}/cancel
  sdk_domain: commerce
  summary: Orders Management Cancel
  description: Cancels an unpaid pending order through the Commerce backend management API.
  read_sources:
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_payment_attempt
  idempotency_required: true
  write_tables:
  - commerce_order
  - commerce_order_cancellation
  - commerce_order_event
  - ops_audit_log
  request_schema: &commerceOperationCommand
    name: CommerceOperationCommand
    type: object
    additionalProperties: true
    properties:
      reason:
        type: string
        nullable: true
        maxLength: 256
      source:
        type: string
        nullable: true
        maxLength: 64
      note:
        type: string
        nullable: true
        maxLength: 1024
  response_schema: &commerceOperationResponse
    name: CommerceOperationResponse
    type: object
    additionalProperties: true
    properties:
      id:
        type: string
        nullable: true
        maxLength: 128
      status:
        type: string
        nullable: true
        maxLength: 64
      success:
        type: boolean
        nullable: true
      message:
        type: string
        nullable: true
        maxLength: 1024
