  operation: createMessagingTemplate
  operation_id: templates.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/messaging/templates
  sdk_domain: messaging
  idempotency_required: true
  summary: Messaging template create
  description: Creates a logical SMS or email template and its first version/variant without binding it to any specific provider.
