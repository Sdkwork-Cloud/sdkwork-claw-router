  request_schema:
    name: MessagingTemplateCreateRequest
    type: object
    additionalProperties: false
    required: [templateCode, sceneCode, channel, deliveryPurpose, category, templateName, bodyTemplate]
    properties:
      templateCode: { type: string, minLength: 1, maxLength: 128 }
      sceneCode: { type: string, minLength: 1, maxLength: 128 }
