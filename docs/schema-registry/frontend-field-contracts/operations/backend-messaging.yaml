- route: /admin/messaging/route-rules
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-messaging/src/messagingService.ts
  operation: createMessagingRouteRule
  operation_id: routeRules.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/messaging/route_rules
  sdk_domain: messaging
  idempotency_required: true
  summary: Messaging route rule create
  description: Creates weighted and ordered delivery routing targets for one SMS or email scene.
  read_sources:
  - messaging_template
  - integration_provider_account
  - messaging_sender_identity
  - messaging_template_binding
  write_tables:
  - messaging_route_rule
  - messaging_route_rule_target
  - ops_audit_log
  request_schema:
    name: MessagingRouteRuleCreateRequest
    type: object
    additionalProperties: false
    required: [ruleCode, sceneCode, channel, deliveryPurpose, targets]
    properties:
      ruleCode: { type: string, minLength: 1, maxLength: 128 }
      sceneCode: { type: string, minLength: 1, maxLength: 128 }
      channel: { type: string, enum: [sms, email] }
      deliveryPurpose: { type: string, enum: [verification, transactional, marketing, system] }
      countryCode: { type: string, maxLength: 16 }
      locale: { type: string, maxLength: 32 }
      userSegment: { type: string, maxLength: 128 }
      priority: { type: integer, minimum: 1, maximum: 100000 }
      failoverPolicy:
        type: object
        additionalProperties: true
      targets:
        type: array
        minItems: 1
        maxItems: 10
        items:
          type: object
          additionalProperties: false
          required: [providerAccountId, targetOrder]
          properties:
            providerAccountId: { type: string, minLength: 1, maxLength: 128 }
            senderIdentityId: { type: string, maxLength: 128 }
            templateBindingId: { type: string, maxLength: 128 }
            targetOrder: { type: integer, minimum: 1, maximum: 10 }
            weight: { type: integer, minimum: 1, maximum: 10000 }
  response_schema: *messagingMutationResponse
