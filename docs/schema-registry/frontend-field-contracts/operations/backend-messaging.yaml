      deliveryPurpose: { type: string, enum: [verification, transactional, marketing, system] }
      category: { type: string, minLength: 1, maxLength: 64 }
      templateName: { type: string, minLength: 1, maxLength: 128 }
      subjectTemplate: { type: string, maxLength: 512 }
      bodyTemplate: { type: string, minLength: 1, maxLength: 20000 }
      contentFormat: { type: string, enum: [text, html, markdown] }
      locale: { type: string, maxLength: 32 }
      variableSchema:
        type: object
        additionalProperties: true
