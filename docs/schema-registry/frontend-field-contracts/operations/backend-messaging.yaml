  summary: Verification policy update
  description: Updates IAM verification-code policy limits and template binding for a login, registration, recovery, or MFA scene.
  read_sources:
  - iam_verification_scene_policy
  - messaging_template
  write_tables:
  - iam_verification_scene_policy
  - ops_audit_log
  request_schema:
    name: VerificationPolicyUpdateRequest
    type: object
    additionalProperties: false
    required: [allowedChannels, codeLength, ttlSeconds, maxVerifyAttempts, templateCode]
    properties:
      allowedChannels:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items: { type: string, enum: [sms, email] }
      defaultChannel: { type: string, enum: [sms, email] }
      codeLength: { type: integer, minimum: 4, maximum: 10 }
      ttlSeconds: { type: integer, minimum: 30, maximum: 1800 }
      resendIntervalSeconds: { type: integer, minimum: 10, maximum: 600 }
      maxSendPerHour: { type: integer, minimum: 1, maximum: 60 }
      maxVerifyAttempts: { type: integer, minimum: 1, maximum: 20 }
      templateCode: { type: string, minLength: 1, maxLength: 128 }
      riskPolicy:
        type: object
        additionalProperties: true
  response_schema: *messagingMutationResponse
