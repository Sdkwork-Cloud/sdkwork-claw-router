- route: /admin/messaging/providers
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-messaging/src/messagingService.ts
  operation: listMessagingProviderAccounts
  operation_id: providerAccounts.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/messaging/provider_accounts
  sdk_domain: messaging
  summary: Messaging provider accounts list
  description: Lists SMS and email provider accounts with messaging capability, health, and approval posture.
  read_sources:
  - integration_provider
  - integration_provider_account
  - messaging_provider_capability
  query_parameters: &messagingPageQuery
  - name: page
    schema: { type: integer, format: int64, minimum: 1 }
  - name: page_size
    schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
  - name: q
    schema: { type: string, maxLength: 128 }
  - name: status
    schema: { type: string, maxLength: 32 }
  - name: channel
    schema: { type: string, enum: [sms, email] }
  - name: provider_code
    schema: { type: string, maxLength: 64 }
  response_schema: &messagingCollectionResponse
    name: MessagingCollectionResponse
    type: object
    additionalProperties: false
    required: [items, total, page, pageSize]
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: true
          required: [id]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            code: { type: string, nullable: true, maxLength: 128 }
            name: { type: string, nullable: true, maxLength: 128 }
            displayName: { type: string, nullable: true, maxLength: 128 }
            status: { type: string, nullable: true, maxLength: 32 }
            publishStatus: { type: string, nullable: true, maxLength: 32 }
            deliveryStatus: { type: string, nullable: true, maxLength: 32 }
            channel: { type: string, nullable: true, maxLength: 32 }
            providerCode: { type: string, nullable: true, maxLength: 64 }
            sceneCode: { type: string, nullable: true, maxLength: 128 }
            sceneName: { type: string, nullable: true, maxLength: 128 }
            templateCode: { type: string, nullable: true, maxLength: 128 }
            templateName: { type: string, nullable: true, maxLength: 128 }
            targetMasked: { type: string, nullable: true, maxLength: 128 }
            targetHash: { type: string, nullable: true, maxLength: 128 }
            reasonCode: { type: string, nullable: true, maxLength: 64 }
            scopeType: { type: string, nullable: true, maxLength: 64 }
            windowStart: { type: string, nullable: true, maxLength: 64 }
            windowSeconds: { type: integer, nullable: true, format: int64 }
            sendCount: { type: integer, nullable: true, format: int64 }
            verifyCount: { type: integer, nullable: true, format: int64 }
            rejectCount: { type: integer, nullable: true, format: int64 }
            defaultChannel: { type: string, nullable: true, maxLength: 32 }
            codeLength: { type: integer, nullable: true, format: int64 }
            ttlSeconds: { type: integer, nullable: true, format: int64 }
            maxVerifyAttempts: { type: integer, nullable: true, format: int64 }
            startsAt: { type: string, nullable: true, maxLength: 64 }
            createdAt: { type: string, nullable: true, maxLength: 64 }
            failedAt: { type: string, nullable: true, maxLength: 64 }
            updatedAt: { type: string, nullable: true, maxLength: 64 }
      total: { type: integer, format: int64, minimum: 0 }
      page: { type: integer, format: int64, minimum: 1 }
      pageSize: { type: integer, format: int64, minimum: 1, maximum: 200 }
- route: /admin/messaging/providers
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-messaging/src/messagingService.ts
  operation: createMessagingProviderAccount
  operation_id: providerAccounts.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/messaging/provider_accounts
  sdk_domain: messaging
  idempotency_required: true
  summary: Messaging provider account create
  description: Creates a provider account credential reference and declares its SMS or email delivery capability.
  read_sources:
  - integration_provider
  write_tables:
  - integration_provider_account
  - messaging_provider_capability
  - ops_audit_log
  request_schema:
    name: MessagingProviderAccountCreateRequest
    type: object
    additionalProperties: false
    required: [providerCode, accountCode, accountName, channel, credential]
    properties:
      providerCode: { type: string, minLength: 1, maxLength: 64 }
      accountCode: { type: string, minLength: 1, maxLength: 64 }
      accountName: { type: string, minLength: 1, maxLength: 128 }
      channel: { type: string, enum: [sms, email] }
      deliveryPurpose: { type: string, maxLength: 64 }
      baseUrl: { type: string, maxLength: 512 }
      credential:
        type: object
        additionalProperties: false
        required: [secretRef]
        properties:
          secretRef: { type: string, minLength: 1, maxLength: 256 }
          authType: { type: string, maxLength: 64 }
      capabilitySchema:
        type: object
        additionalProperties: true
  response_schema: &messagingMutationResponse
    name: MessagingMutationResponse
    type: object
    additionalProperties: false
    required: [id, status]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      status: { type: string, minLength: 1, maxLength: 32 }
