              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
