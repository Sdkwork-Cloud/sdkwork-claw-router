fragment: operations/app-ai
frontend_operations:
- route: /models
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-models/src/modelService.ts
  operation: fetchModels
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/models
  read_sources:
  - ai_model_vendor
  - ai_model
  - ai_model_capability
  - ai_model_pricing
  query_parameters:
  - name: billing_meter
    schema:
      type: string
  - name: vendor_code
    schema:
      type: string
  - name: vendor_codes
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: modalities
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: capabilities
    schema:
      type: array
      maxItems: 64
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: categories
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: groups
    schema:
      type: array
      maxItems: 32
      items:
        type: string
        minLength: 1
        maxLength: 64
    style: form
    explode: false
  - name: q
    schema:
      type: string
  - name: limit
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 1000
  response_schema:
    name: AppModelCatalogResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 1000
        items:
          name: AppModelCatalogItem
          type: object
          additionalProperties: false
          required:
          - catalogKey
          - model
          - displayName
          - vendorCode
          - regionCode
          - vendor
          - capabilities
          - groups
          - categories
          - description
          - modalities
          - inputModalities
          - outputModalities
          - apiFormat
          - capabilityIntro
          - limitations
          - supportedLanguages
          - useCases
          - trainingDataCutoff
          - contextTokens
          - maxOutputTokens
          - supportsStreaming
          - supportsTools
          - supportsJsonSchema
          - releaseStage
          - shelfState
          - routingState
          - replacementModel
          - providerCodes
          - officialReferencePrices
          - priceAvailability
          properties:
            catalogKey:
              type: string
              minLength: 3
              maxLength: 256
            model:
              type: string
              minLength: 1
              maxLength: 128
            displayName:
              type: string
              minLength: 1
              maxLength: 128
            vendorCode:
              type: string
              minLength: 1
              maxLength: 64
            regionCode:
              type: string
              minLength: 1
              maxLength: 64
            vendor:
              type: string
              minLength: 1
              maxLength: 64
            capabilities:
              type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 64
            groups:
              type: array
              maxItems: 4
              items:
                type: string
                enum:
                - default
                - vip
                - enterprise
                - beta
            categories:
              type: array
              maxItems: 5
              items:
                type: string
                enum:
                - Recommended
                - Open Source
                - Proprietary
                - Free
                - New
            description:
              type: string
              nullable: true
              maxLength: 2048
            modalities:
              type: array
              maxItems: 16
              items:
                type: string
                minLength: 1
                maxLength: 64
            inputModalities:
              type: array
              maxItems: 16
              items:
                type: string
                minLength: 1
                maxLength: 64
            outputModalities:
              type: array
              maxItems: 16
              items:
                type: string
                minLength: 1
                maxLength: 64
            apiFormat:
              type: string
              nullable: true
              maxLength: 128
            capabilityIntro:
              type: string
              nullable: true
              maxLength: 4096
            limitations:
              type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 512
            supportedLanguages:
              type: array
              maxItems: 128
              items:
                type: string
                minLength: 1
                maxLength: 128
            useCases:
              type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 256
            trainingDataCutoff:
              type: string
              nullable: true
              maxLength: 128
            contextTokens:
              type: integer
              format: int64
              nullable: true
              minimum: 0
            maxOutputTokens:
              type: integer
              format: int64
              nullable: true
              minimum: 0
            supportsStreaming:
              type: boolean
            supportsTools:
              type: boolean
            supportsJsonSchema:
              type: boolean
            releaseStage:
              type: integer
              format: int64
              nullable: true
            shelfState:
              type: integer
              format: int64
              nullable: true
            routingState:
              type: integer
              format: int64
              nullable: true
            replacementModel:
              type: string
              nullable: true
              maxLength: 128
            providerCodes:
              type: array
              maxItems: 256
              items:
                type: string
                minLength: 1
                maxLength: 64
            officialReferenceUnitPrice:
              type: string
              nullable: true
              description: Public reference unit price for the requested billing meter when configured. The complete public reference price list is exposed through officialReferencePrices.
            officialReferenceCurrency:
              type: string
              nullable: true
              minLength: 3
              maxLength: 3
              description: Native reference currency for the requested billing meter when configured. The complete public reference price list is exposed through officialReferencePrices.
            officialReferencePrices:
              type: array
              maxItems: 64
              description: Complete public official reference prices keyed by billing meter. Customer, upstream, provider, and channel prices are never exposed here.
              items:
                name: AppModelCatalogReferencePrice
                type: object
                additionalProperties: false
                required:
                - billingMeter
                - unitPrice
                - currency
                properties:
                  billingMeter:
                    type: string
                    minLength: 1
                    maxLength: 64
                  unitPrice:
                    type: string
                    minLength: 1
                    maxLength: 64
                    description: Decimal unit price in the native official reference currency.
                  currency:
                    type: string
                    minLength: 3
                    maxLength: 3
            priceAvailability:
              name: AppModelCatalogPriceAvailability
              type: object
              additionalProperties: false
              required:
              - status
              properties:
                status:
                  type: string
                  enum:
                  - reference
                  - unavailable
                reason:
                  type: string
                  nullable: true
- route: /rankings
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-rankings/src/rankingService.ts
  operation: fetchModelVendors
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/model_vendors
  summary: List ranking vendor filters
  description: Lists service-backed model vendor filter options for the public rankings page.
  read_sources:
  - ai_model_vendor
  - ai_model
  query_parameters: []
  response_schema:
    name: RankingVendorOptionsResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 500
        items:
          name: RankingVendorOption
          type: object
          additionalProperties: false
          required:
          - label
          - code
          - modelCount
          properties:
            label:
              type: string
              minLength: 1
              maxLength: 128
            code:
              type: string
              minLength: 1
              maxLength: 64
            modelCount:
              type: integer
              format: int64
              minimum: 0
- route: /rankings
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-rankings/src/rankingService.ts
  operation: fetchModelRankings
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/model_rankings
  read_sources:
  - ai_model_rank_snapshot
  query_parameters:
  - name: rank_scope
    schema:
      type: string
  - name: vendor_code
    schema:
      type: string
  - name: modality
    schema:
      type: string
  - name: q
    schema:
      type: string
  - name: limit
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  response_schema:
    name: ModelRankingsSnapshot
    required:
    - source
    - items
    - history
    properties:
      source:
        name: ModelRankingsSource
        type: object
        additionalProperties: false
        required:
        - sourceLabel
        - sourceDescription
        - observedAt
        - snapshotDate
        - snapshotPeriod
        - windowStart
        - windowEnd
        - generatedAt
        - refreshIntervalSeconds
        - nextRefreshAt
        - cacheMaxAgeSeconds
        - rankScope
        - sourceTables
        properties:
          sourceLabel:
            type: string
            minLength: 1
            maxLength: 128
          sourceDescription:
            type: string
            minLength: 1
            maxLength: 512
          observedAt:
            type: string
            maxLength: 64
          snapshotDate:
            type: string
            minLength: 1
            maxLength: 64
          snapshotPeriod:
            type: string
            minLength: 1
            maxLength: 32
          windowStart:
            type: string
            maxLength: 64
          windowEnd:
            type: string
            maxLength: 64
          generatedAt:
            type: string
            maxLength: 64
          refreshIntervalSeconds:
            type: integer
            format: int64
            minimum: 1
          nextRefreshAt:
            type: string
            maxLength: 64
          cacheMaxAgeSeconds:
            type: integer
            format: int64
            minimum: 1
          rankScope:
            type: string
            minLength: 1
            maxLength: 64
          sourceTables:
            type: array
            maxItems: 8
            items:
              type: string
              minLength: 1
              maxLength: 128
      items:
        type: array
        maxItems: 200
        items:
          name: ModelRankingItem
          type: object
          additionalProperties: false
          required:
          - id
          - rank
          - prevRank
          - name
          - vendor
          - vendorCode
          - modality
          - baseVolume
          - costIndicator
          - latency
          - isNew
          - color
          - strengths
          - requests
          - tokens
          - cost
          - currency
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 256
              description: Stable model catalog identity; must match ranking history catalogKey and must not include snapshot date prefixes.
            rank:
              type: integer
              format: int64
              minimum: 1
            prevRank:
              type: integer
              format: int64
              minimum: 0
            name:
              type: string
              minLength: 1
              maxLength: 128
            vendor:
              type: string
              minLength: 1
              maxLength: 128
            vendorCode:
              type: string
              minLength: 1
              maxLength: 64
            modality:
              type: string
              enum:
              - LLM
              - Image
              - Audio
              - Video
              - Music
              - Embedding
              - Rerank
              - Unknown
            baseVolume:
              type: integer
              format: int64
              minimum: 0
            costIndicator:
              type: integer
              format: int64
              minimum: 1
              maximum: 5
            latency:
              type: integer
              format: int64
              minimum: 0
            contextSize:
              type: string
              nullable: true
              maxLength: 64
            isNew:
              type: boolean
            color:
              type: string
              minLength: 1
              maxLength: 64
            winRate:
              type: number
              nullable: true
              minimum: 0
              maximum: 100
            pricing:
              type: string
              nullable: true
              maxLength: 128
            license:
              type: string
              nullable: true
              enum:
              - Open Source
              - Proprietary
            strengths:
              type: array
              maxItems: 16
              items:
                type: string
                minLength: 1
                maxLength: 64
            requests:
              type: integer
              format: int64
              minimum: 0
            tokens:
              type: integer
              format: int64
              minimum: 0
            cost:
              type: number
              minimum: 0
            currency:
              type: string
              minLength: 1
              maxLength: 16
            trendScore:
              type: number
              nullable: true
      history:
        type: array
        maxItems: 60
        items:
          name: ModelRankingHistoryPoint
          type: object
          additionalProperties: false
          required:
          - date
          - index
          - entries
          properties:
            date:
              type: string
              minLength: 1
              maxLength: 64
            index:
              type: integer
              format: int64
              minimum: 0
            entries:
              type: array
              maxItems: 500
              items:
                name: ModelRankingHistoryEntry
                type: object
                additionalProperties: false
                required:
                - model
                - catalogKey
                - rank
                - volume
                - color
                properties:
                  model:
                    type: string
                    minLength: 1
                    maxLength: 128
                  catalogKey:
                    type: string
                    minLength: 1
                    maxLength: 256
                  rank:
                    type: integer
                    format: int64
                    minimum: 0
                  volume:
                    type: integer
                    format: int64
                    minimum: 0
                  color:
                    type: string
                    minLength: 1
                    maxLength: 64
- route: /console/dashboard
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-dashboard/src/dashboardService.ts
  operation: fetchDashboardOverview
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/dashboard/overview
  read_sources:
  - ai_usage_fact
  - ai_request_trace
  - ai_model_rank_snapshot
  - content_announcement
  - ops_metric_snapshot
  query_parameters:
  - name: time_range
    schema:
      type: string
      enum:
      - hourly
      - daily
      - monthly
      - yearly
  - name: start_time
    schema:
      type: string
      maxLength: 64
  - name: end_time
    schema:
      type: string
      maxLength: 64
  response_schema:
    name: DashboardOverviewResponse
    required:
    - summary
    - requestSparkline
    - multimodalSparkline
    - performanceSparkline
    - chartData
    - topModels
    - announcements
    - warnings
    properties:
      summary:
        type: object
        additionalProperties: false
        name: DashboardOverviewSummary
        required:
        - availableCredits
        - usedCredits
        - requestCount
        - totalUsedCredits
        - totalRequestCount
        - errorCount
        - imageRequests
        - videoRequests
        - audioRequests
        - musicRequests
        - rpm
        - tpm
        properties:
          availableCredits:
            type: number
          usedCredits:
            type: number
          requestCount:
            type: integer
            format: int64
          totalUsedCredits:
            type: number
          totalRequestCount:
            type: integer
            format: int64
          errorCount:
            type: integer
            format: int64
          imageRequests:
            type: integer
            format: int64
          videoRequests:
            type: integer
            format: int64
          audioRequests:
            type: integer
            format: int64
          musicRequests:
            type: integer
            format: int64
          rpm:
            type: number
          tpm:
            type: number
      requestSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required:
          - value
          properties:
            value:
              type: number
      multimodalSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required:
          - value
          properties:
            value:
              type: number
      performanceSparkline:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardSparklinePoint
          required:
          - value
          properties:
            value:
              type: number
      chartData:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardChartPoint
          required:
          - time
          - llm (Text)
          - image (Midjourney/DALL-E)
          - video (Runway/Sora)
          - audio (Whisper)
          - music (Suno)
          properties:
            time:
              type: string
            llm (Text):
              type: number
            image (Midjourney/DALL-E):
              type: number
            video (Runway/Sora):
              type: number
            audio (Whisper):
              type: number
            music (Suno):
              type: number
      topModels:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardTopModel
          required:
          - rank
          - name
          - supplier
          - modality
          - requests
          - cost
          - trend
          - isUp
          properties:
            rank:
              type: integer
              format: int64
            name:
              type: string
            supplier:
              type: string
            modality:
              type: string
              enum:
              - text
              - image
              - video
              - audio
              - music
              - unknown
            requests:
              type: integer
              format: int64
            cost:
              type: number
            trend:
              type: string
            isUp:
              type: boolean
      announcements:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardAnnouncement
          required:
          - id
          - text
          - time
          - type
          properties:
            id:
              type: integer
              format: int64
            text:
              type: string
            time:
              type: string
            type:
              type: string
              enum:
              - success
              - info
              - warning
              - error
              - unknown
      configurationDomains:
        type: array
        items:
          type: object
          additionalProperties: false
          name: DashboardConfigurationDomain
          required:
          - id
          - name
          - domain
          - remark
          properties:
            id:
              type: string
            name:
              type: string
            domain:
              type: string
            remark:
              type: string
      warnings:
        type: array
        items:
          type: string
- route: /console/gateway
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-gateway/src/gatewayService.ts
  operation: fetchTraces
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ai/gateway/traces
  read_sources:
  - ai_request_trace
  - ops_gateway_instance
  query_parameters: []
  response_schema:
    name: GatewayTracesResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          name: GatewayTrace
          required:
          - id
          - time
          - ip
          - endpoint
          - method
          - status
          - duration
          - channel
          properties:
            id:
              type: string
            time:
              type: string
            ip:
              type: string
              description: Masked client IP address.
            endpoint:
              type: string
            method:
              type: string
              enum:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
              - HEAD
            status:
              type: integer
              format: int64
            duration:
              type: string
              description: HTTP latency display value, for example 128ms.
            channel:
              type: string
