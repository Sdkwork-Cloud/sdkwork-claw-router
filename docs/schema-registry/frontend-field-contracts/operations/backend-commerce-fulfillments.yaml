fragment: operations/backend-commerce-fulfillments
frontend_operations:
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendFulfillmentsList
  operation_id: fulfillments.list
  kind: read
  api_surface: backend
  openapi_exposed: true
  api_method: GET
  api_path: /backend/v3/api/fulfillments
  sdk_domain: commerce
  summary: Fulfillments List
  description: Standard appbase commerce API for fulfillments.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_fulfillment_order
  - commerce_fulfillment_item
  - commerce_order
  - commerce_order_item
  - commerce_shipment
  - commerce_digital_delivery
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &commerceStandardCollectionResponse
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendFulfillmentCreate
  operation_id: fulfillments.create
  kind: create
  api_surface: backend
  openapi_exposed: false
  api_method: POST
  api_path: /backend/v3/api/fulfillments
  sdk_domain: commerce
  summary: Fulfillments Create
  description: Creates a fulfillment order through the Commerce backend management API.
  read_sources:
  - commerce_order
  - commerce_order_item
  - commerce_product_sku
  idempotency_required: true
  write_tables:
  - commerce_fulfillment_order
  - commerce_fulfillment_item
  - commerce_order_event
  - ops_audit_log
  request_schema: &commerceOperationCommand
    name: CommerceOperationCommand
    type: object
    additionalProperties: true
    properties:
      orderId:
        type: string
        nullable: true
        maxLength: 128
      fulfillmentType:
        type: string
        nullable: true
        maxLength: 64
      carrierCode:
        type: string
        nullable: true
        maxLength: 64
      trackingNo:
        type: string
        nullable: true
        maxLength: 128
      status:
        type: string
        nullable: true
        maxLength: 64
      source:
        type: string
        nullable: true
        maxLength: 64
      note:
        type: string
        nullable: true
        maxLength: 1024
  response_schema: &commerceOperationResponse
    name: CommerceOperationResponse
    type: object
    additionalProperties: true
    properties:
      id:
        type: string
        nullable: true
        maxLength: 128
      status:
        type: string
        nullable: true
        maxLength: 64
      success:
        type: boolean
        nullable: true
      message:
        type: string
        nullable: true
        maxLength: 1024
