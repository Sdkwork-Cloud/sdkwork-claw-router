fragment: operations/backend-commerce-refunds
frontend_operations:
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendRefundsList
  operation_id: refunds.list
  kind: read
  api_surface: backend
  openapi_exposed: true
  api_method: GET
  api_path: /backend/v3/api/refunds
  sdk_domain: commerce
  summary: Refunds List
  description: Standard appbase commerce API for refunds.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_refund
  - commerce_refund_item
  - commerce_refund_attempt
  - commerce_order
  - commerce_order_item
  - commerce_payment_attempt
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  - name: cursor
    schema:
      type: string
      maxLength: 256
  - name: sort
    schema:
      type: string
      maxLength: 128
  - name: q
    schema:
      type: string
      maxLength: 256
  response_schema: &commerceStandardCollectionResponse
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendRefundsRetrieve
  operation_id: refunds.retrieve
  kind: read
  api_surface: backend
  openapi_exposed: true
  api_method: GET
  api_path: /backend/v3/api/refunds/{refundId}
  sdk_domain: commerce
  summary: Refunds Retrieve
  description: Standard appbase commerce API for refunds.retrieve; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_refund
  - commerce_refund_item
  - commerce_refund_attempt
  - commerce_order
  - commerce_order_item
  - commerce_payment_attempt
  query_parameters: []
  response_schema: &commerceStandardResourceResponse
    name: CommerceStandardResourceResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item:
        type: object
        additionalProperties: false
        required:
        - id
        properties:
          id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            type: string
            nullable: true
            maxLength: 64
          createdAt:
            type: string
            nullable: true
            maxLength: 64
          updatedAt:
            type: string
            nullable: true
            maxLength: 64
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendRefundApprovalCreate
  operation_id: refunds.approvals.create
  kind: action
  api_surface: backend
  openapi_exposed: false
  api_method: POST
  api_path: /backend/v3/api/refunds/{refundId}/approvals
  sdk_domain: commerce
  summary: Refunds Approvals Create
  description: Approves or rejects a refund request through the Commerce backend management API.
  read_sources:
  - commerce_refund
  - commerce_refund_item
  - commerce_order
  - commerce_payment_attempt
  idempotency_required: true
  write_tables:
  - commerce_refund
  - commerce_refund_attempt
  - commerce_order_event
  - ops_audit_log
  request_schema: &commerceOperationCommand
    name: CommerceOperationCommand
    type: object
    additionalProperties: true
    properties:
      action:
        type: string
        nullable: true
        enum:
        - approve
        - reject
      reason:
        type: string
        nullable: true
        maxLength: 256
      source:
        type: string
        nullable: true
        maxLength: 64
      note:
        type: string
        nullable: true
        maxLength: 1024
  response_schema: &commerceOperationResponse
    name: CommerceOperationResponse
    type: object
    additionalProperties: true
    properties:
      id:
        type: string
        nullable: true
        maxLength: 128
      status:
        type: string
        nullable: true
        maxLength: 64
      success:
        type: boolean
        nullable: true
      message:
        type: string
        nullable: true
        maxLength: 1024
- route: /admin/orders
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-orders/src/ordersService.ts
  operation: backendRefundAttemptCreate
  operation_id: refunds.attempts.create
  kind: create
  api_surface: backend
  openapi_exposed: false
  api_method: POST
  api_path: /backend/v3/api/refunds/{refundId}/attempts
  sdk_domain: commerce
  summary: Refunds Attempts Create
  description: Starts a provider refund attempt for an approved refund request.
  read_sources:
  - commerce_refund
  - commerce_refund_item
  - commerce_order
  - commerce_payment_attempt
  idempotency_required: true
  write_tables:
  - commerce_refund_attempt
  - commerce_refund
  - commerce_order_event
  - ops_audit_log
  request_schema: *commerceOperationCommand
  response_schema: *commerceOperationResponse
