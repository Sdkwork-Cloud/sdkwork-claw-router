fragment: operations/app-comment
frontend_operations:
- route: /forum/:id
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-forum/src/forumService.ts
  operation: fetchForumComments
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/content/comments
  sdk_domain: comment
  read_sources:
  - plus_comments
  - plus_content_vote
  query_parameters:
  - name: content_type
    required: true
    schema:
      type: string
      enum:
      - feeds
      - comments
      - course
      - courses
      - FEEDS
      - COMMENTS
      - COURSE
      - COURSES
  - name: content_id
    required: true
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 100
  response_schema: &id002
    name: ForumCommentPage
    type: object
    additionalProperties: false
    required:
    - items
    - content
    - totalElements
    - page
    - size
    properties:
      items:
        type: array
        maxItems: 100
        items: &id001
          name: ForumCommentItem
          type: object
          additionalProperties: false
          required:
          - commentId
          - content
          - contentType
          - contentId
          - userId
          - status
          - likes
          - replyCount
          - isTop
          - author
          - createdAt
          properties:
            commentId:
              type: string
              minLength: 1
              maxLength: 128
            content:
              type: string
              minLength: 1
              maxLength: 20000
            contentType:
              type: string
              enum:
              - FEEDS
              - COMMENTS
              - COURSE
            contentId:
              type: integer
              format: int64
              minimum: 1
            userId:
              type: integer
              format: int64
              minimum: 0
            status:
              type: string
              enum:
              - PUBLISHED
              - PENDING
              - DELETED
            likes:
              type: integer
              format: int64
              minimum: 0
            replyCount:
              type: integer
              format: int64
              minimum: 0
            isTop:
              type: boolean
            parentId:
              type: integer
              format: int64
              minimum: 1
            author: &id003
              name: ForumAuthor
              type: object
              additionalProperties: false
              required:
              - id
              - name
              - isFollowing
              properties:
                id:
                  type: integer
                  format: int64
                  minimum: 0
                name:
                  type: string
                  minLength: 1
                  maxLength: 128
                avatar:
                  type: string
                  maxLength: 2048
                bio:
                  type: string
                  maxLength: 512
                isFollowing:
                  type: boolean
            createdAt:
              type: string
              maxLength: 64
      content:
        type: array
        maxItems: 100
        items: *id001
      totalElements:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
