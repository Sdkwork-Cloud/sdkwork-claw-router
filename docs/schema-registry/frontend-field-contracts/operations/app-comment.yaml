  query_parameters: []
  response_schema:
    name: ForumCommentDetail
    type: object
    additionalProperties: false
    required:
    - commentId
    - content
    - contentType
    - contentId
    - userId
    - status
    - likes
    - replyCount
    - isTop
    - author
    - ipAddress
    - deviceInfo
    - createdAt
    - updatedAt
    - replies
    properties:
      commentId:
        type: string
        minLength: 1
        maxLength: 128
      content:
        type: string
        minLength: 1
        maxLength: 20000
      contentType:
        type: string
        enum:
        - FEEDS
        - COMMENTS
        - COURSE
      contentId:
        type: integer
        format: int64
        minimum: 1
      userId:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - PUBLISHED
        - PENDING
        - DELETED
      likes:
        type: integer
        format: int64
        minimum: 0
      replyCount:
        type: integer
        format: int64
        minimum: 0
      isTop:
        type: boolean
      parentId:
        type: integer
        format: int64
        minimum: 1
      author: *id003
      ipAddress:
        type: string
        maxLength: 128
      deviceInfo:
        type: string
        maxLength: 512
      createdAt:
        type: string
        maxLength: 64
      updatedAt:
        type: string
        maxLength: 64
      replies:
        type: array
        maxItems: 100
        items: *id001
