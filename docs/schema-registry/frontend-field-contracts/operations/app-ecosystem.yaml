fragment: operations/app-ecosystem
frontend_operations:
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: getSkills
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ecosystem/skills
  read_sources:
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_action
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters:
  - name: q
    schema:
      type: string
      maxLength: 128
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 64
  - name: start_time
    schema:
      type: string
      maxLength: 64
  - name: end_time
    schema:
      type: string
      maxLength: 64
  response_schema:
    name: SkillsCatalogResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items: &id003
          name: SkillCatalogItem
          type: object
          additionalProperties: false
          required: &id001
          - id
          - name
          - developer
          - description
          - category
          - image
          - rating
          - downloads
          - features
          - lastUpdated
          - clawhubImage
          - version
          - size
          - license
          - frameworks
          - screenshots
          properties: &id002
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 128
            developer:
              type: string
              minLength: 1
              maxLength: 128
            description:
              type: string
              maxLength: 4096
            category:
              type: string
              minLength: 1
              maxLength: 128
            image:
              type: string
              maxLength: 2048
            rating:
              type: number
              minimum: 0
              maximum: 5
            downloads:
              type: string
              maxLength: 64
            features:
              type: array
              maxItems: 64
              items:
                type: string
                minLength: 1
                maxLength: 128
            lastUpdated:
              type: string
              maxLength: 64
            clawhubImage:
              type: string
              maxLength: 512
            version:
              type: string
              maxLength: 64
            size:
              type: string
              maxLength: 64
            license:
              type: string
              maxLength: 128
            frameworks:
              type: array
              maxItems: 32
              items:
                type: string
                minLength: 1
                maxLength: 64
            screenshots:
              type: array
              maxItems: 20
              items:
                type: string
                maxLength: 2048
            packages:
              type: array
              maxItems: 16
              items:
                name: SkillPackageItem
                type: object
                additionalProperties: false
                required:
                - id
                - version
                - artifactRef
                - artifactSizeBytes
                - frameworks
                - licenseName
                - publishedAt
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  version:
                    type: string
                    maxLength: 64
                  artifactRef:
                    type: string
                    maxLength: 512
                  artifactSizeBytes:
                    type: integer
                    format: int64
                    minimum: 0
                  frameworks:
                    type: array
                    maxItems: 32
                    items:
                      type: string
                      minLength: 1
                      maxLength: 64
                  licenseName:
                    type: string
                    maxLength: 128
                  publishedAt:
                    type: string
                    maxLength: 64
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: getSkillById
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ecosystem/skills/{skillId}
  read_sources:
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_action
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters: []
  response_schema:
    name: SkillDetailResponse
    type: object
    additionalProperties: false
    required: *id001
    properties: *id002
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: getCategories
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ecosystem/skills/categories
  read_sources:
  - plus_category
  query_parameters: []
  response_schema:
    name: SkillCategoriesResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 100
        items:
          type: string
          minLength: 1
          maxLength: 128
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: getMySkills
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/ecosystem/users/current/skills
  read_sources:
  - plus_user_agent_skill
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_asset
  - studio_catalog_artifact
  query_parameters: []
  response_schema:
    name: AppInstalledSkillsResponse
    required:
    - items
    properties:
      items:
        type: array
        maxItems: 200
        items: &id004
          name: AppInstalledSkillItem
          type: object
          additionalProperties: false
          required:
          - id
          - skillId
          - enabled
          - config
          - installedAt
          - lastEnabledAt
          - skill
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            skillId:
              type: string
              minLength: 1
              maxLength: 128
            enabled:
              type: boolean
            config:
              type: object
              additionalProperties: true
              description: User-scoped runtime configuration for the installed agent skill.
            installedAt:
              type: string
              maxLength: 64
            lastEnabledAt:
              type: string
              maxLength: 64
            skill: *id003
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: enableSkill
  kind: action
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/ecosystem/skills/{skillId}/enable
  read_sources:
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_asset
  - studio_catalog_artifact
  write_tables:
  - plus_user_agent_skill
  request_schema: &id005
    name: AppSkillConfigRequest
    type: object
    additionalProperties: true
    description: Skill runtime configuration request. config.portal is reserved portal metadata and must not be provided by clients.
    not:
      required:
      - portal
    properties:
      config:
        type: object
        additionalProperties: true
        not:
          required:
          - portal
        description: Optional config wrapper. When omitted, the whole request object is treated as skill config. config.portal is reserved portal metadata and must not be provided by clients.
  response_schema:
    name: AppInstalledSkillResponse
    required:
    - item
    properties:
      item: *id004
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: disableSkill
  kind: action
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/ecosystem/skills/{skillId}/disable
  read_sources:
  - plus_user_agent_skill
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_asset
  - studio_catalog_artifact
  write_tables:
  - plus_user_agent_skill
  request_body_required: false
  response_schema:
    name: AppInstalledSkillResponse
    required:
    - item
    properties:
      item: *id004
- route: /skills-hub
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-skills-hub/src/services/skillService.ts
  operation: updateSkillConfig
  kind: update
  api_surface: app
  api_method: PUT
  api_path: /app/v3/api/ecosystem/skills/{skillId}/config
  read_sources:
  - plus_user_agent_skill
  - plus_agent_skill
  - plus_agent_skill_package
  - plus_category
  - studio_catalog_asset
  - studio_catalog_artifact
  write_tables:
  - plus_user_agent_skill
  request_schema: *id005
  response_schema:
    name: AppInstalledSkillResponse
    required:
    - item
    properties:
      item: *id004
