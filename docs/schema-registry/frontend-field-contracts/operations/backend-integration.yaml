            providerCode:
              type: string
              minLength: 1
              maxLength: 64
            accountCode:
              type: string
              minLength: 1
              maxLength: 64
            name:
              type: string
              minLength: 1
              maxLength: 128
            authType:
              type: string
              maxLength: 64
            secretRef:
              type: string
              minLength: 1
              maxLength: 256
