- route: /admin/channel
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-channel/src/channelService.ts
  operation: addProviderSecret
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/integration/provider_secrets
  read_sources:
  - integration_provider_account
  write_tables:
  - integration_provider_account
  - ops_config_snapshot
  - ops_audit_log
  request_id_header: true
  request_schema:
    name: AdminProviderSecretCreateRequest
    required:
    - providerCode
    - name
    - secretRef
    properties:
      providerCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
      name:
        type: string
        minLength: 1
        maxLength: 128
      authType:
        type: string
        maxLength: 64
      secretRef:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^(vault|secret)://[^\\s]+$
        description: Vault/KMS secret reference. Plaintext provider secrets are forbidden.
      status:
        type: string
        enum:
        - active
        - disabled
  response_schema:
    name: AdminProviderSecretMutationResponse
    required:
    - item
    properties:
      item:
