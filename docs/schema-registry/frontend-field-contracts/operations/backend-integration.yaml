- route: /admin/channel
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-channel/src/channelService.ts
  operation: testChannel
  kind: action
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/integration/channels/{channelId}/verify
  read_sources:
  - integration_channel
  - integration_channel_model
  - integration_provider_account
  write_tables:
  - integration_channel
  - integration_provider_account
  - integration_provider_health_snapshot
  - ops_config_snapshot
  - ops_audit_log
  request_id_header: true
  request_body_required: false
  response_schema:
    name: AdminChannelTestResponse
    required:
