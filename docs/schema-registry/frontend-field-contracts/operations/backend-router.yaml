  query_parameters: []
  response_schema:
    name: AdminAccessGroupsResponse
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: AdminAccessGroupItem
          type: object
          additionalProperties: false
          required: &id001
          - id
          - name
          - platform
          - billingType
          - rateMultiplier
          - type
          - accountCount
          - capacity
          - usage
          - status
          properties: &id002
            id:
              type: string
              minLength: 1
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 128
            platform:
              type: string
              minLength: 1
              maxLength: 64
            billingType:
              type: string
              enum:
              - standard
              - subscription
            rateMultiplier:
              type: number
              minimum: 0.01
              maximum: 100
            type:
              type: string
              enum:
              - public
              - dedicated
            accountCount:
              name: AdminCountPair
              type: object
              additionalProperties: false
              required:
              - available
              - total
              properties:
                available:
                  type: number
                  minimum: 0
                total:
                  type: number
                  minimum: 0
            capacity:
              name: AdminCapacityPair
              type: object
              additionalProperties: false
              required:
              - used
              - total
              properties:
                used:
                  type: number
                  minimum: 0
                total:
                  type: number
                  minimum: 0
            usage:
              name: AdminUsagePair
              type: object
              additionalProperties: false
              required:
              - today
              - total
              properties:
                today:
                  type: number
                  minimum: 0
                total:
                  type: number
                  minimum: 0
            status:
              type: string
              enum:
              - active
              - disabled
- route: /admin/group
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-group/src/groupService.ts
  operation: addGroup
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/router/access_groups
  read_sources:
  - ai_channel_group
  - ai_pricing_plan
  write_tables:
  - ai_channel_group
  - ai_pricing_plan_binding
  - ops_audit_log
  request_schema:
    name: AdminAccessGroupCreateRequest
    required:
    - name
    properties:
      name:
        type: string
        minLength: 1
        maxLength: 128
        description: Access group display name.
      platform:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[A-Za-z0-9_-]+$
        description: Normalized upstream platform code.
      billingType:
        type: string
        enum:
        - standard
        - subscription
        description: Billing contract attached to the access group.
      rateMultiplier:
        type: number
        minimum: 0.01
        maximum: 100
        description: Customer rate multiplier rounded to six decimals.
      type:
        type: string
        enum:
        - public
        - dedicated
        description: Access group allocation mode.
      capacity:
        type: object
        additionalProperties: false
        properties:
          total:
            type: number
            minimum: 0
            maximum: 1000000000
      status:
        type: string
        enum:
        - active
        - disabled
  response_schema:
    name: AdminAccessGroupMutationResponse
    required:
    - item
    properties:
      item:
        name: AdminAccessGroupItem
        type: object
        additionalProperties: false
        required: *id001
        properties: *id002
        description: Persisted access group snapshot returned by the backend.
