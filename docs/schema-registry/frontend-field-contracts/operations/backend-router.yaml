  api_path: /backend/v3/api/router/rate_limits/ip
  read_sources:
  - iam_gateway_risk_rule
  write_tables:
  - iam_gateway_risk_rule
  - ops_audit_log
  request_schema:
    name: AdminIpLimitCreateRequest
    required:
    - ruleName
    - targetIp
    - rps
    - rpm
    - blockDuration
    properties:
      ruleName:
        type: string
        minLength: 1
        maxLength: 128
        description: Human-readable IP rate limit rule name.
      targetIp:
        type: string
        minLength: 1
        maxLength: 128
        description: IP address, CIDR block, or gateway-recognized IP target expression.
      rps:
        type: integer
        minimum: 1
        maximum: 1000000
        description: Maximum requests per second for the target.
      rpm:
        type: integer
        minimum: 1
        maximum: 60000000
        description: Maximum requests per minute for the target.
      blockDuration:
        type: string
        minLength: 1
        maxLength: 64
        description: Gateway block duration label or duration expression.
      status:
        type: string
        enum:
        - active
        - inactive
  response_schema:
    name: AdminRateLimitMutationResponse
