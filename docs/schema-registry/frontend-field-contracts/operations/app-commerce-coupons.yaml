fragment: operations/app-commerce-coupons
frontend_operations:
- route: /console/wallet
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-wallet/src/walletService.ts
  operation: appCouponsList
  operation_id: coupons.list
  kind: read
  api_surface: app
  api_method: GET
  api_path: /app/v3/api/coupons
  sdk_domain: commerce
  summary: Coupons List
  description: Standard appbase commerce API for coupons.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_coupon_template
  - commerce_coupon
  - commerce_coupon_redemption
  - commerce_order
  - commerce_order_item
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema:
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /console/wallet
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-console-wallet/src/walletService.ts
  operation: appCouponsClaimsCreate
  operation_id: coupons.claims.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/coupons/claims
  sdk_domain: commerce
  summary: Coupons Claims Create
  description: Standard appbase commerce API for coupons.claims.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_coupon_template
  - commerce_coupon
  - commerce_coupon_redemption
  - commerce_order
  - commerce_order_item
  request_id_header: true
  idempotency_required: true
  write_tables:
  - commerce_coupon
  - commerce_coupon_redemption
  - ops_audit_log
  request_schema: &id001
    name: CommerceStandardCommandRequest
    type: object
    additionalProperties: false
    properties:
      clientRequestNo:
        type: string
        minLength: 1
        maxLength: 128
      note:
        type: string
        maxLength: 512
      metadata:
        type: object
        additionalProperties: true
  response_schema: &id002
    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
