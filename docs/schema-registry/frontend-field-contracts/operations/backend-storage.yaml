fragment: operations/backend-storage
frontend_operations:
- route: /admin/storage/providers
  source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-admin-file-platform/src/storageService.ts
  operation: fetchStorageProviders
  operation_id: oss.providers.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/storage/providers
  sdk_domain: oss
  summary: List storage providers
  description: Lists S3-compatible object storage provider configurations, capability flags, credential references, and health status for admin operations.
  read_sources:
  - object_provider
  - ops_audit_log
  query_parameters: []
  response_schema:
    name: StorageProviderListResponse
    type: object
    additionalProperties: false
    required: [items, requestId]
    properties:
      items:
        type: array
        maxItems: 200
        items: &storageProviderConfig
          name: StorageProviderConfig
          type: object
          additionalProperties: false
          required: [id, providerCode, providerType, credentialRef, status, health]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            providerCode: { type: string, minLength: 1, maxLength: 96, pattern: '^[a-z0-9][a-z0-9._:-]{0,95}$' }
            providerType: { type: string, enum: [aws_s3, cloudflare_r2, cos_s3, local_dev_s3, minio, oss_s3, s3_compatible] }
            region: { type: string, maxLength: 64 }
            endpointUrl: { type: string, maxLength: 512 }
            endpoint: { type: string, maxLength: 512 }
            credentialRef: { type: string, minLength: 1, maxLength: 256 }
            pathStyleEnabled: { type: boolean }
            supportsMultipart: { type: boolean }
            supportsLifecycle: { type: boolean }
            supportsObjectLock: { type: boolean }
            multipart: { type: boolean }
            lifecycle: { type: boolean }
            objectLock: { type: boolean }
            status: { type: string, enum: [active, archived, disabled] }
            health: { type: string, maxLength: 64 }
            healthStatus: { type: string, maxLength: 64 }
            lastHealthCheckAt: { type: string, maxLength: 64 }
            createdAt: { type: string, maxLength: 64 }
            updatedAt: { type: string, maxLength: 64 }
      requestId: { type: string, minLength: 1, maxLength: 128 }
