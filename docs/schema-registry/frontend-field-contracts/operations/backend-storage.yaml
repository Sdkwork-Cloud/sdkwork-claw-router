  description: Lists logical object buckets, provider topology, encryption posture, versioning, object lock, and public-access controls.
  read_sources:
  - object_provider
  - object_bucket
  - ops_audit_log
  query_parameters: &storageCursorQuery
  - name: cursor
    schema: { type: string, maxLength: 256 }
  - name: limit
    schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
  - name: status
    schema: { type: string, enum: [active, archived, disabled] }
  response_schema:
    name: StorageBucketListResponse
    type: object
    additionalProperties: false
    required: [items, requestId]
    properties:
      items:
        type: array
        maxItems: 200
        items: &storageBucketConfig
          name: StorageBucketConfig
          type: object
          additionalProperties: false
          required: [id, bucketName, logicalScope, providerId, providerCode, status]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            bucketName: { type: string, minLength: 1, maxLength: 128 }
            bucketRegion: { type: string, maxLength: 64 }
            logicalScope: { type: string, enum: [migration_import, system_archive, system_quarantine, system_temp, system_variant, tenant_private, tenant_public_asset] }
            providerId: { type: string, minLength: 1, maxLength: 128 }
            providerCode: { type: string, minLength: 1, maxLength: 96 }
            objectKeyPrefix: { type: string, maxLength: 512 }
            defaultStorageClass: { type: string, enum: [STANDARD, INTELLIGENT_TIERING, STANDARD_IA, ONEZONE_IA, GLACIER_IR, GLACIER, DEEP_ARCHIVE] }
            storageClass: { type: string, maxLength: 64 }
            defaultEncryptionMode: { type: string, enum: [none, sse_kms, sse_s3] }
            encryption: { type: string, maxLength: 64 }
            kmsKeyRef: { type: string, maxLength: 256 }
            versioningEnabled: { type: boolean }
            objectLockEnabled: { type: boolean }
            lifecycleEnabled: { type: boolean }
            publicAccessBlocked: { type: boolean }
            blockPublicAccess: { type: boolean }
            status: { type: string, enum: [active, archived, disabled] }
            createdAt: { type: string, maxLength: 64 }
            updatedAt: { type: string, maxLength: 64 }
      nextCursor: { type: string, maxLength: 256 }
      requestId: { type: string, minLength: 1, maxLength: 128 }
