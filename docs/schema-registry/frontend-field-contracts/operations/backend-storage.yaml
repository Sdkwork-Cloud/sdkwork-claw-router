  - ops_audit_log
  request_schema:
    name: CreateStorageProviderRequest
    type: object
    additionalProperties: false
    required: [providerCode, providerType, credentialRef]
    properties:
      providerCode: { type: string, minLength: 1, maxLength: 96, pattern: '^[a-z0-9][a-z0-9._:-]{0,95}$' }
      providerType: { type: string, enum: [aws_s3, cloudflare_r2, cos_s3, local_dev_s3, minio, oss_s3, s3_compatible] }
      endpointUrl: { type: string, maxLength: 512 }
      endpoint: { type: string, maxLength: 512 }
      region: { type: string, maxLength: 64 }
      credentialRef: { type: string, minLength: 1, maxLength: 256 }
      pathStyleEnabled: { type: boolean }
      supportsMultipart: { type: boolean }
      supportsLifecycle: { type: boolean }
      supportsObjectLock: { type: boolean }
      multipart: { type: boolean }
      lifecycle: { type: boolean }
      objectLock: { type: boolean }
  response_schema: &storageProviderMutationResponse
    name: StorageProviderMutationResponse
    type: object
    additionalProperties: false
    required: [provider, requestId]
    properties:
      provider: *storageProviderConfig
      requestId: { type: string, minLength: 1, maxLength: 128 }
