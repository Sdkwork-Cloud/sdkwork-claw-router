  operation: backendCouponsTemplatesList
  operation_id: coupons.templates.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/coupons/templates
  sdk_domain: commerce
  summary: Coupons Templates List
  description: Standard appbase commerce API for coupons.templates.list; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_coupon_template
  - commerce_coupon_issue_batch
  - commerce_coupon
  - commerce_coupon_redemption
  - commerce_order
  - commerce_order_item
  query_parameters:
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: status
    schema:
      type: string
      maxLength: 32
  response_schema: &id001
    name: CommerceStandardCollectionResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items:
          type: object
          additionalProperties: false
          required:
          - id
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            status:
              type: string
              nullable: true
              maxLength: 64
            createdAt:
              type: string
              nullable: true
              maxLength: 64
            updatedAt:
              type: string
              nullable: true
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
