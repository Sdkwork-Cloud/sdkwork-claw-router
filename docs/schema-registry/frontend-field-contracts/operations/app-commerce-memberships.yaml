  operation: appMembershipsPurchasesCreate
  operation_id: memberships.purchases.create
  kind: create
  api_surface: app
  api_method: POST
  api_path: /app/v3/api/memberships/purchases
  sdk_domain: commerce
  summary: Memberships Purchases Create
  description: Standard appbase commerce API for memberships.purchases.create; no legacy billing compatibility route is exposed.
  read_sources:
  - commerce_membership_plan
  - commerce_membership_package
  - commerce_membership_package_group
  - commerce_membership
  - commerce_membership_entitlement
  - commerce_membership_entitlement_usage
  - commerce_product_spu
  - commerce_product_sku
  - commerce_order
  - commerce_payment_attempt
  idempotency_required: true
  write_tables:
  - commerce_order
  - commerce_order_item
  - commerce_payment_intent
  - commerce_membership
  - commerce_membership_entitlement
  - ops_audit_log
  request_schema: &id003
    name: CommerceMembershipPurchaseRequest
    type: object
    additionalProperties: false
    required:
    - packageId
    properties:
      packageId:
        type: integer
        format: int64
        minimum: 1
      paymentMethod:
        type: string
        maxLength: 50
        pattern: ^[\x21-\x7E]+$
      couponId:
        type: string
        nullable: true
        maxLength: 128
  response_schema: &id004
    name: CommerceOperationResponse
    type: object
    additionalProperties: false
    required:
    - success
    - requestNo
    - status
    properties:
      success:
        type: boolean
      requestNo:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        minLength: 1
        maxLength: 64
      paymentId:
        type: string
        nullable: true
        minLength: 1
        maxLength: 128
      qrCodePayload:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
      qrCodeImageUrl:
        type: string
        nullable: true
        minLength: 1
        maxLength: 2048
