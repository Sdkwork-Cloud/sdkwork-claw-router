fragment: operations/backend-commerce-catalog
frontend_operations:
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: listCommerceCategories
  operation_id: catalog.categories.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/catalog/categories
  sdk_domain: commerce
  summary: List product categories for admin management
  description: Returns appbase commerce category tree records for backend catalog management.
  read_sources:
  - commerce_product_category
  query_parameters:
  - name: parent_id
    schema:
      type: string
      maxLength: 128
  - name: status
    schema:
      type: string
      maxLength: 32
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  response_schema:
    name: CommerceProductCategoryListResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items: &id001
          name: CommerceProductCategoryItem
          type: object
          additionalProperties: false
          required:
          - id
          - categoryNo
          - name
          - path
          - levelNo
          - status
          - sortOrder
          - createdAt
          - updatedAt
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            categoryNo:
              type: string
              minLength: 1
              maxLength: 128
            parentId:
              type: string
              nullable: true
              maxLength: 128
            name:
              type: string
              minLength: 1
              maxLength: 256
            path:
              type: string
              minLength: 1
              maxLength: 1024
            levelNo:
              type: integer
              format: int64
              minimum: 0
            status:
              type: string
              enum:
              - active
              - inactive
              - archived
            sortOrder:
              type: integer
              format: int64
              minimum: 0
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: createCommerceCategory
  operation_id: catalog.categories.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/catalog/categories
  sdk_domain: commerce
  summary: Create product category
  description: Creates one appbase commerce product category with stable category number and category tree placement.
  idempotency_required: true
  read_sources:
  - commerce_product_category
  write_tables:
  - commerce_product_category
  - ops_audit_log
  request_schema: &id002
    name: CommerceProductCategoryMutationRequest
    type: object
    additionalProperties: false
    required:
    - categoryNo
    - name
    - status
    properties:
      categoryNo:
        type: string
        minLength: 1
        maxLength: 128
      parentId:
        type: string
        nullable: true
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 256
      status:
        type: string
        enum:
        - active
        - inactive
        - archived
      sortOrder:
        type: integer
        format: int64
        minimum: 0
  response_schema: &id003
    name: CommerceProductCategoryMutationResponse
    type: object
    additionalProperties: false
    required:
    - item
    properties:
      item: *id001
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: updateCommerceCategory
  operation_id: catalog.categories.update
  kind: update
  api_surface: backend
  api_method: PATCH
  api_path: /backend/v3/api/catalog/categories/{categoryId}
  sdk_domain: commerce
  summary: Update product category
  description: Updates mutable category metadata and category tree placement.
  idempotency_required: true
  read_sources:
  - commerce_product_category
  write_tables:
  - commerce_product_category
  - ops_audit_log
  request_schema: *id002
  response_schema: *id003
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: deleteCommerceCategory
  operation_id: catalog.categories.delete
  kind: delete
  api_surface: backend
  api_method: DELETE
  api_path: /backend/v3/api/catalog/categories/{categoryId}
  sdk_domain: commerce
  summary: Delete product category
  description: Deletes or archives a category after backend referential checks.
  read_sources:
  - commerce_product_category
  - commerce_product_spu_category
  write_tables:
  - commerce_product_category
  - ops_audit_log
  response_schema:
    name: AdminDeleteResponse
    type: object
    additionalProperties: false
    required:
    - deleted
    properties:
      deleted:
        type: boolean
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: initializeCommerceCategorySeeds
  operation_id: catalog.categorySeeds.create
  kind: create
  api_surface: backend
  api_method: POST
  api_path: /backend/v3/api/catalog/category_seeds/initialize
  sdk_domain: commerce
  summary: Initialize admin category seed datasets
  description: Imports selected category seed datasets from data/categories into commerce product categories and reusable plus_category records.
  idempotency_required: true
  read_sources:
  - commerce_product_category
  - plus_category
  write_tables:
  - commerce_product_category
  - plus_category
  - ops_audit_log
  request_schema:
    name: CommerceCategorySeedInitializeRequest
    type: object
    additionalProperties: false
    properties:
      datasets:
        type: array
        items:
          type: string
          enum:
          - product
          - courses
          - agents
          - agent-skills
          - mcp
          - apps
      mode:
        type: string
        maxLength: 128
  response_schema:
    name: CommerceCategorySeedInitializeResponse
    type: object
    additionalProperties: false
    required:
    - items
    properties:
      items:
        type: array
        items:
          name: CommerceCategorySeedInitializeSummary
          type: object
          additionalProperties: false
          required:
          - dataset
          - targetTable
          - requested
          - upserted
          - skipped
          - installDefaultEnabled
          - configKey
          properties:
            dataset:
              type: string
              minLength: 1
              maxLength: 128
            targetTable:
              type: string
              enum:
              - commerce_product_category
              - plus_category
            requested:
              type: integer
              format: int64
              minimum: 0
            upserted:
              type: integer
              format: int64
              minimum: 0
            skipped:
              type: integer
              format: int64
              minimum: 0
            installDefaultEnabled:
              type: boolean
            configKey:
              type: string
              minLength: 1
              maxLength: 128
- route: /admin/catalog
  source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-catalog/src/catalogService.ts
  operation: listCommerceProducts
  operation_id: catalog.products.list
  kind: read
  api_surface: backend
  api_method: GET
  api_path: /backend/v3/api/catalog/products
  sdk_domain: commerce
  summary: List products for admin management
  description: Returns SPU catalog records for backend product center management with up to three category bindings per product.
  read_sources:
  - commerce_product_spu
  - commerce_product_spu_category
  - commerce_product_sku
  - commerce_product_category
  - commerce_product_media
  - commerce_price_list
  - commerce_price_list_item
  query_parameters:
  - name: q
    schema:
      type: string
      maxLength: 256
  - name: category_id
    schema:
      type: string
      maxLength: 128
  - name: product_type
    schema:
      type: string
      maxLength: 64
  - name: status
    schema:
      type: string
      maxLength: 32
  - name: page
    schema:
      type: integer
      format: int64
      minimum: 1
  - name: page_size
    schema:
      type: integer
      format: int64
      minimum: 1
      maximum: 200
  - name: sort
    schema:
      type: string
      maxLength: 128
  response_schema:
    name: CommerceProductSpuListResponse
    type: object
    additionalProperties: false
    required:
    - items
    - total
    - page
    - pageSize
    properties:
      items:
        type: array
        items: &id004
          name: CommerceProductSpuItem
          type: object
          additionalProperties: false
          required:
          - id
          - spuNo
          - productType
          - title
          - status
          - createdAt
          - updatedAt
          properties:
            id:
              type: string
              minLength: 1
              maxLength: 128
            spuNo:
              type: string
              minLength: 1
              maxLength: 128
            productType:
              type: string
              enum:
              - physical_good
              - virtual_good
              - membership
              - points_recharge
              - wallet_recharge
              - subscription
              - service
            title:
              type: string
              minLength: 1
              maxLength: 512
            subtitle:
              type: string
              nullable: true
              maxLength: 512
            description:
              type: string
              nullable: true
              maxLength: 20000
            categoryIds:
              type: array
              maxItems: 3
              items:
                type: string
                minLength: 1
                maxLength: 128
            brand:
              type: string
              nullable: true
              maxLength: 128
            status:
              type: string
              enum:
              - draft
              - active
              - inactive
              - archived
            publishedAt:
              type: string
              nullable: true
              maxLength: 64
            defaultSkuId:
              type: string
              nullable: true
              maxLength: 128
            minPriceAmount:
              type: string
              nullable: true
              pattern: ^\d+(?:\.\d{1,6})?$
            currencyCode:
              type: string
              nullable: true
              minLength: 3
              maxLength: 16
            media:
              type: array
              items:
                name: CommerceProductMediaItem
                type: object
                additionalProperties: false
                required:
                - id
                - ownerType
                - ownerId
                - mediaRole
                - resource
                - sortOrder
                - status
                properties:
                  id:
                    type: string
                    minLength: 1
                    maxLength: 128
                  ownerType:
                    type: string
                    enum:
                    - spu
                    - sku
                  ownerId:
                    type: string
                    minLength: 1
                    maxLength: 128
                  mediaRole:
                    type: string
                    enum:
                    - main_image
                    - gallery_image
                    - detail_image
                    - sku_image
                    - video
                    - manual
                    - certificate
                  resource:
                    $ref: '#/components/schemas/MediaResource'
                  altText:
                    type: string
                    nullable: true
                    maxLength: 512
                  sortOrder:
                    type: integer
                    format: int64
                    minimum: 0
                  status:
                    type: string
                    enum:
                    - active
                    - inactive
                    - deleted
            createdAt:
              type: string
              minLength: 1
              maxLength: 64
            updatedAt:
              type: string
              minLength: 1
              maxLength: 64
      total:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      pageSize:
        type: integer
        format: int64
        minimum: 1
        maximum: 200
