fragment: shared/entities/content
x_response_entities:
  forum_author: &id001
    name: ForumAuthor
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - isFollowing
    properties:
      id:
        type: integer
        format: int64
        minimum: 0
      name:
        type: string
        minLength: 1
        maxLength: 128
      avatar:
        $ref: '#/components/schemas/MediaResource'
      bio:
        type: string
        maxLength: 512
      isFollowing:
        type: boolean
  forum_feed_item: &id002
    name: ForumFeedItem
    type: object
    additionalProperties: false
    required:
    - id
    - title
    - content
    - summary
    - cover
    - contentType
    - categoryId
    - tags
    - author
    - viewCount
    - likeCount
    - commentCount
    - shareCount
    - isLiked
    - isCollected
    - isTop
    - isHot
    - isRecommended
    - createdAt
    - updatedAt
    properties:
      id:
        type: integer
        format: int64
        minimum: 1
      title:
        type: string
        minLength: 1
        maxLength: 255
      content:
        type: string
        maxLength: 20000
      summary:
        type: string
        maxLength: 1024
      cover:
        $ref: '#/components/schemas/MediaResource'
      contentType:
        type: string
        enum:
        - feeds
      categoryId:
        type: integer
        format: int64
        minimum: 0
      tags:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
      author: *id001
      viewCount:
        type: integer
        format: int64
        minimum: 0
      likeCount:
        type: integer
        format: int64
        minimum: 0
      commentCount:
        type: integer
        format: int64
        minimum: 0
      shareCount:
        type: integer
        format: int64
        minimum: 0
      isLiked:
        type: boolean
      isCollected:
        type: boolean
      isTop:
        type: boolean
      isHot:
        type: boolean
      isRecommended:
        type: boolean
      createdAt:
        type: string
        maxLength: 64
      updatedAt:
        type: string
        maxLength: 64
  forum_feed_item_list:
    name: ForumFeedItemList
    type: array
    maxItems: 100
    items: *id002
  forum_comment_item: &id003
    name: ForumCommentItem
    type: object
    additionalProperties: false
    required:
    - commentId
    - content
    - contentType
    - contentId
    - userId
    - status
    - likes
    - replyCount
    - isTop
    - author
    - createdAt
    properties:
      commentId:
        type: string
        minLength: 1
        maxLength: 128
      content:
        type: string
        minLength: 1
        maxLength: 20000
      contentType:
        type: string
        enum:
        - FEEDS
        - COMMENTS
      contentId:
        type: integer
        format: int64
        minimum: 1
      userId:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - PUBLISHED
        - PENDING
        - DELETED
      likes:
        type: integer
        format: int64
        minimum: 0
      replyCount:
        type: integer
        format: int64
        minimum: 0
      isTop:
        type: boolean
      parentId:
        type: integer
        format: int64
        minimum: 1
      author: *id001
      createdAt:
        type: string
        maxLength: 64
  forum_comment_detail:
    name: ForumCommentDetail
    type: object
    additionalProperties: false
    required:
    - commentId
    - content
    - contentType
    - contentId
    - userId
    - status
    - likes
    - replyCount
    - isTop
    - author
    - ipAddress
    - deviceInfo
    - createdAt
    - updatedAt
    - replies
    properties:
      commentId:
        type: string
        minLength: 1
        maxLength: 128
      content:
        type: string
        minLength: 1
        maxLength: 20000
      contentType:
        type: string
        enum:
        - FEEDS
        - COMMENTS
      contentId:
        type: integer
        format: int64
        minimum: 1
      userId:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - PUBLISHED
        - PENDING
        - DELETED
      likes:
        type: integer
        format: int64
        minimum: 0
      replyCount:
        type: integer
        format: int64
        minimum: 0
      isTop:
        type: boolean
      parentId:
        type: integer
        format: int64
        minimum: 1
      author: *id001
      ipAddress:
        type: string
        maxLength: 128
      deviceInfo:
        type: string
        maxLength: 512
      createdAt:
        type: string
        maxLength: 64
      updatedAt:
        type: string
        maxLength: 64
      replies:
        type: array
        maxItems: 100
        items: *id003
  forum_comment_page:
    name: ForumCommentPage
    type: object
    additionalProperties: false
    required:
    - items
    - content
    - totalElements
    - page
    - size
    properties:
      items:
        type: array
        maxItems: 100
        items: *id003
      content:
        type: array
        maxItems: 100
        items: *id003
      totalElements:
        type: integer
        format: int64
        minimum: 0
      page:
        type: integer
        format: int64
        minimum: 1
      size:
        type: integer
        format: int64
        minimum: 1
        maximum: 100
  forum_boolean_response:
    name: ForumBooleanResponse
    type: boolean
  forum_comment_statistics:
    name: ForumCommentStatistics
    type: object
    additionalProperties: false
    required:
    - totalComments
    properties:
      totalComments:
        type: integer
        format: int64
        minimum: 0
  forum_overview_stats: &id004
    name: ForumOverviewStats
    type: object
    additionalProperties: false
    required:
    - totalPosts
    - totalComments
    - memberCount
    - onlineMembers
    properties:
      totalPosts:
        type: integer
        format: int64
        minimum: 0
      totalComments:
        type: integer
        format: int64
        minimum: 0
      memberCount:
        type: integer
        format: int64
        minimum: 0
      onlineMembers:
        type: integer
        format: int64
        minimum: 0
  forum_community_link: &id005
    name: ForumCommunityLink
    type: object
    additionalProperties: false
    required:
    - id
    - label
    - url
    - tone
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 64
      label:
        type: string
        minLength: 1
        maxLength: 128
      url:
        type: string
        minLength: 1
        maxLength: 2048
      qrCode:
        $ref: '#/components/schemas/MediaResource'
      tone:
        type: string
        enum:
        - green
        - blue
        - teal
        - red
        - pink
  forum_overview_source: &id006
    name: ForumOverviewSource
    type: object
    additionalProperties: false
    required:
    - sourceLabel
    - sourceDescription
    - sourceTables
    - observedAt
    properties:
      sourceLabel:
        type: string
        minLength: 1
        maxLength: 128
      sourceDescription:
        type: string
        minLength: 1
        maxLength: 512
      sourceTables:
        type: array
        maxItems: 8
        items:
          type: string
          minLength: 1
          maxLength: 128
      observedAt:
        type: string
        minLength: 1
        maxLength: 64
  forum_overview_response:
    name: ForumOverviewResponse
    type: object
    additionalProperties: false
    required:
    - stats
    - communityLinks
    - source
    properties:
      stats: *id004
      communityLinks:
        type: array
        maxItems: 16
        items: *id005
      source: *id006
  forum_create_feed_request:
    name: ForumCreateFeedRequest
    type: object
    additionalProperties: false
    required:
    - content
    properties:
      title:
        type: string
        maxLength: 255
      content:
        type: string
        minLength: 1
        maxLength: 2000
      categoryId:
        type: integer
        format: int64
        minimum: 0
      images:
        type: array
        maxItems: 20
        items:
          $ref: '#/components/schemas/MediaResource'
      tags:
        type: array
        maxItems: 20
        items:
          type: string
          minLength: 1
          maxLength: 64
      source:
        type: string
        maxLength: 100
      sourceUrl:
        type: string
        maxLength: 500
  forum_create_comment_request:
    name: ForumCreateCommentRequest
    type: object
    additionalProperties: false
    required:
    - contentType
    - contentId
    - content
    properties:
      contentType:
        type: string
        enum:
        - feeds
        - comments
        - FEEDS
        - COMMENTS
      contentId:
        type: integer
        format: int64
        minimum: 1
      content:
        type: string
        minLength: 1
        maxLength: 20000
      deviceInfo:
        type: string
        maxLength: 512
  forum_reply_comment_request:
    name: ForumReplyCommentRequest
    type: object
    additionalProperties: false
    required:
    - content
    properties:
      content:
        type: string
        minLength: 1
        maxLength: 20000
      deviceInfo:
        type: string
        maxLength: 512
