        type: object
        additionalProperties: false
        required:
        - today
        - total
        properties:
          today:
            type: number
            minimum: 0
          total:
            type: number
            minimum: 0
      status:
        type: string
        enum:
        - active
        - disabled
  admin_coupon_item:
    name: AdminCouponItem
    type: object
    additionalProperties: false
