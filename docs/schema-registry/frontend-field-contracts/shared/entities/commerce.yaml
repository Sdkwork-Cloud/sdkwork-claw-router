fragment: shared/entities/commerce
x_response_entities:
  usage_snapshot:
    name: UsageSnapshot
    type: object
    additionalProperties: true
    properties:
      inputTokens:
        type: integer
        format: int64
        minimum: 0
      outputTokens:
        type: integer
        format: int64
        minimum: 0
      cachedTokens:
        type: integer
        format: int64
        minimum: 0
      totalTokens:
        type: integer
        format: int64
        minimum: 0
  vip_benefit: &id001
    name: VipBenefit
    type: object
    additionalProperties: false
    required:
    - id
    - name
    - claimed
    properties:
      id:
        type: integer
        format: int64
        minimum: 0
      name:
        type: string
        minLength: 1
        maxLength: 128
      benefitKey:
        type: string
        nullable: true
        maxLength: 128
      type:
        type: string
        nullable: true
        maxLength: 64
      description:
        type: string
        nullable: true
        maxLength: 512
      icon:
        type: string
        nullable: true
        maxLength: 512
      claimed:
        type: boolean
      usageLimit:
        type: integer
        format: int64
        nullable: true
        minimum: 0
      usedCount:
        type: integer
        format: int64
        nullable: true
        minimum: 0
  vip_level:
    name: VipLevel
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - name
    - rank
    - benefits
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      rank:
        type: integer
        format: int64
        minimum: 0
      benefits:
        type: array
        items: *id001
      status:
        type: string
        enum:
        - active
        - inactive
        - disabled
  vip_package:
    name: VipPackage
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - groupId
    - levelId
    - name
    - priceAmount
    - currencyCode
    - durationDays
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 128
      groupId:
        type: string
        minLength: 1
        maxLength: 128
      levelId:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      priceAmount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: VIP package price as a canonical decimal money string.
      currencyCode:
        type: string
        minLength: 3
        maxLength: 16
      durationDays:
        type: integer
        format: int64
        minimum: 1
        maximum: 36500
      status:
        type: string
        enum:
        - active
        - inactive
        - disabled
  vip_package_group:
    name: VipPackageGroup
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - name
    - billingCycle
    - durationDays
    - sortWeight
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 128
      name:
        type: string
        minLength: 1
        maxLength: 128
      description:
        type: string
        nullable: true
        maxLength: 512
      billingCycle:
        type: string
        minLength: 1
        maxLength: 64
      durationDays:
        type: integer
        format: int64
        minimum: 1
        maximum: 36500
      sortWeight:
        type: integer
        format: int64
        minimum: 0
      status:
        type: string
        enum:
        - active
        - inactive
        - disabled
  vip_membership:
    name: VipMembership
    type: object
    additionalProperties: false
    required:
    - id
    - ownerUserId
    - levelCode
    - status
    - startedAt
    - expiresAt
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      ownerUserId:
        type: string
        minLength: 1
        maxLength: 128
      levelCode:
        type: string
        minLength: 1
        maxLength: 128
      status:
        type: string
        enum:
        - active
        - inactive
        - expired
        - suspended
        - cancelled
      startedAt:
        type: string
        minLength: 1
        maxLength: 64
      expiresAt:
        type: string
        minLength: 1
        maxLength: 64
  vip_entitlement:
    name: VipEntitlement
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - levelId
    - membershipId
    - quota
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      code:
        type: string
        minLength: 1
        maxLength: 128
      levelId:
        type: string
        maxLength: 128
      membershipId:
        type: string
        maxLength: 128
      quota:
        type: string
        pattern: ^\d+(?:\.\d{1,6})?$
        description: Granted VIP entitlement quota as a canonical decimal string.
      status:
        type: string
        enum:
        - active
        - inactive
        - disabled
        - exhausted
  commerce_coupon_wallet_item:
    name: CommerceCouponWalletItem
    type: object
    additionalProperties: false
    required:
    - id
    - code
    - amount
    - date
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
        description: Stable appbase commerce_coupon id for the issued coupon.
      code:
        type: string
        minLength: 1
        maxLength: 128
      amount:
        type: string
        pattern: ^-?\d+(?:\.\d{1,2})?$
        description: Redeemed coupon amount as a canonical decimal money string.
      date:
        type: string
        minLength: 1
        maxLength: 64
      status:
        type: string
        enum:
        - success
        - pending
        - failed
  commerce_payment_attempt_history_item:
    name: CommercePaymentAttemptHistoryItem
    type: object
    additionalProperties: false
    required:
    - id
    - orderNo
    - method
    - amount
    - date
    - status
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
        description: Stable appbase commerce_payment_attempt id for the recharge payment record.
      orderNo:
        type: string
        minLength: 1
        maxLength: 128
      method:
        type: string
        minLength: 1
        maxLength: 64
      amount:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: Recharge payment amount as a canonical decimal money string.
      date:
        type: string
        minLength: 1
        maxLength: 64
      status:
        type: string
        enum:
        - success
        - pending
        - failed
  recharge_package:
    name: RechargePackage
    type: object
    additionalProperties: false
    required:
    - id
    - rmb
    - bonus
    - points
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 128
      rmb:
        type: string
        pattern: ^\d+(?:\.\d{1,2})?$
        description: Recharge package price as a canonical decimal money string.
      bonus:
        type: integer
        format: int64
        minimum: 0
      points:
        type: integer
        format: int64
        minimum: 0
