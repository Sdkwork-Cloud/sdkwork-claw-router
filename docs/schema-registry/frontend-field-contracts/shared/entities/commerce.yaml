  checkout_status_response:
    name: CheckoutStatusResponse
    type: object
    additionalProperties: false
    required:
    - orderNo
    - outTradeNo
    - amount
    - points
    - paymentMethod
    - orderStatus
    - paymentStatus
    - rechargeStatus
    - status
    - createdAt
    - expiresAt
    - paidAt
    - nextAction
    - qrCodePayload
