      points:
        type: integer
        format: int64
        minimum: 0
      paymentMethod:
        type: string
        minLength: 1
        maxLength: 64
      orderStatus:
        type: string
        enum:
        - pending
        - success
        - failed
        - expired
        - refunding
        - refunded
      paymentStatus:
        type: string
        enum:
        - pending
        - success
        - failed
        - expired
        - refunding
        - refunded
      rechargeStatus:
        type: string
        enum:
        - pending
        - success
        - failed
        - expired
        - refunding
        - refunded
      status:
        type: string
        enum:
        - pending
        - success
        - failed
        - expired
        - refunding
        - refunded
      createdAt:
        type: string
        minLength: 1
        maxLength: 64
      expiresAt:
        type: string
        minLength: 1
        maxLength: 64
      paidAt:
        type: string
        maxLength: 64
