frontend_operations:
  - route: /console/api-keys
    source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-console-api-keys/src/apiKeyService.ts
    operation: fetchGroups
    operation_id: channelGroups.list
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/channel_groups
    read_sources:
      - ai_channel_group
      - ai_channel_group_metric_snapshot
      - ai_pricing_plan
    query_parameters: []
    response_schema:
      name: AppChannelGroupListResponse
      required: [items]
      properties:
        items:
          type: array
          items:
            name: AppChannelGroup
            type: object
            additionalProperties: false
            required: [id, code, name, rate]
            properties:
              id: { type: string, minLength: 1, maxLength: 128 }
              code: { type: string, minLength: 1, maxLength: 128 }
              name: { type: string, minLength: 1, maxLength: 128 }
              rate: { type: string, nullable: true, maxLength: 64 }
  - route: /models
    source: apps/sdkwork-clawrouter-pc/packages/sdkwork-clawrouter-pc-models/src/modelService.ts
    operation: fetchModels
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/models
    read_sources:
      - ai_model_vendor
      - ai_model
      - ai_model_capability
      - ai_model_pricing
      - ai_channel_group
      - ai_channel_group_member
    query_parameters:
      - name: billing_meter
        schema: { type: string }
      - name: vendor_code
        schema: { type: string }
      - name: vendor_codes
        schema:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        style: form
        explode: false
      - name: modalities
        schema:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        style: form
        explode: false
      - name: capabilities
        schema:
          type: array
          maxItems: 64
          items: { type: string, minLength: 1, maxLength: 64 }
        style: form
        explode: false
      - name: categories
        schema:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        style: form
        explode: false
      - name: groups
        schema:
          type: array
          maxItems: 32
          items: { type: string, minLength: 1, maxLength: 64 }
        style: form
        explode: false
      - name: q
        schema: { type: string }
      - name: limit
        schema: { type: integer, format: int64, minimum: 1, maximum: 1000 }
    response_schema:
      name: AppModelCatalogResponse
      required: [items, groups]
      properties:
        items:
          type: array
          maxItems: 1000
          items:
            name: AppModelCatalogItem
            type: object
            additionalProperties: false
            required: [catalogKey, model, displayName, vendorCode, vendor, capabilities, groups, categories, description, modalities, inputModalities, outputModalities, apiFormat, capabilityIntro, limitations, supportedLanguages, useCases, trainingDataCutoff,
              contextTokens, maxOutputTokens, supportsStreaming, supportsTools, supportsJsonSchema, releaseStage, shelfState, routingState, replacementModel, providerCodes, officialReferencePrices, priceAvailability]
            properties:
              catalogKey: { type: string, minLength: 3, maxLength: 256 }
              model: { type: string, minLength: 1, maxLength: 128 }
              displayName: { type: string, minLength: 1, maxLength: 128 }
              vendorCode: { type: string, minLength: 1, maxLength: 64 }
              vendor: { type: string, minLength: 1, maxLength: 64 }
              capabilities:
                type: array
                maxItems: 64
                items: { type: string, minLength: 1, maxLength: 64 }
              groups:
                type: array
                maxItems: 32
                items: { type: string, minLength: 1, maxLength: 64 }
              categories:
                type: array
                maxItems: 5
                items: { type: string, enum: [Recommended, Open Source, Proprietary, Free, New] }
              description: { type: string, nullable: true, maxLength: 2048 }
              modalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              inputModalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              outputModalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              apiFormat: { type: string, nullable: true, maxLength: 128 }
              capabilityIntro: { type: string, nullable: true, maxLength: 4096 }
              limitations:
                type: array
                maxItems: 64
                items: { type: string, minLength: 1, maxLength: 512 }
              supportedLanguages:
                type: array
                maxItems: 128
                items: { type: string, minLength: 1, maxLength: 128 }
              useCases:
                type: array
                maxItems: 64
                items: { type: string, minLength: 1, maxLength: 256 }
              trainingDataCutoff: { type: string, nullable: true, maxLength: 128 }
              contextTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
              maxOutputTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
              supportsStreaming: { type: boolean }
              supportsTools: { type: boolean }
              supportsJsonSchema: { type: boolean }
              releaseStage: { type: integer, format: int64, nullable: true }
              shelfState: { type: integer, format: int64, nullable: true }
              routingState: { type: integer, format: int64, nullable: true }
              replacementModel: { type: string, nullable: true, maxLength: 128 }
              providerCodes:
                type: array
                maxItems: 256
                items: { type: string, minLength: 1, maxLength: 64 }
              officialReferencePrices:
                type: array
                maxItems: 64
                description: Complete public official reference prices keyed by regionCode and billing meter. Customer, upstream, provider, and channel prices are never exposed here.
                items:
                  name: AppModelCatalogReferencePrice
                  type: object
                  additionalProperties: false
                  required: [regionCode, billingMeter, unitPrice, currency]
                  properties:
                    regionCode:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: Deployment or pricing region for this public reference price. Region is never encoded in catalogKey.
                    billingMeter: { type: string, minLength: 1, maxLength: 64 }
                    unitPrice:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: Decimal unit price in the native official reference currency.
                    currency: { type: string, minLength: 3, maxLength: 3 }
              priceAvailability:
                name: AppModelCatalogPriceAvailability
                type: object
                additionalProperties: false
                required: [status]
                properties:
                  status: { type: string, enum: [reference, unavailable] }
                  reason: { type: string, nullable: true }
        groups:
          type: array
          maxItems: 128
          description: Complete admin-maintained channel group catalog for the model library sidebar. Groups are returned even when the current model filter result contains no matching model.
          items:
            name: AppModelCatalogGroupOption
            type: object
            additionalProperties: false
            required: [key, label, modelCount]
            properties:
              key: { type: string, minLength: 1, maxLength: 64 }
              label: { type: string, minLength: 1, maxLength: 128 }
              modelCount: { type: integer, format: int64, minimum: 0 }
