  billing_redeem_history_item: &billing_redeem_history_item
    name: BillingRedeemHistoryItem
    type: object
    additionalProperties: false
    required: [id, code, amount, date, status]
    properties:
      id: { type: integer, format: int64, minimum: 1 }
      code: { type: string, minLength: 1, maxLength: 128 }
      amount:
        type: string
        pattern: '^-?\d+(?:\.\d{1,2})?$'
        description: Redeemed coupon amount as a canonical decimal money string.
      date: { type: string, minLength: 1, maxLength: 64 }
      status: { type: string, enum: [success, pending, failed] }
  billing_recharge_history_item: &billing_recharge_history_item
    name: BillingRechargeHistoryItem
    type: object
    additionalProperties: false
    required: [id, orderNo, method, amount, date, status]
    properties:
      id: { type: integer, format: int64, minimum: 1 }
      orderNo: { type: string, minLength: 1, maxLength: 128 }
      method: { type: string, minLength: 1, maxLength: 64 }
      amount:
        type: string
        pattern: '^\d+(?:\.\d{1,2})?$'
        description: Recharge payment amount as a canonical decimal money string.
      date: { type: string, minLength: 1, maxLength: 64 }
      status: { type: string, enum: [success, pending, failed] }
  recharge_package: &recharge_package
    name: RechargePackage
    type: object
    additionalProperties: false
    required: [id, rmb, bonus, points]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      rmb:
        type: string
        pattern: '^\d+(?:\.\d{1,2})?$'
        description: Recharge package price as a canonical decimal money string.
      bonus: { type: integer, format: int64, minimum: 0 }
      points:
        type: integer
        format: int64
        minimum: 0
        description: Total credited points for this recharge package, including bonus points.
  checkout_status_response: &checkout_status_response
    name: CheckoutStatusResponse
    type: object
    additionalProperties: false
    required: [orderNo, outTradeNo, amount, points, paymentMethod, orderStatus, paymentStatus, rechargeStatus, status, createdAt, expiresAt, paidAt, nextAction, qrCodePayload]
    properties:
      orderNo: { type: string, minLength: 1, maxLength: 128 }
      outTradeNo: { type: string, maxLength: 128 }
      amount:
        type: string
        pattern: '^\d+(?:\.\d{1,2})?$'
        description: Checkout amount as a canonical decimal money string.
      points: { type: integer, format: int64, minimum: 0 }
      paymentMethod: { type: string, minLength: 1, maxLength: 64 }
