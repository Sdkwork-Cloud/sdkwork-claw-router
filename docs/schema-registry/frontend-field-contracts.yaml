    operation: fetchLogs
    kind: read
    api_surface: app
    api_method: GET
    api_path: /app/v3/api/ai/usage/logs
    read_sources:
      - ai_request_trace
      - ai_usage_fact
      - ai_routing_decision_log
    query_parameters:
      - name: page
        schema: { type: integer, format: int64, minimum: 1 }
      - name: page_size
        schema: { type: integer, format: int64, minimum: 1, maximum: 200 }
      - name: q
        schema: { type: string, maxLength: 128 }
      - name: status
        schema: { type: string, maxLength: 64 }
      - name: start_time
        schema: { type: string, maxLength: 64 }
      - name: end_time
        schema: { type: string, maxLength: 64 }
    response_schema:
      name: UsageLogsResponse
      required: [logs, total, page, pageSize]
      properties:
        logs:
          type: array
          items:
            name: UsageLogItem
            type: object
            additionalProperties: false
            required: [id, requestId, time, tokenName, group, type, model, providerNativeModel, requestedModelCatalogKey, regionCode, status, httpStatus, errorCode, errorType, errorMessage, totalTime, ttft, isStream, inputTokens, cacheReadTokens,
              outputTokens, cost, multiplier, baseInputPrice, baseOutputPrice, cacheReadPrice, path, reasoningEffort, ip, userAgent]
            properties:
              id: { type: string }
              requestId: { type: string }
              time: { type: string }
              tokenName: { type: string }
              group:
                type: string
                description: Maintained channel group display name. Falls back to the recorded group snapshot when the group has been removed or renamed outside the read model.
              type: { type: string }
              model:
                type: string
                description: Provider native model id used in the upstream provider request, kept as the visible model value for usage tables.
              providerNativeModel:
                type: string
                description: Provider native model id, for example gpt-5.5.
              requestedModelCatalogKey:
                type: string
                description: Routed base catalog model identity in vendor/model form, for example openai/gpt-5.5. Region-specific pricing or ranking keys are stored separately from the routed model identity.
              regionCode:
                type: string
                maxLength: 64
                description: Deployment region used by the selected endpoint and pricing resolver. This is not part of the model catalog identity.
              status: { type: string }
              httpStatus: { type: integer, format: int64 }
              errorCode: { type: string }
              errorType: { type: string }
              errorMessage: { type: string }
              totalTime: { type: string }
              ttft: { type: string }
              isStream: { type: boolean }
              inputTokens: { type: integer, format: int64 }
              cacheReadTokens: { type: integer, format: int64 }
              outputTokens: { type: integer, format: int64 }
              cost:
                type: string
                format: decimal
                description: Customer-facing spend amount for the request, normalized to 9 decimal places for console display. Uses customer_charge_amount from the usage ledger and never exposes upstream cost fields.
              multiplier: { type: string, format: decimal }
              baseInputPrice: { type: string, format: decimal }
              baseOutputPrice: { type: string, format: decimal }
              cacheReadPrice: { type: string, format: decimal }
              path: { type: string }
              reasoningEffort: { type: string }
              ip: { type: string }
              userAgent:
                type: string
                maxLength: 1024
                description: Full HTTP User-Agent header captured from the gateway request. Empty when the client omitted the header.
        total: { type: integer, format: int64 }
        page: { type: integer, format: int64 }
        pageSize: { type: integer, format: int64 }
