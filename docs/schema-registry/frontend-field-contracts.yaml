          properties:
            sourceLabel: { type: string, minLength: 1, maxLength: 128 }
            sourceDescription: { type: string, minLength: 1, maxLength: 512 }
            observedAt: { type: string, maxLength: 64 }
            snapshotDate: { type: string, minLength: 1, maxLength: 64 }
            snapshotPeriod: { type: string, minLength: 1, maxLength: 32 }
            windowStart: { type: string, maxLength: 64 }
            windowEnd: { type: string, maxLength: 64 }
            generatedAt: { type: string, maxLength: 64 }
            refreshIntervalSeconds: { type: integer, format: int64, minimum: 1 }
            nextRefreshAt: { type: string, maxLength: 64 }
            cacheMaxAgeSeconds: { type: integer, format: int64, minimum: 1 }
            rankScope: { type: string, minLength: 1, maxLength: 64 }
            sourceTables:
              type: array
              maxItems: 8
              items: { type: string, minLength: 1, maxLength: 128 }
        items:
          type: array
          maxItems: 200
          items:
            name: ModelRankingItem
            type: object
            additionalProperties: false
            required: [id, rank, prevRank, name, vendor, vendorCode, modality, baseVolume, costIndicator, latency, isNew, color, strengths, requests, tokens, cost, currency]
            properties:
              id:
                type: string
                minLength: 1
                maxLength: 256
                description: Stable model catalog identity; must match ranking history catalogKey and must not include snapshot date prefixes.
              rank: { type: integer, format: int64, minimum: 1 }
              prevRank: { type: integer, format: int64, minimum: 0 }
              name: { type: string, minLength: 1, maxLength: 128 }
              vendor: { type: string, minLength: 1, maxLength: 128 }
              vendorCode: { type: string, minLength: 1, maxLength: 64 }
              modality: { type: string, enum: [LLM, Image, Audio, Video, Music, Embedding, Rerank, Unknown] }
              baseVolume: { type: integer, format: int64, minimum: 0 }
              costIndicator: { type: integer, format: int64, minimum: 1, maximum: 5 }
              latency: { type: integer, format: int64, minimum: 0 }
              contextSize: { type: string, nullable: true, maxLength: 64 }
              isNew: { type: boolean }
              color: { type: string, minLength: 1, maxLength: 64 }
              winRate: { type: number, nullable: true, minimum: 0, maximum: 100 }
              pricing: { type: string, nullable: true, maxLength: 128 }
              license: { type: string, nullable: true, enum: [Open Source, Proprietary] }
              strengths:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              requests: { type: integer, format: int64, minimum: 0 }
              tokens: { type: integer, format: int64, minimum: 0 }
              cost: { type: number, minimum: 0 }
              currency: { type: string, minLength: 1, maxLength: 16 }
              trendScore: { type: number, nullable: true }
        history:
          type: array
          maxItems: 60
          items:
            name: ModelRankingHistoryPoint
            type: object
            additionalProperties: false
            required: [date, index, entries]
            properties:
              date: { type: string, minLength: 1, maxLength: 64 }
              index: { type: integer, format: int64, minimum: 0 }
              entries:
                type: array
                maxItems: 500
                items:
                  name: ModelRankingHistoryEntry
                  type: object
                  additionalProperties: false
                  required: [model, catalogKey, rank, volume, color]
                  properties:
                    model: { type: string, minLength: 1, maxLength: 128 }
                    catalogKey: { type: string, minLength: 1, maxLength: 256 }
                    rank: { type: integer, format: int64, minimum: 0 }
                    volume: { type: integer, format: int64, minimum: 0 }
                    color: { type: string, minLength: 1, maxLength: 64 }
