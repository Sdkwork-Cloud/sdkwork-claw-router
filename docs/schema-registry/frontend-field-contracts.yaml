            windowEnd: { type: string, maxLength: 64 }
            generatedAt: { type: string, maxLength: 64 }
            refreshIntervalSeconds: { type: integer, format: int64, minimum: 1 }
            nextRefreshAt: { type: string, maxLength: 64 }
