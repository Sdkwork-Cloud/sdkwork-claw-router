  - route: /auth/login
    source: apps/sdkwork-claw-router-portal/src/auth/clawRouterAuthController.ts
    operation: signIn
    operation_id: sessions.create
    kind: create
    api_surface: app
    api_method: POST
    api_path: /app/v3/api/auth/sessions
    sdk_domain: auth
    summary: Create IAM session
    description: Creates a standard SDKWork IAM session for password, email-code, phone-code, or signed session-bridge grants and returns dual auth/access tokens with AppContext.
    request_id_header: true
    read_sources: [iam_user, iam_credential, iam_session]
    write_tables: [iam_session, iam_security_event, iam_audit_event]
    request_schema:
      name: IamSessionCreateRequest
      properties:
        grantType:
          type: string
          enum: [password, email_code, phone_code, session_bridge]
          description: Authentication grant. Defaults to password when username and password are supplied.
        username: { type: string, minLength: 1, maxLength: 128 }
        password: { type: string, minLength: 1, maxLength: 128 }
        email: { type: string, maxLength: 256 }
        phone: { type: string, maxLength: 32 }
        code: { type: string, maxLength: 32 }
        subject: { type: string, maxLength: 256 }
        name: { type: string, maxLength: 128 }
        tenantCode: { type: string, maxLength: 64 }
        organizationCode: { type: string, maxLength: 64 }
        deviceId: { type: string, maxLength: 128 }
        deviceName: { type: string, maxLength: 128 }
        deviceType: { type: string, maxLength: 32 }
    response_schema:
      name: IamSessionResponse
      required: [accessToken, authToken, context, user]
      properties:
        accessToken:
          type: string
          minLength: 1
          description: Data isolation and tenant access token. Clients send it as Sdkwork-Access-Token.
        authToken:
          type: string
          minLength: 1
          description: Bearer authentication token. Clients send it as Authorization Bearer.
        refreshToken:
          type: string
          minLength: 1
          description: Refresh token for session renewal.
        sessionId:
          type: string
          minLength: 1
          maxLength: 128
        expiresAt:
          type: string
          format: date-time
        context:
          name: IamAppContext
          type: object
          additionalProperties: false
          required: [appId, authLevel, dataScope, deploymentMode, environment, permissionScope, sessionId, tenantId, userId]
          properties:
            appId: { type: string, minLength: 1, maxLength: 128 }
            authLevel: { type: string, enum: [anonymous, password, mfa, system] }
            dataScope:
              type: array
              maxItems: 100
              items: { type: string, maxLength: 256 }
            deploymentMode: { type: string, enum: [saas, local, private] }
            environment: { type: string, enum: [dev, test, prod] }
            organizationId: { type: string, maxLength: 128 }
            permissionScope:
              type: array
              maxItems: 200
              items: { type: string, maxLength: 256 }
            sessionId: { type: string, minLength: 1, maxLength: 128 }
            tenantId: { type: string, minLength: 1, maxLength: 128 }
            userId: { type: string, minLength: 1, maxLength: 128 }
        user:
          name: IamUserResponse
          type: object
          additionalProperties: false
          required: [id, username, displayName, email, avatarUrl, phone, language, isVerified, status, registeredAt, lastLogin, lastLoginIp, passwordLastChanged, twoFactorEnabled, thirdPartyBound]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            username: { type: string, minLength: 1, maxLength: 128 }
            displayName: { type: string, minLength: 1, maxLength: 128 }
            email: { type: string, maxLength: 256 }
            avatarUrl: { type: string, maxLength: 2048 }
            phone:
              type: string
              description: Safe display phone value, empty when unavailable.
            language: { type: string, maxLength: 32 }
            isVerified: { type: boolean }
            status: { type: string, maxLength: 32 }
            registeredAt: { type: string, format: date-time }
            lastLogin: { type: string, maxLength: 64 }
            lastLoginIp:
              type: string
              description: Masked client IP address from the latest login event.
            passwordLastChanged: { type: string, maxLength: 64 }
            twoFactorEnabled: { type: boolean }
            thirdPartyBound:
              type: string
              description: Safe OAuth provider binding summary without provider subject IDs or tokens.
