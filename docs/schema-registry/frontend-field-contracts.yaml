      lastActive: { type: string, maxLength: 64 }
      lastUsed: { type: string, maxLength: 64 }
      createdAt: { type: string, maxLength: 64 }
  admin_api_key_item: &admin_api_key_item
    name: AdminApiKeyItem
    type: object
    additionalProperties: false
