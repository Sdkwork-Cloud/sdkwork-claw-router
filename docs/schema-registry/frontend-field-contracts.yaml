              categories:
                type: array
                maxItems: 5
                items: { type: string, enum: [Recommended, Open Source, Proprietary, Free, New] }
              description:
                type: string
                nullable: true
                maxLength: 2048
              modalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              inputModalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              outputModalities:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              apiFormat:
                type: string
                nullable: true
                maxLength: 128
              capabilityIntro:
                type: string
                nullable: true
                maxLength: 4096
              limitations:
                type: array
                maxItems: 64
                items: { type: string, minLength: 1, maxLength: 512 }
              supportedLanguages:
                type: array
                maxItems: 128
                items: { type: string, minLength: 1, maxLength: 128 }
              useCases:
                type: array
                maxItems: 64
                items: { type: string, minLength: 1, maxLength: 256 }
