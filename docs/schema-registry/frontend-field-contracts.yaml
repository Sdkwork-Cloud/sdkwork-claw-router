                type: integer
                format: int64
                nullable: true
                minimum: 0
              maxOutputTokens:
                type: integer
                format: int64
                nullable: true
                minimum: 0
              supportsStreaming: { type: boolean }
              supportsTools: { type: boolean }
              supportsJsonSchema: { type: boolean }
              releaseStage:
                type: integer
                format: int64
                nullable: true
              shelfState:
                type: integer
                format: int64
                nullable: true
              routingState:
                type: integer
                format: int64
                nullable: true
              replacementModel:
                type: string
                nullable: true
                maxLength: 128
              providerCodes:
                type: array
                maxItems: 256
                items: { type: string, minLength: 1, maxLength: 64 }
              officialReferenceUnitPrice:
                type: string
                nullable: true
                description: Public reference unit price for the requested billing meter when configured. The complete public reference price list is exposed through officialReferencePrices.
              officialReferenceCurrency:
                type: string
                nullable: true
                minLength: 3
                maxLength: 3
                description: Native reference currency for the requested billing meter when configured. The complete public reference price list is exposed through officialReferencePrices.
              officialReferencePrices:
                type: array
                maxItems: 64
                description: Complete public official reference prices keyed by billing meter. Customer, upstream, provider, and channel prices are never exposed here.
                items:
                  name: AppModelCatalogReferencePrice
                  type: object
                  additionalProperties: false
                  required: [billingMeter, unitPrice, currency]
                  properties:
                    billingMeter: { type: string, minLength: 1, maxLength: 64 }
                    unitPrice:
                      type: string
                      minLength: 1
                      maxLength: 64
                      description: Decimal unit price in the native official reference currency.
                    currency:
                      type: string
                      minLength: 3
                      maxLength: 3
              priceAvailability:
                name: AppModelCatalogPriceAvailability
                type: object
                additionalProperties: false
                required: [status]
                properties:
