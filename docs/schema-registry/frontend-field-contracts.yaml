  - route: /admin/channel
    source: apps/sdkwork-claw-router-portal/packages/sdkwork-claw-router-admin-channel/src/channelService.ts
    operation: addChannel
    kind: create
    api_surface: backend
    api_method: POST
    api_path: /backend/v3/api/integration/channels
    read_sources: [integration_provider, integration_channel, integration_channel_model, integration_provider_account]
    write_tables: [integration_channel, integration_channel_model, integration_provider_account, ops_config_snapshot, ops_audit_log]
    request_id_header: true
    request_schema:
      name: AdminChannelCreateRequest
      required: [name, vendor, secretRef, models]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 128
        vendor:
          type: string
          minLength: 1
          maxLength: 64
          pattern: '^[A-Za-z0-9 _().-]+$'
        protocol:
          type: string
          minLength: 1
          maxLength: 64
        accessType:
          type: string
          minLength: 1
          maxLength: 64
        baseUrl:
          type: string
          maxLength: 512
        secretRef:
          type: string
          minLength: 1
          maxLength: 256
          pattern: '^(vault|secret)://[^\\s]+$'
          description: Vault/KMS secret reference. Plaintext credential fields are forbidden.
        models:
          type: array
          minItems: 1
          maxItems: 200
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
            pattern: '^[A-Za-z0-9._:/-]+$'
        capabilities:
          type: array
          maxItems: 16
          uniqueItems: true
          items:
            type: string
            enum: [llm, image, audio, music, sfx, video]
        timeoutMs:
          type: integer
          format: int64
          minimum: 1
          maximum: 600000
          description: Per-channel upstream response timeout in milliseconds.
        retryPolicy:
          name: ProviderRetryPolicy
          type: object
          additionalProperties: false
          required: [maxAttempts, retryableStatusCodes]
          properties:
            maxAttempts:
              type: integer
              minimum: 1
              maximum: 5
            retryableStatusCodes:
              type: array
              minItems: 0
              maxItems: 8
              uniqueItems: true
              items:
                type: integer
                enum: [408, 409, 425, 429, 500, 502, 503, 504]
            backoffMs:
              type: integer
              minimum: 0
              maximum: 2000
        weight:
          type: integer
          format: int64
          minimum: 1
          maximum: 10000
        status:
          type: string
          enum: [active, disabled, error]
    response_schema:
      name: AdminChannelMutationResponse
      required: [item]
      properties:
        item:
          <<: *admin_channel_item
          description: Persisted channel snapshot returned by the backend.
