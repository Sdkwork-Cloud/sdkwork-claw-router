schema: sdkwork-claw-router-frontend-field-contracts
version: 0.1.0
source: apps/sdkwork-claw-router-portal/src/App.tsx
rule: every actual portal route must be backed by explicit schema tables; page-critical fields must map to generated columns or Java-owned physical columns.

x_response_entities:
  admin_announcement_item: &admin_announcement_item
    name: AdminAnnouncementItem
    type: object
    additionalProperties: false
    required: [id, title, target, status, date, content]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      title: { type: string, minLength: 1, maxLength: 200 }
      target: { type: string, enum: [all, vip, free, beta] }
      status: { type: string, enum: [published, draft] }
      date: { type: string, minLength: 1, maxLength: 64 }
      content: { type: string, minLength: 1, maxLength: 20000 }
  provider_retry_policy: &provider_retry_policy_schema
    name: ProviderRetryPolicy
    type: object
    additionalProperties: false
    required: [maxAttempts, retryableStatusCodes]
    properties:
      maxAttempts: { type: integer, minimum: 1, maximum: 5 }
      retryableStatusCodes:
        type: array
        maxItems: 8
        uniqueItems: true
        items: { type: integer, enum: [408, 409, 425, 429, 500, 502, 503, 504] }
      backoffMs: { type: integer, minimum: 0, maximum: 2000 }
  admin_channel_item: &admin_channel_item
    name: AdminChannelItem
    type: object
    additionalProperties: false
    required: [id, name, vendor, protocol, accessType, models, capabilities, isMultimodal, weight, status, balance, errors]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      vendor: { type: string, minLength: 1, maxLength: 64 }
      protocol: { type: string, minLength: 1, maxLength: 64 }
      accessType: { type: string, minLength: 1, maxLength: 64 }
      baseUrl: { type: string, maxLength: 512 }
      secretRef:
        type: string
        maxLength: 256
        pattern: '^(vault|secret)://[^\\s]+$'
      models:
        type: array
        maxItems: 200
        items: { type: string, minLength: 1, maxLength: 128 }
      capabilities:
        type: array
        maxItems: 16
        items: { type: string, enum: [llm, image, audio, music, sfx, video] }
      isMultimodal: { type: boolean }
      timeoutMs: { type: integer, format: int64, minimum: 1, maximum: 600000 }
      retryPolicy: *provider_retry_policy_schema
      weight: { type: integer, format: int64, minimum: 1, maximum: 10000 }
      status: { type: string, enum: [active, disabled, error] }
      balance: { type: string, maxLength: 64 }
      errors: { type: integer, format: int64, minimum: 0 }
  admin_provider_secret_item: &admin_provider_secret_item
    name: AdminProviderSecretItem
    type: object
    additionalProperties: false
    required: [id, providerCode, accountCode, name, authType, secretRef, maskedLabel, status, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      providerCode: { type: string, minLength: 1, maxLength: 64 }
      accountCode: { type: string, minLength: 1, maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 128 }
      authType: { type: string, maxLength: 64 }
      secretRef:
        type: string
        minLength: 1
        maxLength: 256
        pattern: '^(vault|secret)://[^\\s]+$'
      maskedLabel: { type: string, minLength: 1, maxLength: 256 }
      status: { type: string, enum: [active, disabled] }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_access_group_item: &admin_access_group_item
    name: AdminAccessGroupItem
    type: object
    additionalProperties: false
    required: [id, name, platform, billingType, rateMultiplier, type, accountCount, capacity, usage, status]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      platform: { type: string, minLength: 1, maxLength: 64 }
      billingType: { type: string, enum: [standard, subscription] }
      rateMultiplier: { type: number, minimum: 0.01, maximum: 100 }
      type: { type: string, enum: [public, dedicated] }
      accountCount: &admin_count_pair
        name: AdminCountPair
        type: object
        additionalProperties: false
        required: [available, total]
        properties:
          available: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      capacity:
        name: AdminCapacityPair
        type: object
        additionalProperties: false
        required: [used, total]
        properties:
          used: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      usage:
        name: AdminUsagePair
        type: object
        additionalProperties: false
        required: [today, total]
        properties:
          today: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      status: { type: string, enum: [active, disabled] }
  admin_coupon_item: &admin_coupon_item
    name: AdminCouponItem
    type: object
    additionalProperties: false
    required: [id, name, type, value, status]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      type: { type: string, enum: [amount, discount] }
      value: { type: string, minLength: 1, maxLength: 64 }
      status: { type: string, enum: [active, inactive] }
  admin_coupon_batch_item: &admin_coupon_batch_item
    name: AdminCouponBatchItem
    type: object
    additionalProperties: false
    required: [id, couponId, name, count, prefix, createdAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      couponId: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      count: { type: integer, minimum: 0, maximum: 1000000 }
      prefix: { type: string, minLength: 1, maxLength: 32 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
  admin_promo_code_item: &admin_promo_code_item
    name: AdminPromoCodeItem
    type: object
    additionalProperties: false
    required: [id, batchId, code, status]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      batchId: { type: string, minLength: 1, maxLength: 128 }
      code: { type: string, minLength: 1, maxLength: 128 }
      status: { type: string, enum: [available, claimed, used, voided] }
      usedBy: { type: string, maxLength: 254 }
      usedAt: { type: string, maxLength: 64 }
  admin_model_vendor_item: &admin_model_vendor_item
    name: AdminModelVendorItem
    type: object
    additionalProperties: false
    required: [id, vendorCode, name, status, color, description]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      vendorCode: { type: string, minLength: 1, maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 128 }
      status: { type: string, enum: [active, inactive] }
      color: { type: string, minLength: 1, maxLength: 64 }
      description: { type: string, maxLength: 512 }
  admin_ai_model_item: &admin_ai_model_item
    name: AdminAiModelItem
    type: object
    additionalProperties: false
    required: [id, vendorId, vendorCode, name, type, priceIn, priceOut, status, calls, description, modalities, inputModalities, outputModalities, apiFormat, capabilityIntro, limitations, supportedLanguages, useCases, trainingDataCutoff, contextTokens, maxOutputTokens, supportsStreaming, supportsTools, supportsJsonSchema, releaseStage, shelfState, routingState, replacementModel]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      vendorId: { type: string, minLength: 1, maxLength: 128 }
      vendorCode: { type: string, minLength: 1, maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 128 }
      type: { type: string, enum: [Chat, Image, Audio, Embedding, Music, SoundEffect, Video] }
      priceIn: { type: string, minLength: 1, maxLength: 64 }
      priceOut: { type: string, minLength: 1, maxLength: 64 }
      status: { type: string, enum: [active, inactive] }
      calls: { type: string, maxLength: 64 }
      description: { type: string, nullable: true, maxLength: 2048 }
      modalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      inputModalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      outputModalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      apiFormat: { type: string, nullable: true, maxLength: 128 }
      capabilityIntro: { type: string, nullable: true, maxLength: 4096 }
      limitations:
        type: array
        maxItems: 64
        items: { type: string, minLength: 1, maxLength: 512 }
      supportedLanguages:
        type: array
        maxItems: 128
        items: { type: string, minLength: 1, maxLength: 128 }
      useCases:
        type: array
        maxItems: 64
        items: { type: string, minLength: 1, maxLength: 256 }
      trainingDataCutoff: { type: string, nullable: true, maxLength: 128 }
      contextTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
      maxOutputTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
      supportsStreaming: { type: boolean }
      supportsTools: { type: boolean }
      supportsJsonSchema: { type: boolean }
      releaseStage: { type: integer, format: int64, nullable: true }
      shelfState: { type: integer, format: int64, nullable: true }
      routingState: { type: integer, format: int64, nullable: true }
      replacementModel: { type: string, nullable: true, maxLength: 128 }
  admin_skill_category_item: &admin_skill_category_item
    name: AdminSkillCategoryItem
    type: object
    additionalProperties: false
    required: [id, name, sortWeight, visible, status, type]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 255 }
      description: { type: string, maxLength: 512 }
      code: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      icon: { type: string, maxLength: 255 }
      sortWeight: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
      parentId: { type: string, nullable: true, maxLength: 128 }
      path: { type: string, maxLength: 1024, pattern: '^/' }
      visible: { type: boolean }
      status: { type: integer, format: int32 }
      type: { type: integer, format: int32, enum: [19, 20] }
  admin_skill_package_item: &admin_skill_package_item
    name: AdminSkillPackageItem
    type: object
    additionalProperties: false
    required: [id, packageKey, name, enabled, featured, sortWeight, tags, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      packageKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      name: { type: string, minLength: 1, maxLength: 255 }
      summary: { type: string, maxLength: 512 }
      description: { type: string, maxLength: 4000 }
      icon: { type: string, maxLength: 255 }
      coverImage: { type: string, maxLength: 255 }
      categoryId: { type: string, nullable: true, maxLength: 128 }
      enabled: { type: boolean }
      featured: { type: boolean }
      sortWeight: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
      tags:
        type: array
        maxItems: 64
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
      latestPublishedAt: { type: string, maxLength: 64 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_skill_item: &admin_skill_item
    name: AdminSkillItem
    type: object
    additionalProperties: false
    required: [id, skillKey, name, sourceType, marketStatus, visibility, reviewStatus, builtin, isBuiltin, enabled, featured, recommendWeight, currency, installCount, ratingAvg, ratingCount, tags, capabilities, configSchema, defaultConfig, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      skillKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      name: { type: string, minLength: 1, maxLength: 255 }
      summary: { type: string, maxLength: 512 }
      description: { type: string, maxLength: 4000 }
      icon: { type: string, maxLength: 255 }
      coverImage: { type: string, maxLength: 255 }
      categoryId: { type: string, nullable: true, maxLength: 128 }
      packageId: { type: string, nullable: true, maxLength: 128 }
      provider: { type: string, maxLength: 128 }
      version: { type: string, maxLength: 64 }
      versionName: { type: string, maxLength: 64 }
      runtime: { type: string, maxLength: 64 }
      entrypoint: { type: string, maxLength: 255 }
      manifestUrl: { type: string, maxLength: 500 }
      repositoryUrl: { type: string, maxLength: 500 }
      homepageUrl: { type: string, maxLength: 500 }
      documentationUrl: { type: string, maxLength: 500 }
      licenseName: { type: string, maxLength: 128 }
      sourceType: { type: string, enum: [OFFICIAL, COMMUNITY, ENTERPRISE, PRIVATE, CUSTOM] }
      marketStatus: { type: string, enum: [DRAFT, PUBLISHED, OFFLINE, DEPRECATED] }
      visibility: { type: string, enum: [PUBLIC, PRIVATE, UNLISTED] }
      reviewStatus: { type: string, enum: [PENDING, APPROVED, REJECTED] }
      reviewComment: { type: string, maxLength: 1000 }
      reviewedBy: { type: string, maxLength: 128 }
      reviewedAt: { type: string, maxLength: 64 }
      builtin: { type: boolean }
      isBuiltin: { type: boolean }
      enabled: { type: boolean }
      featured: { type: boolean }
      recommendWeight: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
      price: { type: string, nullable: true, pattern: '^\d+(?:\.\d{1,12})?$' }
      currency: { type: string, minLength: 1, maxLength: 16, pattern: '^[A-Z]+$' }
      installCount: { type: string, pattern: '^\d+$' }
      ratingAvg: { type: string, pattern: '^\d+(?:\.\d{1,2})?$' }
      ratingCount: { type: string, pattern: '^\d+$' }
      tags:
        type: array
        maxItems: 64
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
      capabilities:
        type: array
        maxItems: 64
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
      configSchema:
        type: object
        additionalProperties: true
      defaultConfig:
        type: object
        additionalProperties: true
      latestPublishedAt: { type: string, maxLength: 64 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_skill_asset_item: &admin_skill_asset_item
    name: AdminSkillAssetItem
    type: object
    additionalProperties: false
    required: [id, skillId, targetType, targetId, assetType, assetUrl, sortOrder, status, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      skillId: { type: string, minLength: 1, maxLength: 128 }
      targetType: { type: integer, format: int32, enum: [35] }
      targetId: { type: string, minLength: 1, maxLength: 128 }
      artifactId: { type: string, nullable: true, maxLength: 128 }
      assetType: { type: integer, format: int32, minimum: 0 }
      assetUrl: { type: string, minLength: 1, maxLength: 1024 }
      thumbnailUrl: { type: string, nullable: true, maxLength: 1024 }
      title: { type: string, nullable: true, maxLength: 255 }
      altText: { type: string, nullable: true, maxLength: 512 }
      mimeType: { type: string, nullable: true, maxLength: 128 }
      width: { type: integer, format: int32, nullable: true, minimum: 0 }
      height: { type: integer, format: int32, nullable: true, minimum: 0 }
      durationSeconds: { type: string, nullable: true, maxLength: 64 }
      fileSize: { type: integer, format: int64, nullable: true, minimum: 0 }
      sortOrder: { type: integer, format: int32, minimum: 0 }
      status: { type: integer, format: int32, minimum: 0 }
      publishedAt: { type: string, nullable: true, maxLength: 64 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_skill_artifact_item: &admin_skill_artifact_item
    name: AdminSkillArtifactItem
    type: object
    additionalProperties: false
    required: [id, skillId, targetType, targetId, artifactType, version, platformType, osName, artifactSizeBytes, frameworks, status, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      skillId: { type: string, minLength: 1, maxLength: 128 }
      targetType: { type: integer, format: int32, enum: [35] }
      targetId: { type: string, minLength: 1, maxLength: 128 }
      artifactType: { type: integer, format: int32, minimum: 0 }
      version: { type: string, minLength: 1, maxLength: 64 }
      platformType: { type: string, minLength: 1, maxLength: 128 }
      osName: { type: string, minLength: 1, maxLength: 128 }
      artifactRef: { type: string, nullable: true, maxLength: 1024 }
      artifactUrl: { type: string, nullable: true, maxLength: 1024 }
      artifactSizeBytes: { type: integer, format: int64, minimum: 0 }
      runtime: { type: string, nullable: true, maxLength: 64 }
      frameworks:
        type: array
        maxItems: 64
        uniqueItems: true
        example: [Rust service, OpenAI-compatible, React portal]
