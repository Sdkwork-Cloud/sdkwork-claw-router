                maxLength: 64
              isNew: { type: boolean }
              color: { type: string, minLength: 1, maxLength: 64 }
              winRate:
                type: number
                nullable: true
                minimum: 0
                maximum: 100
              pricing:
                type: string
                nullable: true
                maxLength: 128
              license:
                type: string
                nullable: true
                enum: [Open Source, Proprietary]
              strengths:
                type: array
                maxItems: 16
                items: { type: string, minLength: 1, maxLength: 64 }
              requests: { type: integer, format: int64, minimum: 0 }
              tokens: { type: integer, format: int64, minimum: 0 }
              cost: { type: number, minimum: 0 }
              currency: { type: string, minLength: 1, maxLength: 16 }
              trendScore:
                type: number
                nullable: true
        history:
          type: array
          maxItems: 60
          items:
            name: ModelRankingHistoryPoint
            type: object
            additionalProperties: false
            required: [date, index, entries]
            properties:
              date: { type: string, minLength: 1, maxLength: 64 }
              index: { type: integer, format: int64, minimum: 0 }
              entries:
                type: array
                maxItems: 500
                items:
                  name: ModelRankingHistoryEntry
                  type: object
                  additionalProperties: false
                  required: [model, catalogKey, rank, volume, color]
                  properties:
