                nullable: true
                maxLength: 64
              isNew: { type: boolean }
              color: { type: string, minLength: 1, maxLength: 64 }
              winRate:
                type: number
                nullable: true
                minimum: 0
                maximum: 100
              pricing:
                type: string
                nullable: true
                maxLength: 128
              license:
                type: string
                nullable: true
