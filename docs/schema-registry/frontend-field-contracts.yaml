    operation: fetchRuntimeRouteExplain
    operation_scope: app_shell
    operation_id: routeExplain.create
    kind: action
    api_surface: backend
    api_method: POST
    api_path: /backend/v3/api/ai/route_explain
    read_sources:
      - ai_api_key
      - ai_channel_group
      - ai_channel_group_member
      - ai_model_provider_route
