    write_tables: [ai_model_vendor, ai_model, ai_model_capability, ai_model_pricing, ai_pricing_import_snapshot, ops_audit_log]
    request_id_header: true
    request_schema:
      name: AdminModelCatalogSyncRequest
      required: []
      properties:
        source:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[A-Za-z0-9_-]+$"
          description: Optional catalog source label; defaults to sdkwork_models.
        mode:
          type: string
          enum: [official_refresh, vendor_refresh, catalog_version_refresh, dry_run]
          description: Refresh mode. dry_run previews without mutating catalog tables.
        vendorCodes:
          type: array
          maxItems: 32
          items:
            type: string
            minLength: 1
            maxLength: 64
            pattern: "^[A-Za-z0-9_-]+$"
          description: Optional vendor directory codes to refresh.
        force:
          type: boolean
          description: Whether to force refresh even when the selected catalog version is already installed.
        catalogRoot:
          type: string
          minLength: 1
          maxLength: 512
          description: Optional sdkwork-models project root. Overrides SDKWORK_MODELS_CATALOG_ROOT for this sync.
        catalogVersion:
          type: string
          minLength: 1
          maxLength: 128
          pattern: "^[A-Za-z0-9_.-]+$"
          description: Optional catalogVersion pin; sync fails if the loaded catalog differs.
    response_schema:
      name: AdminModelCatalogSyncResponse
      required:
        [synced, source, mode, dryRun, catalogVersion, vendorCodes, sourceHash, meterCount, vendorCount, familyCount, modelCount, capabilityCount, priceCount, rankingCount, acceptedCount, vendors, models]
      properties:
        synced:
          type: boolean
          description: Whether the catalog snapshot refresh completed.
        source:
          type: string
          description: Normalized catalog source label used for the sync.
        mode:
          type: string
          enum: [official_refresh, vendor_refresh, catalog_version_refresh, dry_run]
          description: Normalized sync mode executed by the backend.
        dryRun:
          type: boolean
          description: Whether this response represents an observation-only sync that did not mutate model catalog facts.
        catalogVersion:
          type: string
          minLength: 1
          maxLength: 128
          description: sdkwork-models catalogVersion loaded for this sync.
        requestedCatalogVersion:
          type: string
          nullable: true
          maxLength: 128
          description: Optional catalogVersion pin requested by the caller.
        catalogRoot:
          type: string
          nullable: true
          maxLength: 512
          description: Optional sdkwork-models project root requested by the caller.
        vendorCodes:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 64
          description: Actual vendor scope covered by the loaded catalog snapshot.
        sourceHash:
          type: string
          minLength: 64
          maxLength: 64
          pattern: "^[a-f0-9]{64}$"
          description: Stable SHA-256 hash of the selected sdkwork-models catalog scope, independent of request id, time, or snapshot id.
        meterCount:
          type: integer
          format: int64
          minimum: 0
          description: Shared sdkwork-models billing meter fact count considered by the sync.
        vendorCount:
          type: integer
          format: int64
          minimum: 0
          description: Selected vendor directory count considered by the sync.
        familyCount:
          type: integer
          format: int64
          minimum: 0
          description: Selected model family fact count considered by the sync.
        modelCount:
          type: integer
          format: int64
          minimum: 0
          description: Selected model definition fact count considered by the sync.
        capabilityCount:
          type: integer
          format: int64
          minimum: 0
          description: Generated model capability fact count considered by the sync.
        priceCount:
          type: integer
          format: int64
          minimum: 0
          description: Expanded pricing fact count considered by the sync.
        rankingCount:
          type: integer
          format: int64
          minimum: 0
          description: Selected ranking snapshot item count considered by the sync.
        acceptedCount:
          type: integer
          format: int64
          minimum: 0
          description: Total accepted standard fact count across meters, vendors, families, models, capabilities, prices, and rankings.
        snapshotId:
          type: string
          description: Pricing import snapshot identifier created by the sync.
        syncRunId:
          type: string
          description: Model catalog sync-run identifier created by the sync.
        vendors:
          type: array
          items:
            <<: *admin_model_vendor_item
          description: Current model vendor snapshots after sync.
        models:
          type: array
          items:
            <<: *admin_ai_model_item
          description: Current ai model snapshots after sync.
