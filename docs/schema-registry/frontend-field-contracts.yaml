routes:
  - route: /
    required_tables: [content_doc_page, plus_app]

  - route: /models
    required_tables: [ai_model_vendor, ai_model_vendor_region, ai_model, ai_model_capability, ai_model_pricing, ai_billing_meter]
    required_columns:
      ai_model_vendor: [vendor_code, display_name, color_token]
      ai_model_vendor_region: [vendor_code, region_code, display_name, market_scope, billing_currency, billing_jurisdiction]
      ai_model: [model, display_name, vendor_code, modalities, context_tokens, max_output_tokens, performance_profile, use_cases, training_data_cutoff]
      ai_model_capability: [model, capability, input_modalities, output_modalities, parameter_schema]
      ai_model_pricing: [model, price_side, billing_mode, billing_meter_code, unit_price, currency]

  - route: /models/:id
    required_tables: [ai_model_vendor, ai_model_vendor_region, ai_model, ai_model_capability, ai_model_pricing]
    required_columns:
      ai_model_vendor_region: [vendor_code, region_code, display_name, market_scope, billing_currency, billing_jurisdiction]
      ai_model: [model, display_name, vendor_code, capability_intro, limitations, supported_languages, api_format, performance_profile]
      ai_model_pricing: [model, price_side, unit_price, currency, effective_from, effective_to]

  - route: /models/:provider/:model
    required_tables: [ai_model_vendor, ai_model_vendor_region, ai_model, ai_model_capability, ai_model_pricing]
    required_columns:
      ai_model_vendor_region: [vendor_code, region_code, display_name, market_scope, billing_currency, billing_jurisdiction]
      ai_model: [model, display_name, vendor_code, provider_hint, model_aliases, docs_url]
      ai_model_pricing: [provider_code, provider_model, price_side, billing_meter_code, unit_price]

  - route: /rankings
    required_tables: [ai_model_vendor, ai_model, ai_model_rank_snapshot]
    required_columns:
      ai_model_vendor: [vendor_code, display_name]
      ai_model: [model, display_name, vendor_code]
      ai_model_rank_snapshot: [rank_no, previous_rank_no, model, vendor_code, modality, request_count, cost_amount, latency_p50_ms, win_rate, strengths]

  - route: /apps
    required_tables: [plus_app, plus_category, studio_catalog_action, studio_catalog_asset, studio_catalog_artifact]
    required_columns:
      plus_app: [name, description, icon_url, resource_list, platforms, install_config, release_notes, download_url]
      studio_catalog_action: [target_type, target_id, action_type, rating_score]
      studio_catalog_asset: [target_type, target_id, asset_type, asset_url, sort_order]
      studio_catalog_artifact: [target_type, target_id, artifact_type, version, platform_type, os_name, artifact_url, release_notes]

  - route: /apps/:id
    required_tables: [plus_app, plus_category, studio_catalog_action, studio_catalog_asset, studio_catalog_artifact]
    required_columns:
      plus_app: [name, description, icon_url, resource_list, platforms, install_config, release_notes, download_url]
      studio_catalog_asset: [target_type, target_id, asset_type, asset_url]
      studio_catalog_artifact: [target_type, target_id, version, artifact_size_bytes, artifact_url, published_at]

  - route: /auth/login
    required_tables: [iam_user, iam_user_identity, iam_credential, iam_session, iam_security_event, iam_audit_event]
    required_columns:
      iam_user: [tenant_id, username, display_name, email, phone, avatar_url, status]
