version: 0.1.0
schema: sdkwork-claw-router-frontend-field-contracts
rule: every actual portal route must be backed by explicit schema tables; page-critical fields must map to generated columns or Java-owned physical columns.
source: apps/sdkwork-clawrouter-pc/src/App.tsx
x_response_entities:
  admin_announcement_item:
    name: AdminAnnouncementItem
    type: object
    additionalProperties: false
    required: [id, title, target, status, showAsPopup, date, content]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      title: { type: string, minLength: 1, maxLength: 200 }
      target: { type: string, enum: [all, vip, free, beta] }
      status: { type: string, enum: [published, draft] }
      showAsPopup: { type: boolean }
      date: { type: string, minLength: 1, maxLength: 64 }
      content: { type: string, minLength: 1, maxLength: 20000 }
  admin_agent_version_item:
    name: AdminAgentVersionItem
    type: object
    additionalProperties: false
    required: [id, versionNo, releaseStatus, systemPrompt, toolPolicy, memoryPolicy, mcpPolicy, skillPolicy, runtimePolicy, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      versionNo: { type: integer, format: int64, minimum: 1 }
      releaseStatus: { type: string, enum: [draft, published, archived] }
      model: { type: string, nullable: true, maxLength: 128 }
      systemPrompt: { type: string, maxLength: 32768 }
      toolPolicy:
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      memoryPolicy:
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      mcpPolicy:
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      skillPolicy:
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      runtimePolicy:
        name: AgentPolicy
        type: object
        additionalProperties: true
        description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_agent_capabilities:
    name: AdminAgentCapabilities
    type: object
    additionalProperties: false
    required: [memoryEnabled, mcpServerCount, skillBindingCount]
    properties:
      memoryEnabled: { type: boolean }
      mcpServerCount: { type: integer, format: int64, minimum: 0 }
      skillBindingCount: { type: integer, format: int64, minimum: 0 }
  admin_agent_item:
    name: AdminAgentItem
    type: object
    additionalProperties: false
    required: [id, ownerUserId, code, name, description, visibility, status, createdAt, updatedAt, defaultVersion, capabilities]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      ownerUserId: { type: integer, format: int64, minimum: 1 }
      code: {type: string, minLength: 1, maxLength: 96, pattern: '^[a-z0-9][a-z0-9-]{0,95}$'}
      name: { type: string, minLength: 1, maxLength: 128 }
      description: { type: string, maxLength: 1024 }
      visibility: { type: string, enum: [private, organization, public] }
      status: { type: string, enum: [active, disabled] }
      avatar:
        $ref: '#/components/schemas/MediaResource'
        nullable: true
      templateSource: { type: string, nullable: true, maxLength: 128 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
      defaultVersion:
        name: AdminAgentVersionItem
        type: object
        additionalProperties: false
        required: [id, versionNo, releaseStatus, systemPrompt, toolPolicy, memoryPolicy, mcpPolicy, skillPolicy, runtimePolicy, createdAt, updatedAt]
        properties:
          id: { type: string, minLength: 1, maxLength: 128 }
          versionNo: { type: integer, format: int64, minimum: 1 }
          releaseStatus: { type: string, enum: [draft, published, archived] }
          model: { type: string, nullable: true, maxLength: 128 }
          systemPrompt: { type: string, maxLength: 32768 }
          toolPolicy:
            name: AgentPolicy
            type: object
            additionalProperties: true
            description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
          memoryPolicy:
            name: AgentPolicy
            type: object
            additionalProperties: true
            description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
          mcpPolicy:
            name: AgentPolicy
            type: object
            additionalProperties: true
            description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
          skillPolicy:
            name: AgentPolicy
            type: object
            additionalProperties: true
            description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
          runtimePolicy:
            name: AgentPolicy
            type: object
            additionalProperties: true
            description: Open JSON policy document validated by the agent runtime for model, tool, memory, MCP, skill, or execution settings.
          createdAt: { type: string, minLength: 1, maxLength: 64 }
          updatedAt: { type: string, minLength: 1, maxLength: 64 }
      capabilities:
        name: AdminAgentCapabilities
        type: object
        additionalProperties: false
        required: [memoryEnabled, mcpServerCount, skillBindingCount]
        properties:
          memoryEnabled: { type: boolean }
          mcpServerCount: { type: integer, format: int64, minimum: 0 }
          skillBindingCount: { type: integer, format: int64, minimum: 0 }
  admin_channel_item:
    name: AdminChannelItem
    type: object
    additionalProperties: false
    required: [id, channelId, name, vendor, channelType, protocol, accessType, credentialRotation, credentials, capabilities, resourceCodes, isMultimodal, weight, status, balance, errors, createdAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      channelId: { type: string, minLength: 1, maxLength: 128, pattern: '^[1-9][0-9]*$' }
      name: { type: string, minLength: 1, maxLength: 128 }
      vendor: { type: string, minLength: 1, maxLength: 64 }
      channelType: { type: string, enum: [official, relay] }
      protocol: { type: string, minLength: 1, maxLength: 64 }
      accessType: { type: string, minLength: 1, maxLength: 64 }
      credentialRotation: { type: string, enum: [default, priority, round_robin, weighted_round_robin, random] }
      credentials:
        type: array
        minItems: 0
        maxItems: 64
        items:
          name: AdminChannelCredentialItem
          type: object
          additionalProperties: false
          required: [id, credentialId, name, baseUrl, secretRef, maskedLabel, priority, weight, status, errors]
          properties:
            id: { type: string, minLength: 1, maxLength: 128 }
            credentialId: { type: string, minLength: 1, maxLength: 128, pattern: '^[1-9][0-9]*$' }
            name: { type: string, minLength: 1, maxLength: 128 }
            baseUrl: { type: string, minLength: 1, maxLength: 512, pattern: '^https?://[^\\s]+$' }
            secretRef: { type: string, minLength: 1, maxLength: 256, pattern: '^(vault|secret)://[^\\s]+$' }
            apiKey:
              type: string
              maxLength: 4096
              description: Plaintext provider API key returned only to authenticated admin management responses when available.
            maskedLabel: { type: string, minLength: 1, maxLength: 128 }
            priority: { type: integer, format: int64, minimum: 1, maximum: 1000000 }
            weight: { type: integer, format: int64, minimum: 1, maximum: 10000 }
            status: { type: string, enum: [active, disabled, error] }
            errors: { type: integer, format: int64, minimum: 0 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      expiresAt:
        type: string
        nullable: true
        maxLength: 64
        description: Optional channel account expiration timestamp. Null or absence means the channel account never expires.
      capabilities:
        type: array
        maxItems: 16
        items: { type: string, enum: [llm, image, audio, music, sfx, video] }
      resourceCodes:
        type: array
        maxItems: 256
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 192, pattern: '^[A-Za-z0-9._-]+$' }
      isMultimodal: { type: boolean }
      timeoutMs: { type: integer, format: int64, minimum: 1, maximum: 600000 }
      retryPolicy:
        name: ProviderRetryPolicy
        type: object
        additionalProperties: false
        required: [maxAttempts, retryableStatusCodes]
        properties:
          maxAttempts: { type: integer, minimum: 1, maximum: 5 }
          retryableStatusCodes:
            type: array
            maxItems: 8
            uniqueItems: true
            items: { type: integer, enum: [408, 409, 425, 429, 500, 502, 503, 504] }
          backoffMs: { type: integer, minimum: 0, maximum: 2000 }
      circuitBreakerPolicy:
        name: ProviderCircuitBreakerPolicy
        type: object
        additionalProperties: false
        required: [failureThreshold]
        properties:
          failureThreshold: { type: integer, minimum: 1, maximum: 100 }
      weight: { type: integer, format: int64, minimum: 1, maximum: 10000 }
      status: { type: string, enum: [active, disabled, error] }
      balance: { type: string, maxLength: 64 }
      errors: { type: integer, format: int64, minimum: 0 }
  admin_provider_secret_item:
    name: AdminProviderSecretItem
    type: object
    additionalProperties: false
    required: [id, providerCode, accountCode, name, authType, secretRef, maskedLabel, status, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      providerCode: { type: string, minLength: 1, maxLength: 64 }
      accountCode: { type: string, minLength: 1, maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 128 }
      authType: { type: string, maxLength: 64 }
      secretRef: { type: string, minLength: 1, maxLength: 256, pattern: '^(vault|secret)://[^\\s]+$' }
      maskedLabel: { type: string, minLength: 1, maxLength: 256 }
      status: { type: string, enum: [active, disabled] }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_channel_group_item:
    name: AdminChannelGroupItem
    type: object
    additionalProperties: false
    required: [id, groupCode, groupName, providerCode, priceReferenceMode, rateMultiplier, officialPriceMultiplier, groupType, accountCount, capacity, usage, status]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      groupCode: { type: string, minLength: 1, maxLength: 64 }
      groupName: { type: string, minLength: 1, maxLength: 128 }
      providerCode: { type: string, minLength: 1, maxLength: 64 }
      priceReferenceMode: { type: string, enum: [multiplier, official_price] }
      rateMultiplier: { type: number, minimum: 0.01, maximum: 100 }
      officialPriceMultiplier: { type: number, minimum: 0.01, maximum: 100 }
      groupType: { type: string, enum: [public, dedicated] }
      accountCount:
        name: AdminCountPair
        type: object
        additionalProperties: false
        required: [available, total]
        properties:
          available: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      capacity:
        name: AdminCapacityPair
        type: object
        additionalProperties: false
        required: [used, total]
        properties:
          used: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      usage:
        name: AdminUsagePair
        type: object
        additionalProperties: false
        required: [today, total]
        properties:
          today: { type: number, minimum: 0 }
          total: { type: number, minimum: 0 }
      status: { type: string, enum: [active, disabled] }
  promotion_offer_record:
    name: PromotionOfferRecord
    type: object
    additionalProperties: false
    required: [offer_no, offer_code, name, offer_type, audience_scope, combinability, status, tenant_id, created_at, updated_at]
    properties:
      offer_no: { type: string, minLength: 1, maxLength: 128 }
      offer_code: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      offer_type: { type: string, minLength: 1, maxLength: 64 }
      audience_scope: { type: string, minLength: 1, maxLength: 64 }
      combinability: { type: string, minLength: 1, maxLength: 64 }
      status: { type: string, minLength: 1, maxLength: 64 }
      tenant_id: { type: string, minLength: 1, maxLength: 128 }
      organization_id: { type: string, nullable: true, maxLength: 128 }
      current_offer_version_id: { type: string, nullable: true, maxLength: 128 }
      description: { type: string, nullable: true, maxLength: 1024 }
      starts_at: { type: string, nullable: true, maxLength: 64 }
      ends_at: { type: string, nullable: true, maxLength: 64 }
      created_by: { type: string, nullable: true, maxLength: 128 }
      updated_by: { type: string, nullable: true, maxLength: 128 }
      created_at: { type: string, minLength: 1, maxLength: 64 }
      updated_at: { type: string, minLength: 1, maxLength: 64 }
  promotion_coupon_stock_record:
    name: PromotionCouponStockRecord
    type: object
    additionalProperties: false
    required: [stock_no, name, title, offer_id, offer_version_id, stock_type, code_mode, issue_channel, currency_code, activation_status, can_resend, overspend_policy, status, tenant_id, created_at, updated_at]
    properties:
      stock_no: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 128 }
      title: { type: string, minLength: 1, maxLength: 128 }
      offer_id: { type: string, minLength: 1, maxLength: 128 }
      offer_version_id: { type: string, minLength: 1, maxLength: 128 }
      stock_type: { type: string, minLength: 1, maxLength: 64 }
      code_mode: { type: string, minLength: 1, maxLength: 64 }
      issue_channel: { type: string, minLength: 1, maxLength: 64 }
      currency_code: {type: string, pattern: '^[A-Z]{3}$'}
      activation_status: { type: string, minLength: 1, maxLength: 64 }
      can_resend: { type: boolean }
      status: { type: string, minLength: 1, maxLength: 64 }
      tenant_id: { type: string, minLength: 1, maxLength: 128 }
      organization_id: { type: string, nullable: true, maxLength: 128 }
      code_prefix: { type: string, nullable: true, maxLength: 32 }
      total_quantity: { type: string, nullable: true, maxLength: 32 }
      starts_at: { type: string, nullable: true, maxLength: 64 }
      expires_at: { type: string, nullable: true, maxLength: 64 }
      cancel_until: { type: string, nullable: true, maxLength: 64 }
      per_subject_limit: { type: string, nullable: true, maxLength: 32 }
      max_claims_per_subject: { type: integer, nullable: true, format: int64, minimum: 0 }
      max_claims_per_natural_person: { type: integer, nullable: true, format: int64, minimum: 0 }
      budget_account_id: { type: string, nullable: true, maxLength: 128 }
      budget_warning_threshold_bps: { type: integer, nullable: true, minimum: 0, maximum: 10000 }
      budget_stop_threshold_bps: { type: integer, nullable: true, minimum: 0, maximum: 10000 }
      overspend_policy: { type: string, minLength: 1, maxLength: 64 }
      stock_creator_merchant_id: { type: string, nullable: true, maxLength: 128 }
      created_by: { type: string, nullable: true, maxLength: 128 }
      updated_by: { type: string, nullable: true, maxLength: 128 }
      created_at: { type: string, minLength: 1, maxLength: 64 }
      updated_at: { type: string, minLength: 1, maxLength: 64 }
  promotion_code_record:
    name: PromotionCodeRecord
    type: object
    additionalProperties: false
    required: [code_no, offer_id, offer_version_id, stock_id, code_type, promotion_code_hash, activation_status, can_resend, currency_code, status, tenant_id, created_at, updated_at]
    properties:
      code_no: { type: string, minLength: 1, maxLength: 128 }
      offer_id: { type: string, minLength: 1, maxLength: 128 }
      offer_version_id: { type: string, minLength: 1, maxLength: 128 }
      stock_id: { type: string, minLength: 1, maxLength: 128 }
      code_type: { type: string, minLength: 1, maxLength: 64 }
      promotion_code_hash: { type: string, minLength: 1, maxLength: 256 }
      promotion_code_last4: { type: string, nullable: true, maxLength: 8 }
      claim_code_hash: { type: string, nullable: true, maxLength: 256 }
      claim_code_suffix: { type: string, nullable: true, maxLength: 16 }
      channel_code: { type: string, nullable: true, maxLength: 64 }
      activation_status: { type: string, minLength: 1, maxLength: 64 }
      can_resend: { type: boolean }
      currency_code: {type: string, pattern: '^[A-Z]{3}$'}
      status: { type: string, minLength: 1, maxLength: 64 }
      tenant_id: { type: string, minLength: 1, maxLength: 128 }
      organization_id: { type: string, nullable: true, maxLength: 128 }
      starts_at: { type: string, nullable: true, maxLength: 64 }
      expires_at: { type: string, nullable: true, maxLength: 64 }
      activated_at: { type: string, nullable: true, maxLength: 64 }
      canceled_at: { type: string, nullable: true, maxLength: 64 }
      cancel_until: { type: string, nullable: true, maxLength: 64 }
      created_by: { type: string, nullable: true, maxLength: 128 }
      updated_by: { type: string, nullable: true, maxLength: 128 }
      created_at: { type: string, minLength: 1, maxLength: 64 }
      updated_at: { type: string, minLength: 1, maxLength: 64 }
  admin_model_vendor_item:
    name: AdminModelVendorItem
    type: object
    additionalProperties: false
    required: [id, vendorCode, name, status, color, description]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      vendorCode: { type: string, minLength: 1, maxLength: 64 }
      name: { type: string, minLength: 1, maxLength: 128 }
      status: { type: string, enum: [active, inactive] }
      color: { type: string, minLength: 1, maxLength: 64 }
      description: { type: string, maxLength: 512 }
  admin_ai_model_region_price_input:
    name: AdminAiModelRegionPrice
    type: object
    additionalProperties: false
    description: Regional official reference pricing input for admin AI model commands.
    required: [regionCode, priceIn, priceOut]
    properties:
      regionCode:
        type: string
        minLength: 1
        maxLength: 64
        pattern: ^[a-z][a-z0-9_-]{0,63}$
        description: Model catalog pricing region code.
      priceIn:
        type: string
        pattern: ^[0-9]+(\.[0-9]{1,12})?$
        description: Official reference input unit price in USD.
      priceOut:
        type: string
        pattern: ^[0-9]+(\.[0-9]{1,12})?$
        description: Official reference output unit price in USD.
      cacheReadPrice:
        type: string
        pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
        description: Optional official reference cache-read unit price in USD.
      cacheWritePrice:
        type: string
        pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
        description: Optional official reference cache-write unit price in USD.
  admin_ai_model_item:
    name: AdminAiModelItem
    type: object
    additionalProperties: false
    required: [id, vendorId, vendorCode, model, displayName, name, type, regionPrices, status, calls, description, modalities, inputModalities, outputModalities, apiFormat, capabilityIntro, limitations, supportedLanguages, useCases, trainingDataCutoff,
      contextTokens, maxOutputTokens, supportsStreaming, supportsTools, supportsJsonSchema, releaseStage, shelfState, routingState, replacementModel]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      vendorId: { type: string, minLength: 1, maxLength: 128 }
      vendorCode: { type: string, minLength: 1, maxLength: 64 }
      model:
        type: string
        minLength: 1
        maxLength: 256
        pattern: ^[A-Za-z0-9._:/-]+$
        description: Runtime model identifier used for provider calls, routing, and pricing keys.
      displayName:
        type: string
        minLength: 1
        maxLength: 128
        description: Product display name. Falls back to model when no display name is configured.
      name:
        type: string
        minLength: 1
        maxLength: 128
        description: Compatibility display alias. Equal to displayName.
      type: { type: string, enum: [Chat, Image, Audio, Embedding, Music, SoundEffect, Video] }
      regionPrices:
        type: array
        minItems: 1
        maxItems: 32
        items:
          name: AdminAiModelRegionPrice
          type: object
          additionalProperties: false
          description: Regional official reference pricing returned by admin AI model payloads.
          required: [regionCode, priceIn, priceOut]
          properties:
            regionCode:
              type: string
              minLength: 1
              maxLength: 64
              pattern: ^[a-z][a-z0-9_-]{0,63}$
              description: Model catalog pricing region code.
            priceIn:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,12})?$
              description: Official reference input unit price in USD.
            priceOut:
              type: string
              pattern: ^[0-9]+(\.[0-9]{1,12})?$
              description: Official reference output unit price in USD.
            cacheReadPrice:
              type: string
              pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
              description: Optional official reference cache-read unit price in USD.
            cacheWritePrice:
              type: string
              pattern: ^$|^[0-9]+(\.[0-9]{1,12})?$
              description: Optional official reference cache-write unit price in USD.
      status: { type: string, enum: [active, inactive] }
      calls: { type: string, maxLength: 64 }
      description: { type: string, nullable: true, maxLength: 2048 }
      modalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      inputModalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      outputModalities:
        type: array
        maxItems: 16
        items: { type: string, minLength: 1, maxLength: 64 }
      apiFormat: { type: string, nullable: true, maxLength: 128 }
      capabilityIntro: { type: string, nullable: true, maxLength: 4096 }
      limitations:
        type: array
        maxItems: 64
        items: { type: string, minLength: 1, maxLength: 512 }
      supportedLanguages:
        type: array
        maxItems: 128
        items: { type: string, minLength: 1, maxLength: 128 }
      useCases:
        type: array
        maxItems: 64
        items: { type: string, minLength: 1, maxLength: 256 }
      trainingDataCutoff: { type: string, nullable: true, maxLength: 128 }
      contextTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
      maxOutputTokens: { type: integer, format: int64, nullable: true, minimum: 0 }
      supportsStreaming: { type: boolean }
      supportsTools: { type: boolean }
      supportsJsonSchema: { type: boolean }
      releaseStage: { type: integer, format: int64, nullable: true }
      shelfState: { type: integer, format: int64, nullable: true }
      routingState: { type: integer, format: int64, nullable: true }
      replacementModel: { type: string, nullable: true, maxLength: 128 }
  admin_skill_category_item:
    name: AdminSkillCategoryItem
    type: object
    additionalProperties: false
    required: [id, name, sortWeight, visible, status, type]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      name: { type: string, minLength: 1, maxLength: 255 }
      description: { type: string, maxLength: 512 }
      code: { type: string, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      icon:
        $ref: '#/components/schemas/MediaResource'
      sortWeight: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
      parentId: { type: string, nullable: true, maxLength: 128 }
      path: { type: string, maxLength: 1024, pattern: ^/ }
      visible: { type: boolean }
      status: { type: integer, format: int32 }
      type: { type: integer, format: int32, enum: [19, 20] }
  admin_skill_package_item:
    name: AdminSkillPackageItem
    type: object
    additionalProperties: false
    required: [id, packageKey, name, enabled, featured, sortWeight, tags, createdAt, updatedAt]
    properties:
      id: { type: string, minLength: 1, maxLength: 128 }
      packageKey: { type: string, minLength: 1, maxLength: 128, pattern: '^[A-Za-z0-9_-]+$' }
      name: { type: string, minLength: 1, maxLength: 255 }
      summary: { type: string, maxLength: 512 }
      description: { type: string, maxLength: 4000 }
      icon:
        $ref: '#/components/schemas/MediaResource'
      cover:
        $ref: '#/components/schemas/MediaResource'
      categoryId: { type: string, nullable: true, maxLength: 128 }
      enabled: { type: boolean }
      featured: { type: boolean }
      sortWeight: { type: integer, format: int32, minimum: -1000000, maximum: 1000000 }
      tags:
        type: array
        maxItems: 64
        uniqueItems: true
        items: { type: string, minLength: 1, maxLength: 64, pattern: '^[A-Za-z0-9._:-]+$' }
      latestPublishedAt: { type: string, maxLength: 64 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
