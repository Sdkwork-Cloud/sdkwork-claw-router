      checksumHash: { type: string, nullable: true, maxLength: 128, pattern: '^sha256:[a-f0-9]{64}$' }
      releaseNotes: { type: string, nullable: true, maxLength: 4000 }
      status: { type: integer, format: int32, minimum: 0 }
      publishedAt: { type: string, nullable: true, maxLength: 64 }
      deprecatedAt: { type: string, nullable: true, maxLength: 64 }
      createdAt: { type: string, minLength: 1, maxLength: 64 }
      updatedAt: { type: string, minLength: 1, maxLength: 64 }
  admin_rate_limit_item: &admin_rate_limit_item
    name: AdminRateLimitItem
