              requests: { type: integer, format: int64, minimum: 0 }
              tokens: { type: integer, format: int64, minimum: 0 }
              cost: { type: number, minimum: 0 }
              currency: { type: string, minLength: 1, maxLength: 16 }
              trendScore:
                type: number
                nullable: true
        history:
          type: array
          maxItems: 60
          items:
            name: ModelRankingHistoryPoint
            type: object
            additionalProperties: false
            required: [date, index, entries]
            properties:
              date: { type: string, minLength: 1, maxLength: 64 }
              index: { type: integer, format: int64, minimum: 0 }
              entries:
                type: array
                maxItems: 500
                items:
                  name: ModelRankingHistoryEntry
                  type: object
                  additionalProperties: false
                  required: [model, catalogKey, rank, volume, color]
                  properties:
                    model: { type: string, minLength: 1, maxLength: 128 }
                    catalogKey: { type: string, minLength: 1, maxLength: 256 }
                    rank: { type: integer, format: int64, minimum: 0 }
                    volume: { type: integer, format: int64, minimum: 0 }
                    color: { type: string, minLength: 1, maxLength: 64 }
