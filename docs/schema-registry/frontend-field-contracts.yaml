      name: ModelRankingsSnapshot
      required: [source, items, history]
      properties:
        source:
          name: ModelRankingsSource
          type: object
          additionalProperties: false
          required:
            [sourceLabel, sourceDescription, observedAt, snapshotDate, snapshotPeriod, windowStart, windowEnd, generatedAt, refreshIntervalSeconds, nextRefreshAt, cacheMaxAgeSeconds, rankScope, sourceTables]
          properties:
            sourceLabel: { type: string, minLength: 1, maxLength: 128 }
