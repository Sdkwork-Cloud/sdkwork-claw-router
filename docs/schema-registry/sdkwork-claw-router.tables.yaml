  - table: ops_job_execution
    domain: ops
    profile: event_log
    compliance_level: L2
    system_of_record: true
    write_owner: job-runtime
    common_columns: event_log
    frontend_routes: [/admin/monitor, /admin/model]
    api_surfaces: [backend, worker]
    columns:
      job_name: string(128)
      job_type: enum_int32
      trigger_type: enum_int32
      started_at: instant
      ended_at: instant
      duration_ms: int64
      execution_status: enum_int32
      processed_count: int64
      success_count: int64
      failure_count: int64
      failure_reason: string(1024)
      payload: json
    semantic_contracts:
      model_ranking_refresh:
        job_name: model_ranking_refresh
        job_type:
          code: 20
          label: model_ranking_refresh
        trigger_types:
          scheduled: 1
          manual: 2
        execution_status:
          running: 1
          succeeded: 2
          failed: 3
          empty: 4
          skipped: 5
        time_fields:
          started_at: instant_utc
          ended_at: instant_utc
        payload_contract:
          required_fields: [rankScope, snapshotDate, snapshotPeriod, windowStart, windowEnd, generatedCount, sourceCount, refreshIntervalSeconds, cacheMaxAgeSeconds, nextRefreshAt, status, attemptCount, retryCount, consecutiveFailureCount, alertRecommended, sourceTables]
          source_tables: [ai_usage_fact, ai_model, ai_model_rank_snapshot]
        runtime_contract:
          scheduler_owner: sdkwork-claw-app-api
          startup_policy:
            run_on_startup_default: true
            env: SDKWORK_CLAW_MODEL_RANKING_RUN_ON_STARTUP
          interval:
            default_millis: 3600000
            min_millis: 60000
            env: SDKWORK_CLAW_MODEL_RANKING_INTERVAL_MILLIS
          timeout:
            default_millis: 300000
            min_millis: 5000
            max_millis: 3600000
            env: SDKWORK_CLAW_MODEL_RANKING_RUN_TIMEOUT_MILLIS
          retry:
            max_retry_attempts_default: 1
            max_retry_attempts_max: 5
            retry_backoff_millis_default: 1000
            retry_backoff_millis_min: 100
            retry_backoff_millis_max: 60000
            max_retry_attempts_env: SDKWORK_CLAW_MODEL_RANKING_MAX_RETRY_ATTEMPTS
            retry_backoff_millis_env: SDKWORK_CLAW_MODEL_RANKING_RETRY_BACKOFF_MILLIS
          concurrency_lock:
            scope: [worker_instance, tenant_id, organization_id, rank_scope]
            overlap_behavior: audit_skipped
            skipped_execution_status: 5
          cache_invalidation:
            invalidate_after_status: [succeeded, empty]
            skip_after_status: [failed, skipped, disabled]
            scope: [tenant_id, organization_id, rank_scope]
          delayed_alerting:
            alert_after_consecutive_failures_default: 3
            alert_after_consecutive_failures_min: 1
            alert_after_consecutive_failures_max: 100
            alert_after_consecutive_failures_env: SDKWORK_CLAW_MODEL_RANKING_ALERT_AFTER_CONSECUTIVE_FAILURES
            alert_recommended_payload_field: alertRecommended
            alert_severity_payload_field: alertSeverity
    indexes:
      - { name: idx_ops_job_execution_name_started, columns: [job_name, started_at, id] }
      - { name: idx_ops_job_execution_status_started, columns: [execution_status, started_at, id] }
      - { name: idx_ops_job_execution_model_ranking_scope_started, columns: [tenant_id, organization_id, status, job_type, job_name, started_at, id] }

