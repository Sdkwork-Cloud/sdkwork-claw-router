domain_names:
  model_vendor:
    canonical_name: ModelVendor
    zh_name: 模型厂家
    description: 模型的原始研发/发布厂家，不等同于 API 接入供应商或路由渠道。
    persistence:
      table: ai_model_vendor
      code_column: vendor_code
      display_column: display_name
      db_type: string(64)
      store_as: stable_string_code
      never_store_as: enum_ordinal
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.ModelVendor
      rust: sdkwork_claw_router::domain::ModelVendor
      typescript: ModelVendor
      openapi: ModelVendor
    unknown_policy: preserve_raw_code_and_map_to_unknown
    builtin_values:
      - { code: openai, java: OPENAI, rust: OpenAi, label: OpenAI }
      - { code: anthropic, java: ANTHROPIC, rust: Anthropic, label: Anthropic }
      - { code: google, java: GOOGLE, rust: Google, label: Google DeepMind / Gemini }
      - { code: alibaba, java: ALIBABA, rust: Alibaba, label: Alibaba }
      - { code: baidu, java: BAIDU, rust: Baidu, label: Baidu }
      - { code: black_forest_labs, java: BLACK_FOREST_LABS, rust: BlackForestLabs, label: Black Forest Labs }
      - { code: bytedance, java: BYTEDANCE, rust: ByteDance, label: ByteDance }
      - { code: deepseek, java: DEEPSEEK, rust: DeepSeek, label: DeepSeek }
      - { code: elevenlabs, java: ELEVENLABS, rust: ElevenLabs, label: ElevenLabs }
      - { code: kuaishou, java: KUAISHOU, rust: Kuaishou, label: Kuaishou }
      - { code: minimax, java: MINIMAX, rust: MiniMax, label: MiniMax }
      - { code: moonshot, java: MOONSHOT, rust: Moonshot, label: Moonshot AI }
      - { code: xai, java: XAI, rust: Xai, label: xAI }
      - { code: stability_ai, java: STABILITY_AI, rust: StabilityAi, label: Stability AI }
      - { code: suno, java: SUNO, rust: Suno, label: Suno }
      - { code: tencent, java: TENCENT, rust: Tencent, label: Tencent }
      - { code: zhipu, java: ZHIPU, rust: Zhipu, label: Zhipu AI }
      - { code: custom, java: CUSTOM, rust: Custom, label: Custom Vendor }
      - { code: unknown, java: UNKNOWN, rust: Unknown, label: Unknown Vendor }
  integration_provider_type:
    canonical_name: IntegrationProviderType
    zh_name: Integration provider type
    description: Stable integration provider business type. A provider can be the original model vendor direct API, a cloud platform, another relay or aggregator, a self-hosted gateway, a local runtime, or a custom integration.
    db_type: enum_int32
    api_serialization: stable_string_code
    persistence:
      table: integration_provider
      code_column: integration_type
      display_column: display_name
      store_as: stable_int_code
      never_store_as: enum_ordinal
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.IntegrationProviderType
      rust: sdkwork_claw_router::domain::IntegrationProviderType
      typescript: IntegrationProviderType
      openapi: IntegrationProviderType
    unknown_policy: preserve_raw_code_and_map_to_unknown
    builtin_values:
      - { code: unknown, int_code: 0, label: Unknown integration provider type }
      - { code: model_vendor_direct, int_code: 1, label: Model vendor direct API }
      - { code: cloud_platform, int_code: 2, label: Cloud platform provider }
      - { code: relay_aggregator, int_code: 3, label: Relay or aggregator provider }
      - { code: self_hosted_gateway, int_code: 4, label: Self-hosted gateway }
      - { code: local_runtime, int_code: 5, label: Local runtime }
      - { code: custom, int_code: 6, label: Custom integration }
  price_side:
    canonical_name: PriceSide
    zh_name: 价格侧
    description: 同一模型价格的语义侧，区分官方参考价、供应商成本价、客户销售价和内部结算价。
    db_type: enum_int32
    api_serialization: stable_string_code
    builtin_values:
      - { code: official_reference, label: 官方参考价 }
      - { code: upstream_cost, label: 上游供应商成本价 }
      - { code: customer_charge, label: 客户销售价 }
      - { code: internal_transfer, label: 内部结算价 }
  billing_mode:
    canonical_name: BillingMode
    zh_name: 计费模式
    description: 定价公式的执行模式，吸收 new-api 的 ratio/price/tiered_expr 和 sub2api 的 token/per_request/image 模式，并支持未来 API 按结果、按个数、按存储量等计费。
    db_type: enum_int32
    api_serialization: stable_string_code
    builtin_values:
      - { code: token, label: Token 计费 }
      - { code: fixed_price, label: 固定单价 }
      - { code: per_request, label: 按请求计费 }
      - { code: per_result, label: 按结果计费 }
      - { code: per_item, label: 按个数计费 }
      - { code: duration, label: 按时长计费 }
      - { code: character, label: 按字符计费 }
      - { code: storage, label: 按存储量计费 }
      - { code: bandwidth, label: 按流量计费 }
      - { code: tiered, label: 阶梯计费 }
      - { code: expression, label: 表达式计费 }
      - { code: image, label: 图片计费 }
      - { code: audio, label: 音频计费 }
      - { code: video, label: 视频计费 }
  billing_meter:
    canonical_name: BillingMeter
    zh_name: 计费计量表
    description: 统一定义 LLM、图片、语音、视频、音乐、音效和未来 API 的可计费维度，例如 input_token、image_result、audio_second、video_second、api_result、api_item。
    persistence:
      table: ai_billing_meter
      code_column: meter_code
      display_column: display_name
    type_bindings:
      java: com.sdkwork.claw.router.domain.enums.BillingMeter
      rust: sdkwork_claw_router::domain::BillingMeter
      typescript: BillingMeter
      openapi: BillingMeter
    builtin_values:
      - { code: llm_input_token, label: LLM input token }
      - { code: llm_output_token, label: LLM output token }
      - { code: llm_reasoning_token, label: LLM reasoning token }
      - { code: llm_cache_write_token, label: LLM cache write token }
      - { code: llm_cache_read_token, label: LLM cached input read token }
      - { code: llm_cache_storage_token_hour, label: LLM cache storage token-hour }
      - { code: embedding_input_token, label: Embedding input token }
      - { code: embedding_image, label: Embedding image input }
      - { code: image_input_token, label: Image input token }
      - { code: image_output_token, label: Image output token }
      - { code: image_result, label: Image result }
      - { code: image_pixel, label: Image pixel }
      - { code: image_megapixel, label: Image megapixel }
      - { code: audio_input_token, label: Audio input token }
      - { code: audio_output_token, label: Audio output token }
      - { code: audio_input_second, label: Audio input second }
      - { code: audio_output_second, label: Audio output second }
      - { code: audio_input_minute, label: Audio input minute }
      - { code: audio_output_minute, label: Audio output minute }
      - { code: tts_input_character, label: Text-to-speech input character }
      - { code: speech_character, label: Speech character }
      - { code: stt_audio_minute, label: Speech-to-text audio minute }
      - { code: video_input_token, label: Video input token }
      - { code: video_output_token, label: Video output token }
      - { code: video_input_second, label: Video input second }
      - { code: video_output_second, label: Video output second }
      - { code: video_result, label: Video result }
      - { code: music_output_second, label: Music output second }
      - { code: sfx_result, label: Sound-effect result }
      - { code: rerank_search, label: Rerank search }
      - { code: rerank_document, label: Rerank document }
      - { code: api_request, label: API request }
      - { code: api_result, label: API result }
      - { code: api_item, label: API item }
      - { code: tool_call, label: Tool call }
      - { code: web_search_call, label: Web search call }
      - { code: file_search_call, label: File search call }
      - { code: code_interpreter_session, label: Code interpreter session }
      - { code: container_session, label: Container session }
      - { code: storage_gb_day, label: Storage GB-day }
      - { code: bandwidth_gb, label: Bandwidth GB }
      - { code: unknown, label: Unknown billing meter }
  pricing_plan:
    canonical_name: PricingPlan
    zh_name: 定价方案
    description: 可绑定到 API Key 分组、API Key、VIP、租户、用户或 SKU 的价格策略方案，默认可按官方参考价倍率派生销售价。
    persistence:
      table: ai_pricing_plan
      code_column: plan_code
      display_column: plan_name
  pricing_formula_mode:
    canonical_name: PricingFormulaMode
    zh_name: 定价公式模式
    description: 价格规则如何从参考价生成最终价格。
