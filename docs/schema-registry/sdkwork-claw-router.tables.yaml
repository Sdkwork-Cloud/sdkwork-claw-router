legacy_java_contracts:
  finance_and_trade:
    source_of_truth: spring-ai-plus-business-entity
    compatibility_rule: keep_physical_structure_identical
    account:
      tables: [plus_account, plus_account_history, plus_account_exchange_config, plus_ledger_bridge]
      entities:
        plus_account: com.sdkwork.spring.ai.plus.entity.account.PlusAccountEntity
        plus_account_history: com.sdkwork.spring.ai.plus.entity.account.PlusAccountHistoryEntity
        plus_account_exchange_config: com.sdkwork.spring.ai.plus.entity.account.PlusAccountExchangeConfigEntity
        plus_ledger_bridge: com.sdkwork.spring.ai.plus.entity.account.PlusLedgerBridge
      app_api: [/app/v3/api/account, /app/v3/api/account/cash, /app/v3/api/account/points, /app/v3/api/wallet]
      backend_api: [/backend/v3/api/account, /backend/v3/api/account/history, /backend/v3/api/account/exchange-config, /backend/v3/api/account/ledger-bridge, /backend/v3/api/finance/admin]
    order:
      tables: [plus_order, plus_order_item, plus_shopping_cart, plus_shopping_cart_item, plus_order_dispatch_rule, plus_order_worker_dispatch_profile]
      entities:
        plus_order: com.sdkwork.spring.ai.plus.entity.trade.PlusOrder
        plus_order_item: com.sdkwork.spring.ai.plus.entity.trade.PlusOrderItem
        plus_shopping_cart: com.sdkwork.spring.ai.plus.entity.trade.PlusShoppingCart
