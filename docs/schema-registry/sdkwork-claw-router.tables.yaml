      - { code: multiplier, label: 参考价倍率 }
      - { code: multiplier_plus_offset, label: 倍率加固定加价 }
      - { code: tiered, label: 阶梯规则 }
      - { code: expression, label: 表达式规则 }

tables:
  - table: system_installation_state
    domain: system
    profile: installation_state
    compliance_level: L3
    system_of_record: true
    write_owner: database-installer
    generated_by_this_project: true
    frontend_routes: [/admin/dashboard]
    api_surfaces: [backend, worker]
    primary_key: id
    columns:
      id: int64
      installation_id: string(64)
      environment: string(64)
      database_engine: string(32)
      schema_version: string(64)
      catalog_version: string(128)
      seed_profile: string(64)
      status: string(32)
      installed_at: instant
      upgraded_at: instant
      last_checked_at: instant
      metadata: json
    required_columns: [id, installation_id, environment, database_engine, schema_version, catalog_version, seed_profile, status, metadata]
    indexes:
      - { name: uk_system_installation_state_installation_id, unique: true, columns: [installation_id] }
      - { name: idx_system_installation_state_env_status, columns: [environment, status, last_checked_at] }

  - table: system_schema_migration
    domain: system
    profile: installation_migration_log
    compliance_level: L3
    system_of_record: true
    write_owner: database-installer
    generated_by_this_project: true
    frontend_routes: [/admin/dashboard]
    api_surfaces: [backend, worker]
    primary_key: id
    columns:
      id: int64
      migration_key: string(128)
      migration_version: string(128)
      checksum: string(128)
      status: string(32)
      started_at: instant
      finished_at: instant
      error_message: text
    required_columns: [id, migration_key, migration_version, checksum, status, started_at]
    indexes:
      - { name: uk_system_schema_migration_key, unique: true, columns: [migration_key] }
      - { name: idx_system_schema_migration_status_started, columns: [status, started_at, id] }

