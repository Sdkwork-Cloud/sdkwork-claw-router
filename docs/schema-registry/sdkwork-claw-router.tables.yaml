schema_registry:
  name: sdkwork-claw-router
  version: 0.1.0
  date: 2026-04-28
  standard: ../DATABASE_SPEC.md
  source_docs:
    - ../18-SkillsHub-AgentSkills-PlusCategory-compatible-design.md
    - ../19-Finance-Trade-Java-compatible-design.md
    - ../05-数据库设计.md
    - ../11-数据契约与核心表设计.md
    - ../12-前端功能模块与数据库表结构映射.md
    - ../13-页面级数据结构覆盖与SchemaRegistry落地设计.md
    - ../14-数据结构细节复核与补强记录.md
    - ../15-new-api-sub2api价格体系对比与ClawRouter定价设计.md
  api_prefixes:
    app: "/app/v3/api"
    backend: "/backend/v3/api"
    openai_compatible: "/v1"
  serialization:
    int64: string
    decimal: string
    instant: iso8601_utc
    enum: forward_compatible
  naming_guardrails:
    allowed_new_prefixes: [system, iam, integration, ai, commerce, studio, content, ops]
    legacy_prefixes: [plus]
    forbidden_new_prefixes: [claw, router, sdkwork, console, admin, portal]
  legacy_compatibility_guardrails:
    java_entity_first_required: true
    rule: before adding a new table, search spring-ai-plus-business-entity first; if a Plus* entity exists, register the existing plus_* table as L0 legacy_compatible and keep the physical structure identical.
    protected_domains:
      - user
      - account
      - vip
      - coupon
      - order
      - payment
      - refund
      - invoice
      - app
      - skill
      - category
      - feeds
      - comments
      - favorite
      - vote
    forbidden_synonym_tables:
      - commerce_order
      - commerce_payment
      - commerce_refund
      - commerce_invoice
      - commerce_account
      - commerce_coupon
      - commerce_vip
      - router_order
      - router_payment
      - router_account
      - router_refund
      - router_invoice
      - sdkwork_order
      - sdkwork_payment
      - sdkwork_account
      - sdkwork_refund
      - sdkwork_invoice
    allowed_projection_exception: commerce_* tables may only store router usage settlement, statement, export, and analytics projections; they must not replace plus_order, plus_payment, plus_refund, plus_invoice, plus_account, plus_coupon, or plus_vip_*.
  common_column_groups:
    tenant_entity:
      - id
      - uuid
      - tenant_id
      - organization_id
      - data_scope
      - status
      - created_at
      - updated_at
      - version
      - deleted_at
      - deleted_by
      - metadata
    user_entity:
      - id
      - uuid
      - tenant_id
      - organization_id
      - user_id
      - owner_type
      - owner_id
      - data_scope
      - status
      - created_at
      - updated_at
      - version
      - deleted_at
      - deleted_by
      - metadata
    event_log:
      - id
      - uuid
      - tenant_id
      - organization_id
      - user_id
      - request_id
      - trace_id
      - payload_hash
      - status
      - created_at
      - retention_until
      - legal_hold
      - metadata
    audit_log:
      - id
      - uuid
      - tenant_id
      - organization_id
      - request_id
      - trace_id
      - operator_id
      - action
      - target_type
      - target_id
      - created_at
      - retention_until
      - legal_hold
      - metadata
    projection:
      - id
      - uuid
      - tenant_id
      - organization_id
      - source_type
      - source_id
      - source_version
      - status
      - created_at
      - updated_at
      - rebuild_version
      - metadata

domains:
  iam:
    owner: identity-access
    bounded_context: identity-access
  integration:
    owner: provider-integration
    bounded_context: provider-integration
  ai:
    owner: ai-gateway
    bounded_context: ai-routing-metering
  commerce:
    owner: commerce-projection
