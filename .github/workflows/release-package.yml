name: Release Package

on:
  workflow_dispatch:
    inputs:
      package_version:
        description: Package version used in artifact names and manifests.
        required: true
        default: 0.3.0
  push:
    tags:
      - v*
      - '*.*.*'

permissions:
  contents: write
  actions: read

jobs:
  package:
    name: Build release install packages
    runs-on: windows-latest
    env:
      CLAWROUTER_DOWNLOAD_CDN_BASE_URL: ${{ vars.CLAWROUTER_DOWNLOAD_CDN_BASE_URL }}
      PACKAGE_VERSION: ${{ github.event.inputs.package_version || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Verify release package plan
        run: pnpm install:packages:check

      - name: Build release install packages
        run: pnpm install:package:build -- --all --version "$env:PACKAGE_VERSION"
        shell: pwsh

      - name: Validate built install package payloads
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $manifestPath = "dist/install-packages/install-packages-manifest.json"
          $manifest = Get-Content $manifestPath -Raw | ConvertFrom-Json
          foreach ($archive in $manifest.archives) {
            $packageId = $archive.packageId
            $file = Get-Item (Join-Path "dist/install-packages" $archive.file)
            node scripts/validate-claw-router-install-artifacts.mjs --package-id $packageId --artifact-path $file.FullName --version "$env:PACKAGE_VERSION"
          }

      - name: Refresh download metadata
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $downloadArgs = @("--version", "$env:PACKAGE_VERSION")
          if ($env:CLAWROUTER_DOWNLOAD_CDN_BASE_URL) {
            $downloadArgs += @("--cdn-base-url", $env:CLAWROUTER_DOWNLOAD_CDN_BASE_URL)
          }
          node scripts/update-claw-router-downloads.mjs @downloadArgs
