apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-clawrouter-app-api
  labels:
    app: sdkwork-clawrouter
    component: app-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdkwork-clawrouter
      component: app-api
  template:
    metadata:
      labels:
        app: sdkwork-clawrouter
        component: app-api
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: app-api
          image: registry.sdkwork.com/apps/sdkwork-clawrouter:0.3.0
          command: ["sdkwork-clawrouter-app-api-server"]
          ports:
            - containerPort: 18082
              name: http
          env:
            - name: SDKWORK_CLAW_DEPLOYMENT_MODE
              value: cloud
            - name: SDKWORK_CLAW_CONFIG_FILE
              value: /etc/sdkwork/clawrouter.toml
            - name: SDKWORK_CLAW_APP_API_BIND
              value: 0.0.0.0:18082
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          secret:
            secretName: sdkwork-clawrouter-config
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-clawrouter-app-api
spec:
  selector:
    app: sdkwork-clawrouter
    component: app-api
  ports:
    - name: http
      port: 18082
      targetPort: http
