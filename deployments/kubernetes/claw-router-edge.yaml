apiVersion: apps/v1
kind: Deployment
metadata:
  name: sdkwork-clawrouter-edge
  labels:
    app: sdkwork-clawrouter
    component: edge
spec:
  replicas: 2
  selector:
    matchLabels:
      app: sdkwork-clawrouter
      component: edge
  template:
    metadata:
      labels:
        app: sdkwork-clawrouter
        component: edge
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: edge
          image: registry.sdkwork.com/apps/sdkwork-clawrouter:latest
          ports:
            - containerPort: 3900
              name: http
          env:
            - name: SDKWORK_CLAW_DEPLOYMENT_MODE
              value: kubernetes
            - name: SDKWORK_CLAW_CONFIG_FILE
              value: /etc/sdkwork/clawrouter.toml
          volumeMounts:
            - name: config
              mountPath: /etc/sdkwork
              readOnly: true
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      volumes:
        - name: config
          secret:
            secretName: sdkwork-clawrouter-config
---
apiVersion: v1
kind: Service
metadata:
  name: sdkwork-clawrouter-edge
spec:
  selector:
    app: sdkwork-clawrouter
    component: edge
  ports:
    - name: http
      port: 3900
      targetPort: http
